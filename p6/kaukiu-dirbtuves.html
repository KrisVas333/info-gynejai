<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaukių dirbtuvės</title>
<!--
  ══ BCJR P6 · KAUKIŲ DIRBTUVĖS · variantas A „Pro sandėlio duris“ (~6 min) ══
  Didysis ekranas, MENTORIAUS kompiuteris. Vaikai ateina po vieną ir naudoja mentoriaus pelę.
  Mentoriaus mygtukai: ➡ (kitas etapas, viršuj dešinėj) · ⬅ atgal · ⟲ etapą iš naujo.
  Paslėptas sąrašas: surink t-e-s-t → šuoliai į bet kurį etapą/būseną. Esc uždaro.

  1 · KAUKĖ AR VARDAS? — fonas: sandėliuko durys iš deck'o (comics/p06-kauke/02-uzrakintas-sandeliukas.png).
      10 kortelių (2 eilės po 5), virš kiekvienos — žalias slapyvardis (kaip vartų Sargybinio). Verdiktas pagal SLAPYVARDĮ.
      Paėmus kortelę slapyvardis perskaitomas. Klasė balsuoja KŪNU: 🙌 = gera kaukė · 🙅 = išduoda.
      Gera (6) → ant skenerio ant durų, spyna +1 (6 langeliai). Išduodanti (Miste2005, Ona7metai, RokasRiese, LinaPetraite)
      → durys sudreba, Šešėlio akys, balsas pasako KODĖL (metai / amžius / miestas / vardas+pavardė), kortelė į 🙅 krūvą.
      LinaPetraite su saulės kauke: graži kaukė, bet tikras vardas — skaičiuojasi VARDAS.
  2 · UŽSIDĖK KAUKĘ — NAUJAS įgūdis: DU KARTUS spustelėti dramblio kaukę → ji nuskrenda ant Klaido veido.
      Vienas spustelėjimas → kaukė sukrusteli, rodoma „du kartus!“. Durys: 🎭 ✅ · 🔑 ❔ — slaptažodis vis tiek reikalingas.
  3 · KLASĖS KAUKĖ — klasė išrenka būtybę ir savybę. Vienas vaikas tempia būtybę ant tuščios kaukės,
      kitas — savybę. Trečias du kartus spusteli → kaukė uždedama, slapyvardis parašomas ir perskaitomas.
      Tada 🔍 „Ar padės mane SURASTI?“ → ✓. Mentorius gali rašyti slapyvardį lentoje su Shift (pavyzdys prieš Kalvę).
  Kaukių PNG: dirbtuves-assets/img/p06-kaukes/*.png (sumažintos kopijos iš assets/brainclub-jr-v2/p06-kaukes, ≤1000 px — veikia ir lokaliai, ir Pages) — jei failo nėra, rodomas pieštas pakaitalas.
  Garsas: dirbtuves-assets/*.mp3 (ElevenLabs eleven_v4); jei failo nėra — naršyklės lietuviškas balsas.
-->
<style>
:root{
  --bg:#0C1030;--card:#1B1550;--ink:#fff;--soft:#C3B9F0;
  --purple:#8A6BFF;--klaidas:#FF8A3D;--cyan:#24C9EC;--gold:#FFC53D;
  --green:#1FB47A;--red:#E8503F;--raso:#7ee787;--tw:#3CFF7A;
  --display:'SF Pro Rounded',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:var(--display);user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#241a52 0%,#0C1030 70%)}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* ── viršus ── */
.top{position:absolute;left:0;right:0;top:0;height:120px;display:flex;align-items:center;padding:0 40px;gap:26px;z-index:40}
.title{text-shadow:0 4px 10px #000;font-size:52px;font-weight:900;letter-spacing:.01em;display:flex;align-items:center;gap:18px}
.title .ti{font-size:66px}
.dots{position:absolute;z-index:45;left:50%;top:36px;transform:translateX(-50%);display:flex;gap:16px}
.dots i{width:26px;height:26px;border-radius:50%;background:#ffffff26;border:3px solid #ffffff44}
.dots i.on{background:var(--gold);border-color:#fff}
.dots i.done{background:var(--green)}
.mbtn{position:absolute;top:18px;z-index:50;border:4px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:26px;
  font:900 54px/1 var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center}
#next{right:30px;width:150px;height:96px;background:var(--purple);border-color:#fff;font-size:64px}
#next.pulse{animation:pulseN 1s ease-in-out infinite;background:var(--green)}
@keyframes pulseN{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #1fb47a99}50%{transform:scale(1.1);box-shadow:0 0 0 22px #1fb47a00}}
#prev{right:200px;width:84px;height:84px;top:24px;font-size:40px;opacity:.6}
#reset{right:300px;width:84px;height:84px;top:24px;font-size:40px;opacity:.6}
#snd{right:410px;top:18px;width:110px;height:96px;font-size:56px;z-index:60;background:#ffffff22;border-color:#fff}
#snd.off{background:#E8503F66}

/* ── durys (piešta CSS) ── */
.door{position:absolute;border-radius:18px 18px 6px 6px;
  background:repeating-linear-gradient(90deg,#7a4a26 0 70px,#6a3f1f 70px 74px);
  border:12px solid #4a2a12;box-shadow:inset 0 0 0 6px #8d5a30,0 30px 60px -20px #000}
.door::before,.door::after{content:"";position:absolute;left:8%;right:8%;height:22px;background:#4a2a12;border-radius:6px}
.door::before{top:22%}.door::after{bottom:18%}
.door .knob{position:absolute;right:9%;top:52%;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a0,#c48a1a);box-shadow:0 4px 8px #0008}
.door .roof{position:absolute;left:-60px;right:-60px;top:-110px;height:100px;background:#3a2212;
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.door .lock{position:absolute;left:10%;right:10%;top:6%;height:64px;display:flex;gap:10px;padding:10px;
  background:#1b1030;border-radius:16px;border:4px solid #000;z-index:2}
.door .lock i{flex:1;border-radius:8px;background:#3a2f5a;transition:background .3s,box-shadow .3s}
.door .lock i.f{background:var(--green);box-shadow:0 0 18px var(--green)}
.door .signs{position:absolute;left:8%;right:8%;top:30%;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:2}
.door .sign{background:#fff5dd;color:#2a1a0a;border:5px solid #3a2212;border-radius:20px;padding:6px 18px;font-size:64px;line-height:1.1;display:flex;gap:12px;align-items:center}
.door .sign b{display:inline-block;min-width:1.1em;text-align:center}
.door.bad{animation:shake .55s}
.door.bad::marker{}
.door .redflash{position:absolute;inset:-12px;border-radius:18px;background:#E8503F;opacity:0;pointer-events:none;z-index:3}
.door.bad .redflash{animation:redf .9s}
@keyframes redf{0%{opacity:0}15%{opacity:.6}100%{opacity:0}}
.door.win{box-shadow:inset 0 0 0 6px #8d5a30,0 0 0 10px #1fb47a88,0 0 90px 10px var(--green)}
@keyframes shake{0%,100%{translate:0}15%{translate:-22px}30%{translate:22px}45%{translate:-16px}60%{translate:16px}75%{translate:-8px}90%{translate:8px}}
.shake{animation:shake .55s}

/* ── sandėliuko paveikslas (iš deck'o, 02-uzrakintas-sandeliukas.png) ── */
#door1{position:absolute;inset:0;overflow:hidden}
#door1 .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#door1 .redflash{position:absolute;inset:0;background:#E8503F;opacity:0;pointer-events:none;z-index:3}
#door1.bad .redflash{animation:redf .9s}
#door1.bad{animation:shake .55s}
#door1 .winglow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 160px 40px var(--green)}
#door1.win .winglow{opacity:1}
#door1 .topfade{position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(#0C1030dd,#0C103000)}
#door1 .botfade{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(#0C103000,#0C1030cc 30%,#0C1030ee)}
#lock1{position:absolute;left:640px;top:128px;width:640px;height:64px;display:flex;gap:10px;padding:10px;background:#1b1030ee;border-radius:16px;border:4px solid #000;z-index:4;box-shadow:0 8px 20px #000a}
#lock1 i{flex:1;border-radius:8px;background:#3a2f5a;transition:background .3s,box-shadow .3s}
#lock1 i.f{background:var(--green);box-shadow:0 0 18px var(--green)}
#sign1{position:absolute;left:1296px;top:120px;z-index:4;background:#fff5dd;color:#2a1a0a;border:5px solid #3a2212;border-radius:20px;padding:4px 14px;font-size:56px;line-height:1.1;display:flex;gap:10px;align-items:center}
.door.photo{background:#000;border:10px solid #3a2212;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.door.photo::before,.door.photo::after{display:none}
.door.photo .dimg{position:absolute;height:auto;max-width:none}
.door.photo .redflash{inset:0}
/* ── slapyvardžio žyma (kaip vartų Sargybinio #tag) ── */
.card .tag{position:absolute;left:50%;top:-62px;transform:translateX(-50%);white-space:nowrap;background:#06140bdd;border:4px solid var(--tw);border-radius:16px;
  padding:7px 14px;font:700 32px/1 var(--mono);color:var(--tw);text-shadow:0 0 14px #3cff7a99;letter-spacing:.01em;z-index:4;pointer-events:none;
  animation:bob 1.4s ease-in-out infinite alternate}
.card .tag.typing::after{content:"▌";animation:car .8s steps(1) infinite;margin-left:3px}
.card.flip img{transform:scaleX(-1)}
.card.drag .tag{font-size:40px;top:-76px}

/* ── Šešėlio akys ── */
.bush{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3fae5a,#1d6b33 70%);box-shadow:inset -10px -14px 0 #175a2a}
.eyes{position:absolute;display:flex;gap:26px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s;z-index:5}
.eyes.on{opacity:1;transform:scale(1)}
.eyes i{width:62px;height:74px;border-radius:50%;background:#fff;position:relative;box-shadow:0 0 30px #ffffffaa;animation:blink 1s}
.eyes i::after{content:"";position:absolute;width:28px;height:32px;border-radius:50%;background:#1a1030;left:22px;top:24px}
.eyes i::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:38px;top:30px;z-index:2}
@keyframes blink{0%,35%,45%,75%,85%,100%{transform:scaleY(1)}40%,80%{transform:scaleY(.08)}}

/* ── kortelės (kaukės) ── */
.card{position:absolute;width:184px;height:184px;border-radius:30px;background:#1B1550dd;border:5px solid #ffffff40;
  touch-action:none;cursor:grab;transition:transform .45s cubic-bezier(.3,1.4,.5,1),box-shadow .2s,border-color .2s;z-index:10}
.card img{width:100%;height:100%;object-fit:contain;padding:8%}
.card.drag{cursor:grabbing;z-index:60;transition:none;border-color:#fff;box-shadow:0 30px 60px -10px #000c}
.card.pop{animation:pop .5s}
@keyframes pop{0%{scale:.6}70%{scale:1.18}100%{scale:1}}
.card.red{border-color:var(--red);background:#E8503F44}
@keyframes bob{from{margin-top:-8px}to{margin-top:8px}}

/* ── skeneris ── */
.scanner{position:absolute;border-radius:40px;border:8px dashed #ffffffcc;background:#ffffff10;z-index:5;box-shadow:0 0 0 4px #0006;overflow:hidden;transition:border-color .2s,box-shadow .2s,background .2s}
.scanner .beam{position:absolute;left:4%;right:4%;height:14px;border-radius:7px;background:linear-gradient(90deg,transparent,#24C9EC,transparent);
  box-shadow:0 0 30px #24C9EC;animation:scan 2.2s ease-in-out infinite alternate;opacity:.8}
@keyframes scan{from{top:6%}to{top:88%}}
.scanner .face{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:130px;opacity:.35;pointer-events:none}
.scanner.hot{border-style:solid;border-color:#fff;background:#ffffff22}
.scanner.ok{border-color:var(--green);border-style:solid;background:#1fb47a40;box-shadow:0 0 0 12px #1fb47a55,0 0 100px 10px var(--green)}
.scanner.no{border-color:var(--red);border-style:solid;background:#e8503f40;box-shadow:0 0 0 12px #e8503f55,0 0 100px 10px var(--red)}
.shelf{position:absolute;left:2%;right:2%;bottom:3%;height:96px;display:flex;gap:6px;justify-content:center;align-items:flex-end}
.shelf .card,.pile .card{position:relative;width:72px;height:72px;border-radius:16px;cursor:default;left:auto!important;top:auto!important;border-width:3px}
.pile .card{width:96px;height:96px;margin-top:30px}
.shelf .card .tag{display:none}
.pile .card .tag{font-size:17px;top:-30px;padding:3px 6px;border-width:2px;animation:none;text-decoration:line-through;text-decoration-color:var(--red)}
.pile{position:absolute;border-radius:36px;border:8px dashed #E8503Fcc;background:#2a0d1acc;display:flex;flex-wrap:wrap;
  align-content:flex-end;justify-content:center;gap:4px 70px;padding:20px 14px 18px;z-index:5;transition:box-shadow .2s,background .2s}
.pile .ph{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:84px;pointer-events:none}
.pile.hot{background:#e8503f30;border-style:solid}
.zh{position:absolute;left:0;right:0;text-align:center;font-size:110px;pointer-events:none;filter:drop-shadow(0 6px 10px #0008)}
.arrow{position:absolute;font-size:150px;display:none;filter:drop-shadow(0 8px 12px #000);animation:bob .5s ease-in-out infinite alternate;pointer-events:none;z-index:70}
.arrow.on{display:block}

/* ── ranka-užuomina ── */
.ghost{position:absolute;font-size:110px;pointer-events:none;z-index:80;filter:drop-shadow(0 8px 10px #000a);display:none}
.ghost.on{display:block}
.tap2{position:absolute;pointer-events:none;z-index:30;display:flex;align-items:center;justify-content:center}
.tap2 .hand{font-size:120px;animation:tapA 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px #000a)}
@keyframes tapA{0%,100%{transform:translateY(0)}10%{transform:translateY(16px)}20%{transform:translateY(0)}30%{transform:translateY(16px)}40%{transform:translateY(0)}}
.tap2 .ring{position:absolute;width:120px;height:120px;border:8px solid var(--gold);border-radius:50%;opacity:0;top:-20px;left:-24px;animation:ring 1.2s ease-out infinite}
.tap2 .ring.b{animation-delay:.24s}
@keyframes ring{0%{opacity:0;transform:scale(.4)}10%{opacity:1}60%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
.tap2 .x2{position:absolute;right:-90px;top:-10px;font:900 64px/1 var(--display);color:var(--gold);background:#0008;border:4px solid var(--gold);border-radius:20px;padding:6px 14px}

/* ── apdovanojimas ── */
.reward{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.3);font:900 120px/1 var(--display);color:var(--gold);
  text-shadow:0 8px 0 #7a4a00,0 0 40px #000;opacity:0;pointer-events:none;z-index:90;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:10px}
.reward .re{font-size:170px}
.reward.go{animation:rew 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rew{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1;transform:translate(-50%,-56%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-40px;width:22px;height:34px;border-radius:5px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(1200px) rotate(720deg)}}

/* ── 2 etapas ── */
.spot{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6e0 0%,#fff2d6 60%,#ffeac0 100%);overflow:hidden;box-shadow:0 0 120px 10px #ffd27a55}
.klaidas{position:absolute}
.klaidas img{width:100%;height:100%;object-fit:contain}
.klaidas.fallback img{mix-blend-mode:multiply}
.stool{position:absolute;background:#6a3f1f;border-radius:20px 20px 8px 8px;border:8px solid #4a2a12}
.m2{position:absolute;width:300px;height:300px;cursor:pointer;z-index:20;transition:transform .7s cubic-bezier(.5,-.3,.4,1.3),width .7s,height .7s,left .7s,top .7s}
.m2 img{width:100%;height:100%;object-fit:contain}
.m2.wig{animation:wig .5s}
@keyframes wig{0%,100%{rotate:0deg}20%{rotate:-12deg}40%{rotate:12deg}60%{rotate:-8deg}80%{rotate:8deg}}
.bubble{position:absolute;background:#fff;color:#1a1030;border-radius:40px;padding:18px 34px;font:900 70px/1 var(--display);display:flex;gap:16px;align-items:center;
  box-shadow:0 14px 30px #0009;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:60}
.bubble.on{opacity:1;transform:scale(1)}
.bubble .hh{font-size:84px;letter-spacing:-20px;margin-right:18px}

/* ── 3 etapas ── */
.chip{position:absolute;width:250px;height:160px;border-radius:30px;border:5px solid #ffffff55;touch-action:none;cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:10;
  box-shadow:0 10px 20px -8px #000a}
.chip .ci{font-size:80px;line-height:1}
.chip .cl{font:900 30px/1 var(--display);color:#fff;text-shadow:0 2px 4px #000a}
.chip.drag{cursor:grabbing;z-index:60;transition:none;border-color:#fff}
.chip.sel,.card.sel{border-color:var(--gold);box-shadow:0 0 0 6px var(--gold),0 0 40px var(--gold)}
.c3{width:200px;height:200px}
.blank{position:absolute;border-radius:50%;cursor:pointer;z-index:15}
.blank .bm{position:absolute;inset:0;border-radius:50%;border:10px dashed #ffffff66;background:#ffffff10;transition:border-color .2s,background .2s}
.blank.hot .bm{border-color:#fff;border-style:solid;background:#ffffff22}
.blank.has .bm{border-color:transparent;background:transparent}
.blank .holes{position:absolute;left:22%;right:22%;top:36%;display:flex;justify-content:space-between;pointer-events:none}
.blank .holes i{width:70px;height:50px;border-radius:50%;background:#ffffff33}
.blank.has .holes{display:none}
.blank .bimg{position:absolute;inset:0;display:none}
.blank.has .bimg{display:block}
.blank .bimg img{width:100%;height:100%;object-fit:contain;transition:filter .4s}
.blank .ticon{position:absolute;right:-20px;top:-20px;font-size:110px;display:none;filter:drop-shadow(0 6px 8px #000a);pointer-events:none}
.blank.trait .ticon{display:block;animation:pop .5s}
.blank.wig{animation:wig .5s}
.blank.fun .bimg{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{rotate:-5deg}50%{rotate:5deg}}
.blank.fast .bimg::after{content:"";position:absolute;left:-90px;top:30%;width:90px;height:40%;
  background:repeating-linear-gradient(180deg,#fff 0 8px,transparent 8px 26px);opacity:.7;border-radius:8px}
.blank.gold .bimg img{filter:drop-shadow(0 0 30px #FFC53D)}
.slot{position:absolute;width:110px;height:110px;border-radius:50%;border:6px dashed #ffffff55;display:flex;align-items:center;justify-content:center;font-size:60px}
.slot.ok{border-style:solid;border-color:var(--green);background:#1fb47a33}
.kid{position:absolute}
.kid .head{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:#3a2f6a;border:6px solid #5a4b9a}
.kid .body{position:absolute;left:0;right:0;bottom:0;border-radius:200px 200px 30px 30px;background:#3a2f6a;border:6px solid #5a4b9a}
.kid .onface{position:absolute;inset:-6%;display:none}
.kid .onface img{width:100%;height:100%;object-fit:contain}
.kid.masked .onface{display:block;animation:pop .5s}
.nick{position:absolute;left:0;right:0;text-align:center;pointer-events:none;z-index:30}
.nick span{display:inline-block;font:900 92px/1.1 var(--mono);color:var(--raso);background:#071d10;border:5px solid var(--raso);border-radius:22px;
  padding:14px 30px;box-shadow:0 0 40px #7ee78766;min-height:1.4em}
.nick span:empty{display:none}
.nick .car{display:inline-block;width:.55em;height:.9em;background:var(--raso);vertical-align:-0.1em;margin-left:4px;animation:car .8s steps(1) infinite}
@keyframes car{50%{opacity:0}}
.check{position:absolute;border-radius:40px;border:6px solid #ffffff66;background:#ffffff14;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:900 38px/1.1 var(--display);text-align:center;transition:background .2s}
.check .qi{font-size:120px;line-height:1}
.check.ready{animation:pulseN 1s ease-in-out infinite;border-color:var(--gold)}
.check.yes{background:var(--green);border-color:#fff;animation:none}
.bigok{position:absolute;font:900 300px/1 var(--display);color:var(--green);text-shadow:0 0 50px #1fb47a,0 10px 0 #0a5a3a;opacity:0;transform:scale(.3);
  transition:opacity .25s,transform .4s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:70}

  "miste-veidas":["#F3C7A6","MISTĖ","face"],"vaiko-veidas":["#F6D2B4","VAIKAS","face"]
};
function placeholder(id){
  var p=PH[id]||["#ccc",id.toUpperCase(),""], c=p[0], s="";
  if(p[2]==="ears") s+='<ellipse cx="34" cy="96" rx="30" ry="40" fill="'+c+'" stroke="#0005" stroke-width="4"/><ellipse cx="166" cy="96" rx="30" ry="40" fill="'+c+'" stroke="#0005" stroke-width="4"/>';
  if(p[2]==="ant") s+='<line x1="70" y1="40" x2="52" y2="8" stroke="#2a6b2a" stroke-width="6"/><circle cx="52" cy="8" r="8" fill="#2a6b2a"/><line x1="130" y1="40" x2="148" y2="8" stroke="#2a6b2a" stroke-width="6"/><circle cx="148" cy="8" r="8" fill="#2a6b2a"/>';

  var body;
  if(p[2]==="face"){
    body='<path d="M40 70 Q100 0 160 70 L160 50 Q100 -10 40 50Z" fill="'+(id==="miste-veidas"?"#5a3a8a":"#8a5a2a")+'"/>'+

      '<circle cx="64" cy="118" r="9" fill="#f59" opacity=".4"/><circle cx="136" cy="118" r="9" fill="#f59" opacity=".4"/>';
  } else {
    body='<path d="M30 70 Q30 26 100 26 Q170 26 170 70 Q174 140 100 168 Q26 140 30 70Z" fill="'+c+'" stroke="#0005" stroke-width="5"/>'+
      '<ellipse cx="72" cy="86" rx="22" ry="16" fill="#1a1030"/><ellipse cx="128" cy="86" rx="22" ry="16" fill="#1a1030"/>'+

function maskImg(id){

/* ══ garsas ══ */
var AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} return AC; }
function tone(seq,type,vol){
  var a=ac(); if(!a) return;
  try{ var t=a.currentTime;
    seq.forEach(function(p){ var o=a.createOscillator(), g=a.createGain(); o.type=type||"triangle";
      o.frequency.setValueAtTime(p[0],t+p[1]); if(p[3]) o.frequency.exponentialRampToValueAtTime(p[3],t+p[1]+(p[2]||.2));
      g.gain.setValueAtTime(.0001,t+p[1]); g.gain.exponentialRampToValueAtTime(vol||.25,t+p[1]+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t+p[1]+(p[2]||.2));
      o.connect(g); g.connect(a.destination); o.start(t+p[1]); o.stop(t+p[1]+(p[2]||.2)+.05); });
  }catch(e){}
}
var SFX={
  click:function(){ tone([[1800,0,.05],[1200,.05,.05]],"square",.12); },
  good:function(){ tone([[660,0,.15],[880,.1,.15],[1320,.2,.3]],"triangle",.28); },
  bad:function(){ tone([[220,0,.25],[160,.15,.35]],"square",.1); },
  boop:function(){ tone([[520,0,.12,300],[520,.45,.12,300]],"sine",.2); },
  pop:function(){ tone([[300,0,.12,1400]],"sine",.35); tone([[1500,.08,.15,2400]],"triangle",.15); },
  whoosh:function(){ tone([[200,0,.35,900]],"sawtooth",.05); },
  wig:function(){ tone([[440,0,.08],[520,.09,.08]],"sine",.15); },
  type:function(){ tone([[2400+Math.random()*600,0,.03]],"square",.06); },
  fan:function(){ tone([[523,0,.18],[659,.15,.18],[784,.3,.18],[1047,.45,.5]],"triangle",.3); },
  scan:function(){ tone([[900,0,.3,1700]],"sine",.08); }
};
var curAu=null;
var VOICE=false;
try{ VOICE = localStorage.getItem("kd_voice")==="1"; }catch(e){}
function paintSnd(){ var b=document.getElementById("snd"); if(!b) return; b.textContent=VOICE?"🔊":"🔇"; b.classList.toggle("off",!VOICE); b.setAttribute("aria-pressed",VOICE?"true":"false"); }
function toggleVoice(){
  VOICE=!VOICE; try{ localStorage.setItem("kd_voice",VOICE?"1":"0"); }catch(e){}
  if(!VOICE){ try{ if(curAu) curAu.pause(); if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
  paintSnd(); ac(); SFX.click();
}
function speakTTS(txt){
  if(!VOICE) return;
  try{ if(!window.speechSynthesis) return; var v=speechSynthesis.getVoices()||[];
    var lt=v.filter(function(x){ return (x.lang||"").toLowerCase().indexOf("lt")===0; })[0];
    speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(txt); u.lang="lt-LT"; if(lt) u.voice=lt; u.rate=.95; speechSynthesis.speak(u);
  }catch(e){}
}
function say(id,fallbackTxt){
  var txt=fallbackTxt||SAYTXT[id]||"";
  try{ if(curAu){ curAu.pause(); } if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(!VOICE) return;
  try{
    var a=new Audio(CFG.SFX+id+".mp3"); curAu=a; var done=false;
    a.onerror=function(){ if(!done){ done=true; speakTTS(txt); } };
    var p=a.play(); if(p&&p.catch) p.catch(function(err){ if(!done && err && err.name!=="NotAllowedError"){ done=true; speakTTS(txt); } });
  }catch(e){ speakTTS(txt); }
}
try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){}
/* verdiktas — po to, kai baigiasi vardo įrašas (ne ilgiau kaip 2,6 s laukimo) */
var afterT=null;
function sayAfter(id){
  clearTimeout(afterT); var a=curAu;
  if(a && !a.paused && !a.ended && a._name){ var fired=false; var go=function(){ if(fired) return; fired=true; clearTimeout(afterT); if(curAu===a) say(id); };
    a.addEventListener("ended",go); afterT=setTimeout(go,2600); }
  else say(id);
}

var cheerI=0;
function reward(sayIt){
  var c=CHEERS[cheerI++%CHEERS.length], r=$("reward");

  r.classList.remove("go"); void r.offsetWidth; r.classList.add("go");
  if(sayIt && c[2]) say(c[2]);
}

    box.appendChild(e); }
  setTimeout(function(){ box.innerHTML=""; },3400);
}
function flash(el,cls,ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); clearTimeout(el["_t"+cls]); el["_t"+cls]=setTimeout(function(){ el.classList.remove(cls); },ms||600); }
function showArrow(id){ var a=$(id); a.classList.add("on"); clearTimeout(a._t); a._t=setTimeout(function(){ a.classList.remove("on"); },2000); }
function hit(el,x,y){ var r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }

/* ══ tempimas (perimta iš P5 VILKIMO: pointer capture, transform, grįžta su spyruokle) ══ */
var dragging=null;
function draggable(el,opt){
  var sx,sy,pid=null,moved=false;
  el.addEventListener("pointerdown",function(e){
    if(el.dataset.lock==="1" || e.button>0) return;
    e.preventDefault(); ac(); hideGhost();
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false; dragging=el; if(opt.down) opt.down(el);
    el.classList.add("drag"); try{ el.setPointerCapture(pid); }catch(err){}
  });
  el.addEventListener("pointermove",function(e){
    if(dragging!==el || e.pointerId!==pid) return;
    var dx=(e.clientX-sx)/SC, dy=(e.clientY-sy)/SC;
    if(Math.abs(dx)+Math.abs(dy)>CFG.TAP_PX) moved=true;
    el.style.transform="translate("+dx+"px,"+dy+"px) scale(1.08)";
    if(opt.over) opt.over(e.clientX,e.clientY);
  });
  function end(e){
    if(dragging!==el || e.pointerId!==pid) return;
    dragging=null; try{ el.releasePointerCapture(pid); }catch(err){}
    el.classList.remove("drag"); if(opt.over) opt.over(-1,-1);
    if(!moved || e.type==="pointercancel"){ el.style.transform=""; if(!moved && opt.tap) opt.tap(el); return; }
    var r=opt.drop(el,e.clientX,e.clientY);
    if(!r) el.style.transform="";        /* paleido niekur — grįžta */
  }
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
  el.addEventListener("dragstart",function(e){ e.preventDefault(); });
}
/* FLIP: perkelia elementą į naują tėvą su sklandžiu nuslydimu nuo dabartinės vietos */
function moveTo(el,parent){
  var a=el.getBoundingClientRect(); parent.appendChild(el);
  el.style.transition="none"; el.style.transform="";
  var b=el.getBoundingClientRect();
  el.style.transform="translate("+((a.left+a.width/2-b.left-b.width/2)/SC)+"px,"+((a.top+a.height/2-b.top-b.height/2)/SC)+"px)";
  void el.offsetWidth; el.style.transition="transform .65s cubic-bezier(.3,1.2,.5,1)"; el.style.transform="";
  setTimeout(function(){ el.style.transition=""; },700);
}

/* ══ ranka-šešėlis: rodo KAIP tempti ══ */
var ghostT=null;
function ghostLoop(fromEl,toEl){
  hideGhost(); var g=$("ghost");
  function run(){
    if(!fromEl.isConnected) return;
    var f=fromEl.getBoundingClientRect(), t=toEl.getBoundingClientRect(), s=stage.getBoundingClientRect();
    var fx=(f.left+f.width/2-s.left)/SC, fy=(f.top+f.height/2-s.top)/SC, tx=(t.left+t.width/2-s.left)/SC, ty=(t.top+t.height/2-s.top)/SC;
    g.classList.add("on"); g.style.transition="none"; g.style.left=(fx-30)+"px"; g.style.top=(fy-20)+"px"; g.style.opacity=1;
    void g.offsetWidth; g.style.transition="left 1.4s ease-in-out .4s,top 1.4s ease-in-out .4s,opacity .3s 2.1s";
    g.style.left=(tx-30)+"px"; g.style.top=(ty-20)+"px"; g.style.opacity=0;
  }
  run(); ghostT=setInterval(run,CFG.GHOST_MS);
}
function hideGhost(){ clearInterval(ghostT); ghostT=null; $("ghost").classList.remove("on"); }

/* ═════════ 1 · KAUKĖ AR VEIDAS? ═════════ */
var S1={good:0,placed:0};
function build1(){
  S1={good:0,placed:0};
  $("tray1").innerHTML=""; $("shelf").innerHTML=""; [].slice.call($("pile").querySelectorAll(".card")).forEach(function(c){c.remove();});
  [].slice.call($("lock1").children).forEach(function(i){ i.classList.remove("f"); });
  $("d1mask").textContent="❔"; $("door1").classList.remove("win");
  MASKS1.forEach(function(m,i){
    var c=document.createElement("div"); c.className="card"+(m.flip?" flip":""); c.dataset.id=m.id; c.dataset.ok=m.ok?"1":"0"; c.dataset.i=i;
    var col=i%5, row=Math.floor(i/5);
    c.style.left=(100+col*384)+"px"; c.style.top=(row?868:610)+"px";
    var im=maskImg(m.id); if(m.flt) im.style.filter=m.flt; c.appendChild(im);
    var t=document.createElement("div"); t.className="tag"; c.appendChild(t);
    $("tray1").appendChild(c);
    typeTag(t,m.tag,300+i*120);
    draggable(c,{over:over1,drop:drop1,down:down1});
  });
}
function typeTag(t,txt,delay){ /* rašomosios mašinėlės efektas, kaip vartų Sargybinio žyma */
  clearTimeout(t._t); t.textContent=""; t.classList.add("typing");
  if(delay){ t._t=setTimeout(function(){ typeTag(t,txt,0); },delay); return; }
  var i=0;
  (function step(){ if(i<txt.length){ t.textContent=txt.slice(0,++i); t._t=setTimeout(step,45); } else t._t=setTimeout(function(){ t.classList.remove("typing"); },700); })();
}
function down1(c){ /* paėmus kortelę — slapyvardis perskaitomas ir perrašomas */
  var m=MASKS1[+c.dataset.i]; say(m.snd, SAYTXT[m.snd]); if(curAu) curAu._name=true;
  var t=c.querySelector(".tag"); if(t && !t.classList.contains("typing")){ typeTag(t,m.tag,0); }
}
function over1(x,y){ $("scanner").classList.toggle("hot",hit($("scanner"),x,y)); $("pile").classList.toggle("hot",hit($("pile"),x,y)); }
function drop1(c,x,y){
  var ok=c.dataset.ok==="1";
  if(hit($("scanner"),x,y)){
    c.dataset.lock="1";
    if(ok){
      SFX.click(); setTimeout(SFX.good,90); flash($("scanner"),"ok",1100);
      moveTo(c,$("shelf")); c.classList.add("pop");
      $("lock1").children[S1.good].classList.add("f"); S1.good++;
      sayAfter("gera"); reward(false); done1(c);
    } else {
      SFX.bad(); flash($("scanner"),"no",1100); flash($("door1"),"bad",900); c.classList.add("red");
      setTimeout(function(){ $("eyes").classList.add("on"); SFX.boop(); },250);
      setTimeout(function(){ $("eyes").classList.remove("on"); },1250);
      sayAfter(MASKS1[+c.dataset.i].why||"isduoda");
      setTimeout(function(){ moveTo(c,$("pile")); showArrow("arPile"); done1(c); },1100);
    }
    return true;
  }
  if(hit($("pile"),x,y)){
    if(!ok){ c.dataset.lock="1"; c.classList.add("red"); moveTo(c,$("pile")); SFX.good(); sayAfter(MASKS1[+c.dataset.i].why||"isduoda"); reward(false); done1(c); return true; }
    /* gera kaukė į 🙅 krūvą — sudreba, grįžta, rodyklė į skenerį */
    c.style.transform=""; flash(c,"shake",600); SFX.bad(); showArrow("arScan"); flash($("scanner"),"ok",900);
    return true;
  }
  return false;
}
function done1(c){
  S1.placed++;
  setTimeout(function(){ c.classList.remove("pop"); },600);
  if(S1.placed>=MASKS1.length){
    setTimeout(function(){ $("door1").classList.add("win"); $("d1mask").textContent="✅"; SFX.fan(); confetti(); setTimeout(function(){ say("pasaka"); },3800); $("next").classList.add("pulse"); },900);
  }
}

/* ═════════ 2 · UŽSIDĖK KAUKĘ ═════════ */
var S2={done:false,last:0,t:null,kSrc:0};
function build2(){
  S2.done=false; S2.last=0; clearTimeout(S2.t);
  var m=$("m2"); m.innerHTML=""; m.appendChild(maskImg("dramblys"));
  m.style.cssText="left:1060px;top:470px"; m.className="m2";
  $("tap2").style.display="flex"; $("d2mask").textContent="❔"; $("d2key").textContent="❔"; $("door2").classList.remove("win");
}
function loadKlaidas(){
  var im=$("klaidasImg"); S2.kSrc=0;
  im.onerror=function(){ if(S2.kSrc===0){ S2.kSrc=1; $("klaidas").classList.add("fallback"); im.src=CFG.KLAIDAS[1]; } };
  im.src=CFG.KLAIDAS[0];
}
function faceRect(){ /* stage px */
  var k=$("klaidas"), f=CFG.FACE[S2.kSrc], im=$("klaidasImg");
  var W=k.offsetWidth, H=k.offsetHeight, nw=im.naturalWidth||1024, nh=im.naturalHeight||1024;
  var sc=Math.min(W/nw,H/nh), dw=nw*sc, dh=nh*sc, ox=(W-dw)/2, oy=(H-dh)/2;
  var w=f.w*dw*1.15;
  return {x:k.offsetLeft+ox+f.x*dw-w/2, y:k.offsetTop+oy+f.y*dh-w/2, w:w};
}
function wear2(){
  if(S2.done) return; S2.done=true; clearTimeout(S2.t);
  $("tap2").style.display="none"; $("bub2").classList.remove("on");
  var m=$("m2"), r=faceRect(); SFX.whoosh();
  m.style.left=r.x+"px"; m.style.top=r.y+"px"; m.style.width=r.w+"px"; m.style.height=r.w+"px"; m.style.transform="rotate(360deg)";
  setTimeout(function(){ SFX.pop(); flash(m,"wig",500); say("uzdeta"); reward(false); $("d2mask").textContent="✅"; flash($("door2"),"win",1600); },750);
  setTimeout(function(){ say("slaptazodis"); flash($("d2key").parentNode,"shake",600); $("next").classList.add("pulse"); },2300);
}
$("m2").addEventListener("pointerdown",function(e){
  e.preventDefault(); ac(); if(S2.done) return;
  var now=performance.now();
  if(now-S2.last<CFG.DBL_MS){ S2.last=0; wear2(); return; }
  S2.last=now; SFX.click();
  clearTimeout(S2.t);
  S2.t=setTimeout(function(){ /* vienas spustelėjimas — sukrusteli + „du kartus!“ */
    if(S2.done) return; flash($("m2"),"wig",500); SFX.wig(); var b=$("bub2"); b.classList.add("on"); say("du-kartus");
    clearTimeout(b._t); b._t=setTimeout(function(){ b.classList.remove("on"); },1800);
  },CFG.DBL_MS);
});

/* ═════════ 3 · KLASĖS KAUKĖ ═════════ */
var S3={c:null,t:null,worn:false,checked:false,last:0};
var CHECK_HTML=null;
function resetCheck(){ var ch=$("check"); if(CHECK_HTML===null) CHECK_HTML=ch.innerHTML; ch.innerHTML=CHECK_HTML; ch.className="check"; }
function build3(){
  S3={c:null,t:null,worn:false,checked:false,last:0};
  $("row3c").innerHTML=""; $("row3t").innerHTML="";
  CREAT.forEach(function(cr,i){
    var c=document.createElement("div"); c.className="card c3"; c.dataset.id=cr.id;
    c.style.left=(150+i*280)+"px"; c.style.top="125px"; c.appendChild(maskImg(cr.id));
    $("row3c").appendChild(c);
    draggable(c,{over:over3,drop:drop3c,tap:function(){ say("c-"+cr.id,cr.n); }});
  });
  TRAITS.forEach(function(tr,i){
    var c=document.createElement("div"); c.className="chip"; c.dataset.id=tr.id; c.style.background=tr.bg;
    c.style.left=(110+i*290)+"px"; c.style.top="895px";
    c.innerHTML='<div class="ci">'+tr.icon+'</div><div class="cl">'+tr.m+'</div>';
    $("row3t").appendChild(c);
    draggable(c,{over:over3,drop:drop3t,tap:function(){ say("t-"+tr.id,tr.m); }});
  });
  var b=$("blank"); b.className="blank"; $("bimg").innerHTML=""; $("ticon").textContent="";
  $("slotC").className="slot"; $("slotT").className="slot"; $("slotC").textContent="🐾"; $("slotT").textContent="🎨";
  $("kid").classList.remove("masked"); $("onface").innerHTML=""; $("nickT").innerHTML=""; $("tap3").style.display="none";
  resetCheck(); $("bigok").classList.remove("on");
}
function over3(x,y){ $("blank").classList.toggle("hot",hit($("blank"),x,y)); }
function getC(){ return CREAT.filter(function(x){return x.id===S3.c;})[0]; }
function getT(){ return TRAITS.filter(function(x){return x.id===S3.t;})[0]; }
function paint3(){
  var b=$("blank"), im=$("bimg").querySelector("img"), t=getT();
  b.classList.remove("fast","fun","gold","trait");
  if(im) im.style.filter=t?t.flt:"";
  if(t){ $("ticon").textContent=t.icon; b.classList.add("trait"); if(t.cls) b.classList.add(t.cls); }
  [].slice.call(document.querySelectorAll("#row3c .card")).forEach(function(c){ c.classList.toggle("sel",c.dataset.id===S3.c); });
  [].slice.call(document.querySelectorAll("#row3t .chip")).forEach(function(c){ c.classList.toggle("sel",c.dataset.id===S3.t); });
  $("tap3").style.display=(S3.c&&S3.t&&!S3.worn)?"flex":"none";
}
function unwear3(){ /* pakeitus būtybę/savybę po uždėjimo — kaukė nuimama, vardas ištrinamas */
  if(!S3.worn) return; S3.worn=false; S3.checked=false;
  $("kid").classList.remove("masked"); $("nickT").innerHTML=""; resetCheck(); $("bigok").classList.remove("on");
}
function drop3c(el,x,y){
  if(!hit($("blank"),x,y)){
    if(hit($("row3t"),x,y)) return false;
    return false;
  }
  el.style.transform=""; unwear3();
  S3.c=el.dataset.id; $("bimg").innerHTML=""; $("bimg").appendChild(maskImg(S3.c)); $("blank").classList.add("has");
  $("slotC").className="slot ok"; $("slotC").textContent="✓";
  SFX.pop(); flash($("blank"),"wig",500); paint3(); say("c-"+S3.c,getC().n); reward(false);
  if(!S3.t) setTimeout(function(){ if(!S3.t) ghostLoop(document.querySelector('#row3t .chip'),$("blank")); },1600);
  return true;
}
function drop3t(el,x,y){
  if(!hit($("blank"),x,y)) return false;
  el.style.transform="";
  if(!S3.c){ /* pirma būtybė — sudreba, rodyklė į būtybes */
    flash($("blank"),"shake",600); SFX.bad(); showArrow("arC"); return true;
  }
  unwear3(); S3.t=el.dataset.id; $("slotT").className="slot ok"; $("slotT").textContent="✓";
  SFX.good(); paint3(); say("t-"+S3.t,getT().m); reward(false);
  return true;
}
function nickParts(){ var c=getC(), t=getT(); return {lbl:(c.f?t.f:t.m)+c.n, clip:"n-"+t.id+"-"+c.id, txt:(c.f?t.f:t.m)+" "+c.n+"!"}; }
function wear3(){
  if(S3.worn) return;
  if(!S3.c || !S3.t){ flash($("blank"),"shake",600); SFX.bad(); showArrow(S3.c?"arT":"arC"); return; }
  S3.worn=true; hideGhost(); $("tap3").style.display="none";
  /* skrydis: klonas nuo kaukės iki vaiko galvos */
  var src=$("blank"), head=document.querySelector("#kid .head"), s=stage.getBoundingClientRect();
  var a=src.getBoundingClientRect(), h=head.getBoundingClientRect();
  var fly=src.cloneNode(true); fly.removeAttribute("id"); fly.classList.remove("hot");
  fly.style.cssText="left:"+((a.left-s.left)/SC)+"px;top:"+((a.top-s.top)/SC)+"px;width:"+(a.width/SC)+"px;height:"+(a.height/SC)+"px;transition:all .7s cubic-bezier(.5,-.3,.4,1.3);z-index:70;pointer-events:none";
  stage.appendChild(fly); SFX.whoosh(); void fly.offsetWidth;
  var w=h.width/SC*1.12;
  fly.style.left=((h.left-s.left)/SC+(h.width/SC-w)/2)+"px"; fly.style.top=((h.top-s.top)/SC+(h.height/SC-w)/2)+"px";
  fly.style.width=w+"px"; fly.style.height=w+"px"; fly.style.transform="rotate(360deg)";
  setTimeout(function(){
    fly.remove(); var of=$("onface"); of.innerHTML="";
    var im=$("bimg").querySelector("img").cloneNode(true); of.appendChild(im);
    var ti=document.createElement("div"); ti.textContent=getT().icon; ti.style.cssText="position:absolute;right:-30px;top:-30px;font-size:80px"; of.appendChild(ti);
    $("kid").classList.add("masked"); SFX.pop(); reward(false);
    typeNick();
  },750);
}
function typeNick(){
  var p=nickParts(), el=$("nickT"), i=0; el.innerHTML='<b></b><i class="car"></i>'; var b=el.querySelector("b"); b.style.fontWeight="900";
  (function step(){
    if(!S3.worn) return;
    if(i<p.lbl.length){ b.textContent=p.lbl.slice(0,++i); SFX.type(); setTimeout(step,90); }
    else { say(p.clip,p.txt); setTimeout(function(){ if(S3.worn) $("check").classList.add("ready"); },900); }
  })();
}
$("blank").addEventListener("pointerdown",function(e){
  if(dragging) return; e.preventDefault(); ac();
  var now=performance.now();
  if(now-S3.last<CFG.DBL_MS){ S3.last=0; clearTimeout(S3.tt); wear3(); return; }
  S3.last=now; clearTimeout(S3.tt);
  S3.tt=setTimeout(function(){ if(S3.worn) return; flash($("blank"),"wig",500); SFX.wig();
    if(S3.c&&S3.t) say("du-kartus"); else { showArrow(S3.c?"arT":"arC"); } },CFG.DBL_MS);
});
$("check").addEventListener("click",function(){
  ac();
  if(!S3.worn){ flash($("check"),"shake",600); SFX.bad(); flash($("blank"),"wig",500); showArrow(S3.c?(S3.t?"arT":"arT"):"arC"); return; }
  if(S3.checked) return; S3.checked=true; SFX.scan(); say("patikra");
  setTimeout(function(){ var ch=$("check"); ch.className="check yes"; ch.innerHTML='<div class="qi" style="font-size:230px">✓</div>'; SFX.fan(); confetti(); },2300);
});

/* ═════════ etapai ═════════ */
var cur=1;
function go(n){
  hideGhost(); if(curAu) try{ curAu.pause(); }catch(e){}
  cur=Math.max(1,Math.min(3,n));
  ["s1","s2","s3"].forEach(function(s,i){ $(s).classList.toggle("on",i+1===cur); });
  [].slice.call(document.querySelectorAll(".dots i")).forEach(function(d,i){ d.className=i+1===cur?"on":(i+1<cur?"done":""); });
  $("next").classList.remove("pulse"); $("next").style.visibility=cur===3?"hidden":"visible"; $("prev").style.visibility=cur===1?"hidden":"visible";
  if(cur===1){ build1(); setTimeout(function(){ if(cur===1&&S1.placed===0) ghostLoop(document.querySelector("#tray1 .card"),$("scanner")); },500); }
  if(cur===2){ build2(); }
  if(cur===3){ build3(); setTimeout(function(){ if(cur===3&&!S3.c) ghostLoop(document.querySelector("#row3c .card"),$("blank")); },500); }
}
$("next").addEventListener("click",function(){ ac(); SFX.click(); go(cur+1); });
$("prev").addEventListener("click",function(){ go(cur-1); });
$("reset").addEventListener("click",function(){ go(cur); });

/* ═════════ paslėptas „test“ sąrašas (klavišai perimami PIRMIAU už viską) ═════════ */
var kbuf="";
document.addEventListener("keydown",function(e){
  if((e.key==="m"||e.key==="M")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ toggleVoice(); }
  if(e.key==="Escape"){ $("testMenu").classList.remove("on"); return; }
  if(e.key&&e.key.length===1){ kbuf=(kbuf+e.key.toLowerCase()).slice(-4); if(kbuf==="test"){ $("testMenu").classList.add("on"); kbuf=""; return; } }
  if(e.key==="ArrowRight"||e.key==="PageDown"){ if(cur<3) go(cur+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ if(cur>1) go(cur-1); }
},true);
$("testMenu").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b){ $("testMenu").classList.remove("on"); return; }
  $("testMenu").classList.remove("on"); var j=b.dataset.j;
  go(+j[0]); hideGhost();
  if(j==="1done"){ [].slice.call(document.querySelectorAll("#tray1 .card")).forEach(function(c){
      c.dataset.lock="1"; if(c.dataset.ok==="1"){ $("shelf").appendChild(c); $("lock1").children[S1.good++].classList.add("f"); } else { c.classList.add("red"); $("pile").appendChild(c); } S1.placed++; });
    $("door1").classList.add("win"); $("d1mask").textContent="✅"; $("next").classList.add("pulse"); }
  if(j==="2done"){ wear2(); }
  if(j==="3ready"||j==="3done"){
    S3.c="drakonas"; $("bimg").appendChild(maskImg("drakonas")); $("blank").classList.add("has"); $("slotC").className="slot ok"; $("slotC").textContent="✓";
    S3.t="kosminis"; $("slotT").className="slot ok"; $("slotT").textContent="✓"; paint3();
    if(j==="3done") setTimeout(wear3,100);
  }
});

document.getElementById("snd").addEventListener("click",toggleVoice);
paintSnd();
loadKlaidas();
go(1);
</script>
