<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Koks tu Gynėjas? — GAME (Informacijos Gynėjai)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --void:#140F33; --void2:#241A5C; --panel:#1E1747; --panel2:#2A2060;
    --edge:#4A3A9E; --glow:#9B7BFF; --gold:#FFC53D; --ink:#F3F0FF; --dim:#B9B0E8;
    --tc:#9B7BFF; --tc2:#6E4BE8;
    --disp:'SF Pro Rounded',ui-rounded,'Nunito','Baloo 2','Segoe UI',system-ui,sans-serif;
    --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--void);color:var(--ink);font-family:var(--disp);
    display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bg{z-index:0}#fx{z-index:5;pointer-events:none}
  .stage{position:relative;z-index:10;width:100%;max-width:600px}
  button{font-family:var(--disp);font-weight:800;cursor:pointer;border:none}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .hidden{display:none!important}

  /* mute */
  #mute{position:fixed;top:14px;right:14px;z-index:20;width:44px;height:44px;border-radius:50%;
    background:rgba(30,23,71,.7);border:2px solid var(--edge);color:var(--ink);font-size:1.2rem;backdrop-filter:blur(6px)}

  /* glass panel */
  .panel{background:linear-gradient(160deg,rgba(42,32,96,.82),rgba(20,15,51,.9));
    border:1.5px solid var(--edge);border-radius:28px;padding:26px 22px 24px;text-align:center;
    box-shadow:0 0 0 1px rgba(155,123,255,.15),0 30px 70px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(10px)}

  h1{font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.05;letter-spacing:-.02em;
    text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 26px rgba(155,123,255,.5)}
  h1 .g{color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 26px rgba(255,197,61,.6)}
  .sub{color:var(--dim);font-family:var(--sys);font-size:1.02rem;margin-top:12px;line-height:1.45}

  /* neuron orb */
  .orb{width:96px;height:96px;margin:0 auto 4px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 38% 34%,#fff,var(--glow) 42%,var(--tc2) 100%);
    box-shadow:0 0 40px 6px rgba(155,123,255,.6),inset 0 -8px 18px rgba(0,0,0,.35);
    display:grid;place-items:center;font-size:2.6rem;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  .cta{margin-top:22px;position:relative;font-size:1.4rem;color:#3A2600;padding:16px 44px;border-radius:99px;
    background:linear-gradient(180deg,#FFE08A,var(--gold));box-shadow:0 6px 0 #C88F00,0 12px 30px -6px rgba(255,197,61,.6);
    transition:transform .09s,box-shadow .09s}
  .cta:active{transform:translateY(5px);box-shadow:0 1px 0 #C88F00}
  .cta .shine{position:absolute;inset:0;border-radius:99px;overflow:hidden}
  .cta .shine::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep 2.6s ease-in-out infinite}
  @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}

  /* HUD top */
  .hud{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .track{flex:1;height:16px;border-radius:99px;background:rgba(0,0,0,.35);border:1.5px solid var(--edge);overflow:hidden;position:relative}
  .barfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--glow),var(--gold));transition:width .4s cubic-bezier(.3,1,.4,1);box-shadow:0 0 12px var(--glow)}
  .cnt{font-family:var(--sys);font-weight:800;font-size:.82rem;color:var(--dim);min-width:40px}
  .streak{font-family:var(--sys);font-weight:800;font-size:.86rem;color:var(--gold);min-width:44px;opacity:0;transition:opacity .3s,transform .3s}
  .streak.on{opacity:1}

  .tag{font-family:var(--sys);font-weight:800;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--glow)}
  .qt{font-size:clamp(1.2rem,4.4vw,1.7rem);margin:6px 0 2px;min-height:2.3em;display:flex;align-items:center;justify-content:center;line-height:1.15}
  .opts{display:grid;gap:11px;margin-top:12px}
  .opt{display:flex;align-items:center;gap:14px;text-align:left;font-family:var(--disp);font-weight:800;font-size:1.1rem;color:var(--ink);
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--edge);border-radius:18px;padding:13px 16px;
    box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
    transform:translateY(16px);opacity:0;transition:background .15s,border-color .15s}
  .opt .em{font-size:1.9rem;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .opt.in{animation:optin .4s cubic-bezier(.2,1,.4,1) forwards}
  @keyframes optin{to{transform:translateY(0);opacity:1}}
  .opt:active{transform:translateY(4px) scale(.99)}
  .opt.sel{border-color:var(--gold);background:linear-gradient(180deg,#3a2f78,#241a5c);box-shadow:0 0 0 2px rgba(255,197,61,.5),0 2px 0 rgba(0,0,0,.35)}
  .opt.good{border-color:#35D48A;background:linear-gradient(180deg,#1c5340,#123a2c)}
  .opt.bad{border-color:#FF6B5E;background:linear-gradient(180deg,#5a2620,#3a1a17);opacity:.75}
  .fb{font-family:var(--sys);font-weight:800;font-size:1rem;min-height:26px;margin-top:12px}
  .fb.ok{color:#57e0a6}.fb.no{color:#ff9d93}
  .next{margin-top:10px;font-size:1.05rem;color:#3A2600;padding:11px 30px;border-radius:99px;background:linear-gradient(180deg,#FFE08A,var(--gold));box-shadow:0 5px 0 #C88F00}
  .next:active{transform:translateY(3px);box-shadow:0 1px 0 #C88F00}

  /* REVEAL */
  #s-reveal{text-align:center}
  .charge{width:130px;height:130px;margin:6px auto;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff,var(--tc) 45%,var(--tc2) 100%);
    box-shadow:0 0 60px 14px var(--tc);animation:charge 1.1s ease-in forwards}
  @keyframes charge{0%{transform:scale(.2) rotate(0);opacity:.4}80%{transform:scale(1.15) rotate(320deg);opacity:1}100%{transform:scale(.9) rotate(360deg)}}
  .emblem{font-size:clamp(5.5rem,24vw,8.5rem);line-height:1;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55));
    animation:burst .7s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes burst{0%{transform:scale(0) rotateY(-180deg)}70%{transform:scale(1.25) rotateY(20deg)}100%{transform:scale(1) rotateY(0)}}
  .tname{font-size:clamp(2.2rem,10vw,3.4rem);letter-spacing:-.02em;line-height:1;color:var(--tc);
    -webkit-text-stroke:2px rgba(0,0,0,.35);text-shadow:0 0 30px var(--tc);margin-top:2px;
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .tpow{font-family:var(--sys);font-weight:800;margin-top:8px;font-size:1.05rem}
  .tdesc{font-family:var(--sys);font-size:1rem;color:var(--dim);margin-top:8px;max-width:38ch;margin-inline:auto;line-height:1.45}
  .rpanel{background:rgba(0,0,0,.3);border:1.5px solid var(--edge);border-radius:20px;padding:16px;margin-top:16px}
  .lev{font-family:var(--sys);font-weight:800}
  .stars{font-size:1.6rem;letter-spacing:3px;min-height:1.6rem}
  .star{opacity:0;display:inline-block}.star.on{opacity:1;animation:spop .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes spop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
  .ladder{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .rung{width:26px;height:26px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;
    font-family:var(--sys);font-weight:800;font-size:.72rem;color:var(--dim);background:rgba(0,0,0,.25);transition:.3s}
  .rung.first{background:var(--gold);color:#3a2600;border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
  .quest{margin-top:14px;background:rgba(155,123,255,.12);border:2px dashed var(--glow);border-radius:16px;padding:12px 14px;font-family:var(--sys);font-size:.98rem}
  .quest b{color:var(--gold)}
  .teacher{margin-top:12px;font-family:var(--sys);font-size:.82rem;color:var(--dim);background:rgba(0,0,0,.25);border:1.5px solid var(--edge);border-radius:14px;padding:10px 14px}
  .share{margin-top:12px;font-family:var(--sys);font-weight:800;color:var(--gold);font-size:1rem}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .again{background:rgba(0,0,0,.3);color:var(--ink);border:1.5px solid var(--edge);font-size:1rem;padding:11px 22px;border-radius:99px}
  .refade{opacity:0;animation:rf .5s ease forwards}
  @keyframes rf{to{opacity:1}}
  .readbtn{margin-top:8px;font-family:var(--sys);font-weight:800;font-size:.92rem;color:var(--ink);background:rgba(0,0,0,.28);border:1.5px solid var(--edge);border-radius:99px;padding:7px 18px}
  .readbtn:active{transform:translateY(2px)}
  .rung.on{background:var(--glow);color:#1a1340;border-color:var(--glow)}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}.cta .shine::before{display:none}}

  #envbg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:.14;filter:saturate(1.1);pointer-events:none;
    -webkit-mask-image:radial-gradient(120% 90% at 50% 40%,#000 55%,transparent 100%);mask-image:radial-gradient(120% 90% at 50% 40%,#000 55%,transparent 100%)}
  .orb.host{background:none;box-shadow:none;width:132px;height:132px;overflow:visible}
  .orb.host img{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(155,123,255,.6))}
  .hostrow{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-bottom:2px}
  .hostrow .buddy{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:bob 3s ease-in-out infinite;animation-delay:.4s}
</style>

function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=bg.width=fx.width=innerWidth*DPR; H=bg.height=fx.height=innerHeight*DPR;
  bg.style.width=fx.style.width=innerWidth+"px"; bg.style.height=fx.style.height=innerHeight+"px"; }
function makeOrbs(){ orbs=[]; var n=reduce?6:14; for(var i=0;i<n;i++)orbs.push({x:Math.random()*W,y:Math.random()*H,r:(40+Math.random()*120)*DPR,dx:(Math.random()-.5)*.15*DPR,dy:(Math.random()-.5)*.15*DPR,h:Math.random(),d:.3+Math.random()*.5}); }
var COL=["#6E4BE8","#9B7BFF","#2FD3E8","#FF6FB5","#35D48A","#FFC53D"];
function drawBG(){
  bx.clearRect(0,0,W,H);
  var grad=bx.createLinearGradient(0,0,0,H); grad.addColorStop(0,"#1B1442"); grad.addColorStop(1,"#0E0A28");
  bx.fillStyle=grad; bx.fillRect(0,0,W,H);
  for(var i=0;i<orbs.length;i++){ var o=orbs[i];
    if(!reduce){o.x+=o.dx;o.y+=o.dy; if(o.x<-o.r)o.x=W+o.r; if(o.x>W+o.r)o.x=-o.r; if(o.y<-o.r)o.y=H+o.r; if(o.y>H+o.r)o.y=-o.r;}
    var ox=o.x+px*o.d*40*DPR, oy=o.y+py*o.d*40*DPR;
    var g=bx.createRadialGradient(ox,oy,0,ox,oy,o.r);
    var c=COL[i%COL.length]; g.addColorStop(0,c+"55"); g.addColorStop(1,c+"00");
    bx.fillStyle=g; bx.beginPath(); bx.arc(ox,oy,o.r,0,7); bx.fill();
  }
  requestAnimationFrame(drawBG);
}
addEventListener("pointermove",function(e){ px=(e.clientX/innerWidth-.5)*2; py=(e.clientY/innerHeight-.5)*2; });

/* ---------- FX (confetti burst) ---------- */
var fx=document.getElementById("fx"), fc=fx.getContext("2d"), parts=[];
function burst(color){
  if(reduce)return; var cx=W/2, cy=H*.4, n=130;
  for(var i=0;i<n;i++){ var a=Math.random()*7, sp=(2+Math.random()*7)*DPR;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*DPR,life:1,size:(4+Math.random()*6)*DPR,col:Math.random()<.5?color:COL[(Math.random()*COL.length)|0],rot:Math.random()*7,vr:(Math.random()-.5)*.4}); }
}
function drawFX(){
  fc.clearRect(0,0,W,H);
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=.12*DPR; p.x+=p.vx; p.y+=p.vy; p.life-=.012; p.rot+=p.vr;
    if(p.life<=0){parts.splice(i,1);continue;}
    fc.globalAlpha=Math.max(0,p.life); fc.fillStyle=p.col; fc.save(); fc.translate(p.x,p.y); fc.rotate(p.rot);
    fc.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6); fc.restore();
  }
  fc.globalAlpha=1; requestAnimationFrame(drawFX);
}

/* ---------- QUIZ ---------- */
var TYPES={
  serg:{e:"🐢",n:"SERGĖTOJAS",c:"#9B7BFF",p:"Tavo galia: saugoti PASLAPTIS 🔒",d:"Tu saugai svarbius dalykus kaip tikras seifas. Niekas neišvilios tavo slaptų dalykų!"},
  det:{e:"🦊",n:"DETEKTYVAS",c:"#FF6B5E",p:"Tavo galia: matyti APGAULES 🔍",d:"Tave sunku apgauti. Tu visada klausi: ar tai tiesa? kas pasakė?"},
  bic:{e:"🐶",n:"BIČIULIS",c:"#FF6FB5",p:"Tavo galia: būti geru DRAUGU 💛",d:"Tu malonus ir padedi kitiems. Internete ir gyvai tu skleidi gerumą!"},
  ism:{e:"🦉",n:"IŠMINTINGASIS",c:"#2FD3E8",p:"Tavo galia: BALANSAS ⚖️",d:"Tu moki pailsėti nuo ekrano ir žinai, kada sustoti. Ramus ir apgalvotas!"},
  kur:{e:"🦫",n:"KŪRĖJAS",c:"#35D48A",p:"Tavo galia: KURTI, ne tik žiūrėti 🎨",d:"Tu ne tik žiūri — tu kuri! Piešini, statai, sugalvoji. Tikras meistras!"},
  dra:{e:"🦁",n:"DRĄSUOLIS",c:"#FFC53D",p:"Tavo galia: DRĄSA klausti 🦁",d:"Kai kažkas negerai, tu drąsiai pasakai suaugusiam. Tikras herojus!"}
};
var ORD=["serg","det","bic","ism","kur","dra"];
var QT=[
 {q:"Kubijoje randi blizgantį lobį! Ką darai?",o:[{e:"🔒",t:"Pasislepiu saugiai",ty:"serg"},{e:"🔍",t:"Patikrinu, ar tikras",ty:"det"},{e:"🎁",t:"Pasidalinu su draugu",ty:"bic"},{e:"🏰",t:"Pastatau pilį",ty:"kur"}]},
 {q:"Kas tau linksmiausia?",o:[{e:"🎨",t:"Kurti ir piešti",ty:"kur"},{e:"🧩",t:"Spręsti mįsles",ty:"det"},{e:"🤗",t:"Padėti draugams",ty:"bic"},{e:"🌙",t:"Ramiai pasvajoti",ty:"ism"}]},
 {q:"Draugas nusiminęs. Ką darai?",o:[{e:"💛",t:"Paguodžiu jį",ty:"bic"},{e:"🦁",t:"Kviečiu suaugusį",ty:"dra"},{e:"🔍",t:"Sužinau, kas atsitiko",ty:"det"},{e:"🎨",t:"Nupiešiu dovaną",ty:"kur"}]},
 {q:"Kaip mėgsti žaisti?",o:[{e:"🦁",t:"Drąsiai, pirmas",ty:"dra"},{e:"🦉",t:"Ramiai, apgalvotai",ty:"ism"},{e:"🔒",t:"Saugau savo daiktus",ty:"serg"},{e:"🤗",t:"Su draugais",ty:"bic"}]},
 {q:"Randi mįslingas duris. Ką darai?",o:[{e:"🦉",t:"Pagalvoju pirma",ty:"ism"},{e:"🔍",t:"Ieškau užuominų",ty:"det"},{e:"🔒",t:"Saugiai apeinu",ty:"serg"},{e:"🦁",t:"Drąsiai atidarau",ty:"dra"}]},
 {q:"Kas tave geriausiai apibūdina?",o:[{e:"🛡️",t:"Patikimas",ty:"serg"},{e:"🦉",t:"Protingas",ty:"ism"},{e:"🦫",t:"Kūrybingas",ty:"kur"},{e:"😄",t:"Draugiškas",ty:"bic"}]}
];
var QL=[
 {q:"Žaidimo draugas prašo tavo namų adreso!",gap:"serg",why:"Adresas — SLAPTA: padeda nepažįstamam tave surasti.",o:[{e:"🙅",t:"Nesakau, pasakau suaugusiam",ok:true},{e:"🏠",t:"Pasakau adresą",ok:false}]},
 {q:"Ekrane: „TU LAIMĖJAI 1000€! SPAUSK!“",gap:"det",why:"„Laimėjai!“ dažniausiai — TRIUKAS. Pirma sustok ir paklausk.",o:[{e:"✋",t:"Sustoju, klausiu suaugusio",ok:true},{e:"👆",t:"Greitai spaudžiu!",ok:false}]},
 {q:"Kažkas sako: „tik nesakyk tėvams…“",gap:"dra",why:"Paslaptis nuo tėvų — raudona vėliava. Visada pasakyk patikimam suaugusiam.",o:[{e:"🗣️",t:"Pasakau patikimam suaugusiam",ok:true},{e:"🤐",t:"Slepiu paslaptį",ok:false}]}
];
var idx=0,phase="type",tally={},correct=0,streak=0,gaps=[],locked=false,TOTAL=QT.length+QL.length;
ORD.forEach(function(k){tally[k]=0});
var $=function(id){return document.getElementById(id)};
var RANKS=["Naujokas","Stebėtojas","Klausėjas","Detektyvas","Saugotojas","Bičiulis","Kūrėjas","Tyrėjas","Gynėjas"];
var VOICE=null, curRead="";
function pickVoice(){ try{ var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(/lt/i.test(vs[i].lang)){VOICE=vs[i];break;} } }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function speak(t){ if(muted||!t)return; try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang="lt-LT"; if(VOICE)u.voice=VOICE; u.rate=.95; u.pitch=1.05; speechSynthesis.speak(u); }catch(e){} }
function readAloud(){ initAudio(); var m=muted; muted=false; speak(curRead); muted=m; }

function begin(){ initAudio(); S.whoosh(); $("s-start").classList.add("hidden"); $("s-quiz").classList.remove("hidden"); render(); }
function render(){
  locked=false;
  $("bar").style.width=(idx/TOTAL*100)+"%"; $("cnt").textContent=(idx+1)+"/"+TOTAL;
  $("fb").textContent=""; $("fb").className="fb"; $("next").classList.add("hidden");
  var st=$("streak"); if(phase==="level"&&streak>=2){st.textContent="🔥×"+streak;st.classList.add("on");}else st.classList.remove("on");
  var opts=$("opts"); opts.innerHTML=""; opts.className="opts"; var q;
  if(phase==="type"){ $("tag").textContent="TAVO GALIA · "+(idx+1); q=QT[idx];
    q.o.forEach(function(o,k){ var b=document.createElement("button"); b.className="opt"; b.style.animationDelay=(k*.06)+"s";
      b.innerHTML='<span class="em">'+o.e+'</span><span>'+o.t+'</span>'; b.onclick=function(){pickType(o.ty,b);}; opts.appendChild(b);
      requestAnimationFrame(function(){b.classList.add("in");}); });
  } else { var li=idx-QT.length; $("tag").textContent="AR JAU MOKI SAUGOTI? · "+(li+1)+"/"+QL.length; q=QL[li]; opts.className="opts smart";
    q.o.forEach(function(o,k){ var b=document.createElement("button"); b.className="opt"; b.style.animationDelay=(k*.06)+"s";
      b.innerHTML='<span class="em">'+o.e+'</span><span>'+o.t+'</span>'; b.onclick=function(){pickSmart(o,b,q.gap,q.why);}; opts.appendChild(b);
      requestAnimationFrame(function(){b.classList.add("in");}); });
  }
  $("qt").textContent=q.q;
  curRead=q.q+". "+q.o.map(function(o){return o.t;}).join(". ");
  speak(q.q);
}
function pickType(ty,btn){ if(locked)return; locked=true; tally[ty]++; btn.classList.add("sel"); S.pop(); setTimeout(step,240); }
function pickSmart(o,btn,gap,why){ if(locked)return; locked=true;
  document.querySelectorAll("#opts .opt").forEach(function(b){b.style.pointerEvents="none";});
  if(o.ok){ correct++; streak++; btn.classList.add("good"); S.correct(); $("fb").className="fb ok"; $("fb").innerHTML=(streak>=2?"🔥 "+streak+" iš eilės! ":"✅ Teisingai! ")+why; }
  else{ streak=0; gaps.push(gap); btn.classList.add("bad"); S.wrong(); $("fb").className="fb no"; $("fb").innerHTML="🤔 Beveik. "+why; }
  speak(why);
  $("next").textContent=(idx===TOTAL-1)?"Pamatyti savo tipą! 🎉":"Toliau →"; $("next").classList.remove("hidden");
}
function step(){ idx++; if(idx===QT.length)phase="level"; if(idx<TOTAL)render(); else reveal(); }
function advance(){ S.pop(); idx++; if(idx<TOTAL)render(); else reveal(); }

function reveal(){
  $("bar").style.width="100%"; $("s-quiz").classList.add("hidden"); $("s-reveal").classList.remove("hidden");
  var best=ORD[0],bv=-1; ORD.forEach(function(k){if(tally[k]>bv){bv=tally[k];best=k;}});
  var T=TYPES[best]; tint=T.c;
  document.documentElement.style.setProperty("--tc",T.c);
  var gapType=gaps.length?gaps[0]:ORD[(ORD.indexOf(best)+1)%ORD.length]; var G=TYPES[gapType];
  var cap=function(s){return s.charAt(0)+s.slice(1).toLowerCase();};
  // Stage 1: charging orb + sound
  var R=$("revStage");
  R.innerHTML='<div style="font-family:var(--sys);font-weight:800;color:var(--dim);font-size:1.05rem">Tavo tipas yra…</div><div class="charge"></div>';
  S.charge();
  setTimeout(function(){
    burst(T.c); S.fanfare();
    var levelMap=[1,2,3,5]; var lvl=levelMap[Math.min(3,correct)];
    R.innerHTML=
      '<div class="emblem">'+T.e+'</div>'+
      '<div class="tname">'+T.n+'</div>'+
      '<div class="refade" style="animation-delay:.12s;font-family:var(--sys);font-weight:800;color:var(--gold);margin-top:4px">🎉 Prisijungei prie „'+cap(T.n)+'“ komandos!</div>'+
      '<div class="tpow refade" style="animation-delay:.2s">'+T.p+'</div>'+
      '<div class="tdesc refade" style="animation-delay:.35s">'+T.d+'</div>'+
      '<div class="tdesc refade" style="animation-delay:.42s;color:var(--gold)">🌱 Tai tavo stipriausia galia <b>ŠIANDIEN</b> — tikras Gynėjas augina visas 6 galias, ir tu jau pradėjai kelionę!</div>'+
      '<div class="rpanel refade" style="animation-delay:.5s">'+
        '<div class="lev">Lygis '+lvl+' · '+RANKS[lvl-1].toUpperCase()+' &nbsp;<span class="stars" id="stars"></span></div>'+
        '<div class="ladder" id="ladder"></div>'+
        '<div style="font-family:var(--sys);font-size:.8rem;color:var(--dim);margin-top:8px">🏁 9 lygiai iki tikro GYNĖJO!</div>'+
      '</div>'+
      '<div class="quest refade" style="animation-delay:.65s">🏹 <b>Augimo užduotis:</b> treniruok galią <b>'+G.e+' '+cap(G.n)+'</b> — kitose pamokose ją sustiprinsi!</div>'+
      '<button class="readbtn refade" style="animation-delay:.8s" onclick="document.getElementById(\'tnote\').classList.toggle(\'hidden\')">👩‍🏫 Mokytojui</button>'+
      '<div class="teacher hidden" id="tnote">Tipas <b>'+cap(T.n)+'</b> · Lygis '+lvl+' ('+RANKS[lvl-1]+') · '+correct+'/3 saugumo pasirinkimų teisingi · augimo sritis: <b>'+cap(G.n)+'</b>.</div>'+
      '<div class="share refade" style="animation-delay:.95s">🤔 Paklausk draugo — koks Gynėjas JIS?</div>'+
      '<div class="row refade" style="animation-delay:1.05s"><button class="again" onclick="restart()">↺ Iš naujo</button><button class="cta" style="margin-top:0;font-size:1.05rem;padding:11px 24px" onclick="restart()"><span class="shine"></span>Kitas ▶</button></div>';
    // stars
    var stars=$("stars"); var got=Math.max(1,correct);
    for(var i=0;i<3;i++){ var sp=document.createElement("span"); sp.className="star"; sp.textContent=i<got?"⭐":"☆";
      (function(sp,i){ setTimeout(function(){ sp.classList.add("on"); if(i<got)S.star(i); },400+i*260); })(sp,i); stars.appendChild(sp); }
    // ladder sweep
    var lad=$("ladder"); for(var j=1;j<=9;j++){ var d=document.createElement("div"); d.className="rung"+(j<lvl?" on":j===lvl?" first":""); d.textContent=j; lad.appendChild(d); }
  }, reduce?100:1150);
}
function restart(){ S.whoosh(); idx=0;phase="type";correct=0;streak=0;gaps=[];ORD.forEach(function(k){tally[k]=0});
  $("s-reveal").classList.add("hidden"); $("s-start").classList.remove("hidden"); document.documentElement.style.setProperty("--tc","#9B7BFF"); }

/* ---------- boot ---------- */
resize(); makeOrbs(); drawBG(); drawFX(); addEventListener("resize",function(){resize();makeOrbs();});
</script>
