<style>/* P9 v5.4: the lesson clock's 60 s circle is not drawn (every computer plays the ending then, Kris 11-17); Klaidas's bubble in dark ink (the obis fix) */
#pbLaikrodis{display:none!important}#pbGalas{--ink:#151a35}</style>

<body>
<style>
/* v5: sizes come from uiScale() in 50-ui.js: --t text (40 px at 1366x768, never under 30), --tgt smallest target (80, never under 64),
   --cell one map piece (168, never under 120), --bw the map board, --qw the question column, --zr where the left zone ends. */
:root{--bg:#0d1a12;--fg:#f2f7f3;--amber:#ffd27a;--panel:rgba(6,22,26,.86);--line:rgba(255,255,255,.55);--t:40px;--s:1;--tgt:80px;--cell:168px;--bw:524px;--qw:248px;--zr:818px;--btop:102px;
  --red:#ff5a4a;--green:#3ddc7a;--blue:#37b6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0d1a12;color:var(--fg);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.low{image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ui button{pointer-events:auto;font-family:inherit;cursor:pointer;color:#fff}
[hidden]{display:none!important}
#fade{position:absolute;inset:0;background:#040c0e;opacity:0;transition:opacity .35s;pointer-events:none;z-index:20}
#fade.on{opacity:1}
/* system buttons: pause, fullscreen, sound. Top right, on every screen. */
#sys{position:absolute;right:12px;top:10px;display:flex;gap:12px;z-index:26}
#sys button{width:var(--tgt);height:var(--tgt);border-radius:18px;background:var(--panel);border:3px solid var(--line);padding:0;display:grid;place-items:center}
#sys svg{width:56%;height:56%}
/* the map board: right side. Pieces are drawn into it. */
#board{position:absolute;right:12px;top:var(--btop);width:var(--bw);height:var(--bw);z-index:2;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-origin:100% 0;touch-action:none}
#board.in{animation:bin_ .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes bin_{from{transform:scale(.3);opacity:0}}
/* v5.2 „Tu čia": outside the map (under it, or left of the big map), a short arrow points into the ⭐ cell (Kris 11-12) */
#you{position:absolute;font-size:var(--t);font-weight:900;line-height:1;padding:4px 10px;border-radius:12px;background:rgba(255,248,220,.95);color:#3a2a10;border:3px solid #6b4a22;z-index:3;white-space:nowrap}
#youA{position:absolute;left:0;top:0;z-index:3;pointer-events:none;line-height:0;filter:drop-shadow(0 2px 0 #0007)}
#youA svg{display:block;animation:nud 1.1s ease-in-out infinite}
/* v5.2 round 3: the four danger signs stay as a small strip under the map (right of „Tu čia"); ✋ on a danger figure pulses its sign 1.5 s */
#sgn{position:absolute;right:12px;display:flex;gap:8px;z-index:3;pointer-events:none}
#sgn .sg{width:var(--sgw,52px);height:var(--sgw,52px);display:grid;place-items:center;font-size:calc(var(--sgw,52px)*.6);line-height:1;border-radius:12px;background:var(--panel);border:3px solid #ff9c4a}
#sgn .sg.hit{animation:sgp .5s ease-in-out 3;border-color:var(--amber);box-shadow:0 0 0 5px #ffd27a,0 0 28px #ffd27a}
@keyframes sgp{50%{transform:scale(1.28)}}
@keyframes nud{50%{transform:translateX(5px)}}
#stars{position:absolute;display:flex;justify-content:center;gap:8px;z-index:2}   /* v5.2: left and width come from uiScale(): the stars start right of the „Tu čia" arrow, which goes straight up into the ⭐ tree */
.st{font-size:var(--t);line-height:1;flex:none;width:var(--stw,calc(var(--t)*1.6));height:var(--stw,calc(var(--t)*1.6));display:grid;place-items:center;border-radius:50%;background:var(--panel);border:3px solid #ffffff40}
.st{filter:grayscale(1);opacity:.4}
.st.on{filter:none;opacity:1;border-color:var(--amber);animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.st.lost{filter:none;opacity:1;border-color:#ffffff40}   /* v5.2: a lost star is an empty outline, as big as a star */
.st .so{width:1.05em;height:1.05em;display:block}
.ts .so{width:1em;height:1em;display:inline-block;vertical-align:-.12em;margin:0 2px}
.st.cur{opacity:.75;border-color:#fff}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}}
/* the answer bubble (figure or Klaidas): top of the left zone. A badge shows who talks, never a name. */
#bubble{position:absolute;left:12px;width:calc(var(--zr) - 12px);top:10px;display:flex;justify-content:center;pointer-events:none;z-index:4}
#bin{display:flex;align-items:center;gap:12px;max-width:100%;padding:8px 8px 8px 8px;background:var(--panel);border:4px solid var(--line);border-radius:20px;font-size:var(--t);font-weight:800;line-height:1.14;text-wrap:balance}
#bin.pop{animation:bp .24s cubic-bezier(.3,1.7,.5,1)}
#bin.glow,#ctx.glow{box-shadow:0 0 0 6px #ffd27a,0 0 40px #ffd27a;border-color:#ffd27a}
@keyframes bp{from{transform:scale(.7);opacity:0}}
#bin.k{border-color:#ff9c4a}#bin.f{border-color:#9fd8e4}
#badge{flex:none;width:calc(var(--tgt)*.85);height:calc(var(--tgt)*.85);border-radius:50%;background:#0b2427;border:2px solid #fff6;overflow:hidden;display:grid;place-items:center}
#badge canvas{width:100%;height:100%;display:block}
#btx{min-width:0;white-space:pre-line}
#ctt{min-width:0;white-space:pre-line;text-wrap:balance}
.snd{flex:none;width:var(--tgt);height:var(--tgt);border-radius:16px;background:rgba(255,255,255,.12);border:3px solid var(--line);display:grid;place-items:center;padding:0;pointer-events:auto}
.snd svg{width:58%;height:58%}
.snd:hover{background:rgba(255,255,255,.28)}
#ui .snd.on{background:#ffd27a55;border-color:var(--amber);animation:apl .8s ease-in-out infinite}   /* this line is playing */
/* narrator caption: bottom of the left zone, right of the question column */
#cap{position:absolute;left:12px;width:calc(var(--zr) - 12px);bottom:6px;display:flex;justify-content:center;pointer-events:none;z-index:4}
#ui.wideL #cap{left:12px;width:calc(var(--zr) - 12px)}
#ui.wide #cap{left:12px;width:calc(100% - 24px);z-index:6}
#ctx{display:flex;align-items:center;gap:12px;max-width:100%;padding:5px 8px 5px 20px;background:var(--panel);border:4px solid var(--amber);border-radius:18px;font-size:var(--t);font-weight:800;line-height:1.14;text-align:center;text-wrap:balance}
#ctx.pop{animation:bp .24s cubic-bezier(.3,1.7,.5,1)}
/* v5.1 the dialog card, as in P7 „Klaido bėgimas" (Kris's reference picture, docs/design/ref-p7-dialog-card-kris-2026-11-11.png):
   a dark card with a wavy gold outline that jiggles all the time · round avatar + a gold line ending „rašo:" · a round ✕ top right ·
   the message in big white bold text with 🔊 right after it · answer rows: dark boxes with a rough light outline that jiggles too,
   white bold text left-aligned, a square 🔊 to the right of every row. Sizes follow --t / --tgt (40 px text, 80 px targets at 1366). */
@keyframes jit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(.6px,-.4px) rotate(.4deg)}50%{transform:translate(-.5px,.3px) rotate(-.3deg)}75%{transform:translate(.3px,.5px) rotate(-.4deg)}}
@keyframes jit2{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(.9px,-.6px) rotate(.6deg)}50%{transform:translate(-.8px,.5px) rotate(-.5deg)}75%{transform:translate(.5px,.7px) rotate(-.6deg)}}
@keyframes wob{0%,100%{transform:rotate(-1.2deg) scale(1)}50%{transform:rotate(1.2deg) scale(1.02)}}
#card{position:absolute;left:12px;top:10px;width:var(--cw);z-index:5;transform-origin:0 0;transition:transform .25s}
#card.min{transform:scale(.6)}
#card .kc{position:relative;padding:calc(var(--t)*.27) calc(var(--t)*.45);color:#fff;transform-origin:50% 50%;animation:wob 1.8s ease-in-out .6s infinite}
#card .kc::before{content:"";position:absolute;inset:0;background:rgba(24,14,4,.95);border:3px solid var(--amber);border-radius:22px;filter:url(#boil)}
#card.danger .kc::before{filter:url(#boil2)}
#card.danger .kc{animation:wob 1.3s ease-in-out .6s infinite}
#card .kc>*{position:relative}
#card .jt{display:inline-block;animation:jit .42s steps(1) infinite}
#card.danger .jt{animation:jit2 .34s steps(1) infinite}
#card .who{display:flex;gap:12px;align-items:center;font-size:var(--t);font-weight:800;line-height:1.05;color:var(--amber);margin-bottom:calc(var(--t)*.12);padding-right:calc(var(--tgt) + 8px);min-height:var(--tgt)}
#card .av{flex:none;width:var(--tgt);height:var(--tgt);border-radius:50%;overflow:hidden;background:#3a2a5a;display:grid;place-items:center}
#card .av canvas{width:100%;height:100%;display:block}
#cX{position:absolute!important;top:0;right:0;width:var(--tgt);height:var(--tgt);border-radius:50%;border:3px solid #ffffff88;background:#ffffff1a;font-size:var(--t);font-weight:900;padding:0;line-height:1}
/* v5.2: at least 10 px under the message. With Q_LOOK voiced (re-record 11-12) the card's 🔊 and the first row's 🔊 both show, one above
   the other; at .2 t they were 6 px apart at 1024x600 (v5-play: "gap < 8 px cSnd snd:Q_LOOK"), too close for a child's finger. */
#card .msg{display:flex;gap:12px;align-items:center;font-size:var(--t);font-weight:800;line-height:1.1;margin-bottom:max(10px,calc(var(--t)*.2));border-radius:14px}
#card .msg.glow{box-shadow:0 0 0 6px #ffd27a,0 0 40px #ffd27a}
#cMsgT{min-width:0;flex:0 1 auto}
#card .opts{display:grid;gap:10px}
/* v5.2 (bug): at 1024x600 the 4-row card of round 3 reached down into the narrator caption („Čia nėra pavojaus ženklo. Paklausk." was half covered).
   The card now packs tighter at every size (padding .42→.27 t, header gap .3→.12 t, message gap .35→.2 t and line height 1.15→1.1, row gap 18→10 px,
   row padding 6→4 px) and the caption sits 4 px lower with 3 px less padding; text and targets keep their sizes. qa-tools/v52-cap.mjs checks it. */
#card .opt{display:flex;gap:10px;align-items:stretch}
#ui button.ans{flex:1;display:flex;align-items:center;gap:12px;font-size:var(--t);font-weight:800;line-height:1.05;min-height:var(--tgt);padding:4px 16px;border:0;background:none;color:#fff;text-align:left;position:relative;isolation:isolate}
#ui button.ans::before{content:"";position:absolute;inset:0;z-index:-1;border:3px solid #ffffffaa;background:#ffffff16;border-radius:14px;filter:url(#boil)}
#card.danger button.ans::before{filter:url(#boil2)}
#ui button.ans:hover:not([disabled])::before{background:#ffffff33}
#ui button.ans .ic{font-size:calc(var(--t)*1.05);line-height:1;flex:none}
#ui button.ans.adult::before{border-color:#8fd8ff;background:#0b355066}
#ui button.ans.used::before{background:#ffd27a33;border-color:var(--amber)}
#ui button.ans.pulse{animation:none}#ui button.ans.pulse::before{box-shadow:0 0 0 6px #ffd27acc}
/* Šalin: the bin, under the card on the left. Icon first, word second. */
#ui button.ab{display:flex;align-items:center;gap:10px;min-height:var(--tgt);padding:6px 18px;border-radius:18px;background:rgba(6,22,26,.92);font-weight:900;line-height:1.05;box-shadow:0 5px 0 #0009;text-align:left;font-size:var(--t)}
#ui button.ab .ic{font-size:calc(var(--t)*1.15);line-height:1;flex:none}
#salin{position:absolute;left:12px;top:0;z-index:4;border:5px dashed #ff9c8a}
#salin.hot{background:#5a1a12;transform:scale(1.06)}
#mute.off{border-color:#ff8a8a}
@media (prefers-reduced-motion: reduce){#card .jt,#card .kc{animation:none}}
#ui button:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 #0009}
#ui button[disabled]{opacity:.38;cursor:default;box-shadow:none;filter:grayscale(.6)}
#ui .busy button{opacity:.55}
#ui button.pulse,#ui .pulse{animation:apl .8s ease-in-out infinite}
@keyframes apl{50%{box-shadow:0 0 0 6px #ffd27acc}}   /* a glow only: a pulsing target never grows into its neighbour */
#ui button.shake,.shake{animation:shk .45s ease-in-out}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
/* the offered piece. Tap it: it goes to the map. Drag it: anywhere on the map, or onto Šalin. */
#piece,#ghost{position:absolute;left:0;top:0;z-index:7;will-change:transform;touch-action:none;filter:drop-shadow(0 8px 0 #0007)}
#piece{pointer-events:auto;cursor:grab}
#piece.drag{cursor:grabbing;filter:drop-shadow(0 16px 6px #000a)}
#piece.pulse{animation:none;filter:drop-shadow(0 0 10px #ffd27a) drop-shadow(0 0 22px #ffd27a)}
#piece.dim{filter:brightness(.35) drop-shadow(0 8px 0 #0007)}
#piece.bad{filter:drop-shadow(0 0 10px #ff3b2f) drop-shadow(0 0 22px #ff3b2f)}
/* v5.2 tap path: a tapped piece is picked up (it glows), the map takes the next tap; tapped again it wiggles. rotate: never fights the position transform */
#piece.armed{filter:drop-shadow(0 0 8px #fff8dc) drop-shadow(0 0 20px #ffd27a)}
#piece.wig{animation:wig .4s ease-in-out}
@keyframes wig{25%{rotate:-9deg}75%{rotate:9deg}}
#board.armed{pointer-events:auto;cursor:pointer}
#ghost{opacity:.55;pointer-events:none;z-index:8}
/* tear ring over a bot's mask */
#tear{position:absolute;left:0;top:0;width:var(--tr,110px);height:var(--tr,110px);margin:calc(var(--tr,110px)/-2) 0 0 calc(var(--tr,110px)/-2);border-radius:50%;border:6px dashed #ffd27a;background:rgba(255,210,122,.12);z-index:6;pointer-events:auto;cursor:pointer;animation:rp .9s ease-in-out infinite;padding:0}
#tear span{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);font-size:var(--t);font-weight:900;color:#fff;background:var(--panel);border:3px solid #ffd27a;border-radius:14px;padding:2px 14px;white-space:nowrap}
@keyframes rp{50%{box-shadow:0 0 0 10px #ffd27a55}}
/* ghost hand */
#hand{position:absolute;left:0;top:0;width:92px;height:112px;margin-left:-40px;margin-top:-4px;filter:drop-shadow(0 4px 0 #0008);z-index:9;will-change:transform;pointer-events:none}
#hand svg{width:100%;height:100%;display:block}
#hand.tap svg{animation:htap .85s ease-in-out infinite}
@keyframes htap{0%,100%{transform:translateY(14px)}45%{transform:translateY(0) scale(.9)}}
/* v5.2.1 on the „Plėšk!" ring: the hand points down from above (pd), or lies on its side at the ring's edge (pl: from the right, pointing
   left · pr: from the left, pointing right); the svg turns about its middle, the margins put the fingertip back on the point.
   The word under the ring stays clear. */
#hand.pd{margin-left:-47px;margin-top:-109px}#hand.pd svg{rotate:180deg}
#hand.pl{margin-left:7px;margin-top:-57px}#hand.pl svg{rotate:-90deg}
#hand.pr{margin-left:-99px;margin-top:-55px}#hand.pr svg{rotate:90deg}
/* a tap kept while the piece still bounces: the ring presses in at once */
#tear.q{animation:tq .35s ease-out}@keyframes tq{40%{transform:scale(.86)}}
#tapr{position:absolute;left:0;top:0;width:90px;height:90px;margin:-45px 0 0 -45px;border:6px solid #fff;border-radius:50%;animation:tr .85s ease-out infinite;z-index:8;pointer-events:none}
@keyframes tr{0%,40%{opacity:0;transform:scale(.3)}50%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
#key{position:absolute;left:50%;bottom:calc(var(--tgt) * 1.9);transform:translateX(-50%);font-size:var(--t);font-weight:900;padding:4px 40px 10px;border-radius:12px;background:#e9eef0;color:#203034;border:3px solid #fff;box-shadow:0 6px 0 #6a7a80;z-index:5}
/* cards */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;pointer-events:none}
.screen.dim{background:rgba(3,14,16,.62)}
.screen h1{margin:0;font-size:clamp(64px,8.2vw,108px);font-weight:900;line-height:1.02;color:#fff;text-shadow:0 5px 0 #06161a,0 0 34px #0008}
#title{z-index:5}
#title .ic{font-size:clamp(90px,12vw,150px);line-height:1}
#title b{font-size:clamp(90px,12vw,150px);line-height:1;color:var(--amber);text-shadow:0 5px 0 #06161a}
.btn{font-size:clamp(44px,4.6vw,62px);font-weight:900;padding:12px 52px;min-height:var(--tgt);background:#d6452e;color:#fff;border:0;border-radius:18px;box-shadow:0 7px 0 #7a1f12;pointer-events:auto}
.btn:hover{background:#ec5a3f}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #7a1f12}
.btn.alt{font-size:var(--t);background:var(--panel);border:3px solid var(--line);box-shadow:none;padding:6px 30px;font-weight:800}
/* v5.2 the Baitas thought bubble in the run before round 3 (top-left; the system buttons are top-right). Nothing in it takes a press. */
#think{position:absolute;left:12px;top:10px;z-index:4;pointer-events:none;transform-origin:0 0}
#think.pop{animation:tpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes tpop{from{transform:scale(.15);opacity:0}}
/* v5.3 (Kris 11-12: „use an irregular shape for the clasic speech bubble and no text box within text boxes"): a thought cloud. Its outline is
   one SVG path drawn in code (thinkLayout: uneven bumps on an oval), light fill, dark line; inside only the 3D Baitas and one plain sentence.
   Three small puffs trail toward Klaidas. Nothing in it has its own box, border or background. */
#thinkSvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 0 rgba(0,0,0,.28))}
#thinkPath{fill:#fffdf6;stroke:#1d2a33;stroke-width:4.5;stroke-linejoin:round}
#think .tb{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center}
#think .tdog{position:relative;flex:none;width:var(--bz,150px);align-self:stretch;min-height:calc(var(--bz,150px)*1.05)}
#thinkCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#thinkL{width:var(--tlw,260px);font-size:max(30px,var(--t));font-weight:800;line-height:1.12;color:#16222b;text-wrap:balance}
#think .td{position:absolute;display:block;border-radius:50%;background:#fffdf6;border:3.5px solid #1d2a33;transform:translate(-50%,-50%);box-shadow:0 3px 0 rgba(0,0,0,.25)}
#think .td:nth-of-type(1){width:36px;height:28px}#think .td:nth-of-type(2){width:24px;height:19px}#think .td:nth-of-type(3){width:15px;height:12px}
/* v5.4 the review card („Pataisom klaidas"): the P7 card, a little wider when the review rows need it (--rw from uiScale), the progress dots
   in the header, the question the figure was asked above its reply, one step line (the narrator's words, with its 🔊), the choice rows.
   Evidence: .e words glow (repeated words · place words · sign words); an off-topic reply glows together with its question (.glow). */
#card.rev{width:var(--rw,var(--cw))}
#card .rdots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#card .rdots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--amber);display:block;flex:none}
#card .rdots i.did{background:#3ddc7a;border-color:#3ddc7a}
#card .rdots i.now{background:var(--amber);box-shadow:0 0 0 4px #ffd27a55}
#rStar{flex:none;width:calc(var(--tgt)*.9);height:calc(var(--tgt)*.9);display:grid;place-items:center;margin-left:auto}
#rStar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px #3ddc7a)}
#rStar.pop{animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
#card .rq{color:#cfe9ff;padding:0 6px}
#card .rq .ic{font-size:calc(var(--t)*1.05);line-height:1;flex:none}
#card .msg.ev .e{background:#ffd27a;color:#2a1a00;border-radius:8px;box-shadow:0 0 0 2px #ffd27a,0 0 12px #ffd27a;animation:evp .9s ease-in-out infinite}
@keyframes evp{50%{box-shadow:0 0 0 3px #ffd27a,0 0 18px #ffd27a}}
#card .rstep{display:flex;gap:12px;align-items:center;font-size:var(--t);font-weight:800;line-height:1.1;color:var(--amber);margin-bottom:max(12px,calc(var(--t)*.2))}
#rStepT{min-width:0;text-wrap:balance}
#ui button.ans.rv.yes::before{background:#3ddc7a55;border-color:#3ddc7a}
#ui button.ans.rv.no{opacity:.45}
#ui button.ans.rv.rglow::before{border-color:#3ddc7a;box-shadow:0 0 0 6px #3ddc7acc,0 0 26px #3ddc7a;animation:apl .8s ease-in-out infinite}
.st .sf,.st .sd{width:1.05em;height:1.05em;display:block}
.ts .sf,.ts .sd{width:1em;height:1em;display:inline-block;vertical-align:-.12em;margin:0 2px}

function skeleton(name) {

/* ===== v5.2 round logic: the map jigsaw. Pure: no THREE, no DOM, seeded. The game and tests/policy.mjs run this same file
   (build.mjs strips the word "export"). Figures and their lines follow lines.json (Gabrielius, v5.1).
   Kinds: H real child (a true piece of the map) · R repeating bot (v5.2, Kris 11-12: a near-copy of a map piece that is wrong:
          v:'hue' a slightly different colour, or v:'tab' one tab turned the wrong way, so it fits no cell. Never an exact copy.)
          O off-topic bot (a beach piece from another map) · D danger sign (gift / praise / asks about you / invites; „Pasakysiu suaugusiam ✋" is right)
   Rule: before a figure has answered, nothing the renderer gets says what it is. The piece only exists after the first answer.
   Round 3 figures say their first line when the card opens (README "Dialog card" step 1); that line is the cue there.
   v5.2 (Kris 11-12): a true piece goes in only on its own cell. On another cell it comes back to the hand: no star lost, no error. ===== */
const SLOTS=['00','10','20','01','11','21','02','12','22'];   // 'cr': column 0-2 left to right, row 0-2 top to bottom
const CELL=n=>''+(n%3)+Math.floor(n/3);                      // README cells are row-major 0-8
const START=CELL(6);                                          // ⭐ Klaidas's tree, bottom left, on the map from the start
/* README table. id = the line id stem in lines.json. cell = the true piece a real child gives.
   v = how a repeater's piece is wrong (v5.2, Kris 11-12, over the README's "duplicate"): hue = slightly different colours, tab = a void where a nub should be (or a nub where a void should be).
   The renderer picks which free cell the near-copy imitates when the piece appears (the free cell with most placed neighbours). */
const ROUND_FIGS=[
  [{id:'R1A',k:'H',cell:7},{id:'R1B',k:'H',cell:3},{id:'R1C',k:'H',cell:8},{id:'R1_BOT1',k:'R',v:'hue'},{id:'R1_BOT2',k:'R',v:'tab'}],
  [{id:'R2A',k:'H',cell:4},{id:'R2B',k:'H',cell:0},{id:'R2C',k:'H',cell:5},{id:'R2_OFF',k:'O',v:'hue'},{id:'R2_BOT_REP',k:'R',v:'tab'}],
  [{id:'R3A',k:'H',cell:1},{id:'R3B',k:'H',cell:2},{id:'D_GIFT',k:'D',danger:'gift'},{id:'D_PRAISE',k:'D',danger:'praise'},{id:'D_ASK',k:'D',danger:'ask'},{id:'D_INVITE',k:'D',danger:'invite'}]];
const ROUND_PIECES=ROUND_FIGS.map(fs=>fs.filter(f=>f.k==='H').map(f=>CELL(f.cell)));
const DANGERS=['gift','praise','ask','invite'];
const DANGER_PIECE={gift:'gold',praise:'mountain',ask:'deadend',invite:'river'};   // README: gold (gift), dead-end, mountain, wrong river
const QS=['LOOK','HEAR','WHEN'];
const isReal=k=>k==='H';
const isBot=k=>k==='R'||k==='O';
const GIVEUP=3;   // after 3 tries that are not the right action, the figure resolves by itself (no star): no soft lock
function rng(seed){let s=(seed>>>0)||1;return ()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffleR(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function makeRound(S,ri,r){
  let fs=ROUND_FIGS[ri].slice();
  /* round 1: R1A comes first, so the first piece the child sees fits and continues the path from ⭐. The rest are seeded. */
  if(ri===0)fs=[fs[0],...shuffleR(fs.slice(1),r)];else shuffleR(fs,r);
  const tag=S.rep[ri]?'x'+S.rep[ri]:'';
  /* v5.2 (Kris 11-12, sense-check card 2: „first bot = example"): the first bot of round 1 is shown, not tested. Only on the first play of
     the round (a replay from the report is a normal test). R1A always comes first, so a true piece has gone in before it. */
  const ex=ri===0&&!S.rep[0]?fs.findIndex(d=>d.k==='R'):-1;
  return fs.map((d,i)=>{
    const f={fid:'r'+(ri+1)+'f'+(i+1)+tag,round:ri,kind:d.k,id:d.id,asked:[],nAsk:0,out:null,err:0,star:false,binned:false,lifted:false,map:0,bin:0,hand:0,wrong:0};
    if(d.k==='H')f.piece=CELL(d.cell);
    if(d.k==='R'||d.k==='O')f.v=d.v;            // v5.5 E7: the off-topic bot's piece is a near-real one too
    if(i===ex)f.example=true;
    if(d.k==='D')f.danger=d.danger;
    return f;});
}
function newSession(cfg,seed){
  const r=rng(seed),S={seed,rep:[0,0,0],placed:[START],err:[0,0,0],rounds:[]};
  for(let ri=0;ri<3;ri++)S.rounds.push(makeRound(S,ri,r));
  return S;
}
/* play one round again (report screen). Its pieces come off the map, its figures come again in a new order. */
function replayRound(S,ri,seed){
  S.rep[ri]++;const own=new Set(ROUND_PIECES[ri]);S.placed=S.placed.filter(p=>!own.has(p));S.err[ri]=0;
  S.rounds[ri]=makeRound(S,ri,rng((seed^(0x9e3779b9*(ri+1+S.rep[ri])))>>>0));
}
const allFigs=S=>S.rounds.flat();
const figOf=(S,fid)=>allFigs(S).find(f=>f.fid===fid);
/* the piece a figure holds out, once it has answered. A repeater's piece is a near-copy, wrong by v (hue or tab), never an exact copy. */
function pieceOf(S,f){
  if(f.kind==='H')return {kind:'real',slot:f.piece};
  if(f.kind==='R')return {kind:'dup',v:f.v};
  /* v5.5 E7 (Kris 11-18): the off-topic bot's piece is a near-real forest piece too (hue, or a flipped tab when no hue cell is free),
     no longer a beach piece from another map that a child could reject by its picture alone */
  if(f.kind==='O')return {kind:'dup',v:f.v};
  return {kind:DANGER_PIECE[f.danger]};
}
/* v5.2.1 (coordinator 11-12): which free cell a false piece takes the shape (and, for a hue piece, the art) of.
   Never cell 11: the big red ✖ is painted in the map picture there, so a near-copy of 11 is the one piece a child could spot by the ✖ alone
   (in every round-1 order both bots used to imitate it). Two bots of one round imitate two different cells while another free cell is left.
   Among the rest: the free cell whose placed neighbours show the most lines (cross(s), so the mismatch is visible), then the round's own
   pieces first, then the board order. Pure: cross is passed in (the page passes the map's own line crossings). */
const NO_FAKE='11';
/* v5.3.1 (critic 11-12: on cell 10, the rock, a 22° hue turn cannot be seen, and that piece is the scored test). The cells where a hue
   piece's turned colours are clearly visible: measured on the real pieces (true vs +22°, CIE Lab ΔE76 per opaque pixel), share of pixels
   with ΔE > 20: 22 38.7 % · 00 33.7 % · 12 26.5 % · 01 21.2 % (the river cells) against 21 5.7 % · 20 2.7 % · 10 0 %. The line is 15 %.
   qa-tools/v52-pieces.mjs measures it again in the page and fails if the set no longer matches. */
const HUE_OK=['00','01','12','22'];
/* o.only: only these cells (none free, or only the other bot's cell: null, the caller gives another kind of piece).
   o.spare: keep these cells free if any other cell is left (a hue bot of the same round is still to come). */
function fakeCell(placed,own,used,cross,o){o=o||{};
  let free=SLOTS.filter(s=>!placed.includes(s)&&s!==NO_FAKE);if(o.only)free=free.filter(s=>o.only.includes(s));
  if(!free.length)return o.only?null:START;
  const fresh=free.filter(s=>!used.includes(s));if(o.only&&!fresh.length)return null;
  let pool=fresh.length?fresh:free;if(o.spare){const keep=pool.filter(s=>!o.spare.includes(s));if(keep.length)pool=keep;}
  const order=[...own,...SLOTS];
  return pool.map(s=>({s,n:cross(s),o:order.indexOf(s)})).sort((a,b)=>b.n-a.n||a.o-b.o)[0].s;
}
/* v5.3.1: a bot's false piece, the two bots of a round planned together. A hue piece goes only on a HUE_OK cell; if none is free for it,
   the bot gives a tab piece instead (a tab turned the wrong way shows on any cell): never a difference a child cannot see. Any other bot,
   while a hue bot of its round is still to come, keeps the HUE_OK cells free if it can. Returns {cell, v}. */
function botPiece(placed,own,used,cross,v,hueLater){
  if(v==='hue'){const c=fakeCell(placed,own,used,cross,{only:HUE_OK});if(c)return {cell:c,v:'hue'};return {cell:fakeCell(placed,own,used,cross),v:'tab'};}
  return {cell:fakeCell(placed,own,used,cross,hueLater?{spare:HUE_OK}:null),v};
}
/* the first line, said when the card opens: round 3 only (a real child says hello, a danger figure says its sign) */
function firstLine(f){if(f.round!==2)return null;return f.kind==='H'?f.id+'_HI':f.id;}
/* the line a figure says to question q (LOOK / HEAR / WHEN). Fixed per figure, as in lines.json. */
function answerOf(S,f,q){
  if(f.kind==='H')return f.id+'_'+q;
  if(f.kind==='O')return f.id+'_'+q;     // an answer, but not to the question
  return f.id;                           // a repeater says the same thing whatever is asked; asking a danger figure repeats its line
}
/* the reducer. ev.t: ask | map | bin | tear | hand. ev.slot (map): the cell the piece was dropped on; without it a true piece goes to its own cell.
   Returns effects for the renderer. */
function step(S,ev){
  const f=figOf(S,ev.fid),fx=[];
  if(!f||f.out)return {fx:[{t:'ignored'}]};
  const ri=f.round,miss=()=>{f.err++;S.err[ri]++;if(S.err[ri]>=3)fx.push({t:'help'});};
  /* v5.4 (Kris 11-17, „Pataisom klaidas"): the first misjudgement of a figure is marked; the review brings that figure back after the report */
  const mist=(type,how)=>{if(!f.mist)f.mist={type,how};};
  if(ev.t==='ask'){const n=f.nAsk++;if(!f.asked.includes(ev.q))f.asked.push(ev.q);fx.push({t:'answer',line:answerOf(S,f,ev.q),first:n===0});return {fx};}
  /* „Pasakysiu suaugusiam ✋" is a card button in round 3, open from the first second (danger figures speak first) */
  if(ev.t==='hand'){
    if(ri!==2)return {fx:[{t:'ignored'}]};
    if(f.kind==='D'){f.out='hand';f.hand++;f.star=f.err===0;fx.push({t:'handOk',star:f.star});return {fx};}
    f.hand++;mist('real','hand');fx.push({t:'handNo'});return {fx};     // a real child: no penalty, ask instead (lines.json HAND_NO). v5.4: still a mistake to review (distrusted a real child)
  }
  if(!f.nAsk)return {fx:[{t:'locked'}]};                                // the piece comes with the first answer
  switch(ev.t){
    case 'map':
      if(f.kind==='H'){
        /* v5.2: another cell (empty or taken) is not a mistake about the figure: the piece comes back, no star lost, no error counted */
        if(ev.slot!=null&&ev.slot!==f.piece){f.wrong++;fx.push({t:'wrongcell',slot:ev.slot,n:f.wrong,right:f.piece});break;}
        f.out='placed';f.star=f.err===0;if(!S.placed.includes(f.piece))S.placed.push(f.piece);fx.push({t:'snap',slot:f.piece,star:f.star});break;}
      if(isBot(f.kind)){if(f.binned)return {fx:[{t:'ignored'}]};f.map++;if(!f.example){miss();mist('bot','map');}f.binned=true;fx.push({t:'nofit',why:f.kind==='R'?'dup':'other'},{t:'tear?'});break;}   // the example bot: it bounces, no star lost
      f.map++;miss();mist('danger','map');if(f.map+f.bin>=GIVEUP){f.out='left';fx.push({t:'dmap'},{t:'giveup'});}else fx.push({t:'dmap'});break;
    case 'bin':
      if(f.kind==='H'){f.bin++;miss();mist('real','bin');const first=!f.lifted;f.lifted=true;
        if(f.bin>=GIVEUP){f.out='placed';if(!S.placed.includes(f.piece))S.placed.push(f.piece);fx.push({t:'sad',lift:first},{t:'selfplace',slot:f.piece});}else fx.push({t:'sad',lift:first});break;}
      if(isBot(f.kind)){if(f.binned)return {fx:[{t:'ignored'}]};f.bin++;f.binned=true;fx.push({t:'binned'},{t:'tear?'});break;}
      f.bin++;if(f.map+f.bin>=GIVEUP){f.out='left';fx.push({t:'dbin'},{t:'giveup'});}else fx.push({t:'dbin'});break;   // Šalin on a danger piece is half right: no star lost
    case 'tear':
      if(!isBot(f.kind)||(!f.binned&&!f.example))return {fx:[{t:'ignored'}]};   // the example bot's mask can be torn at once (its ring shows with the piece)
      f.out='torn';f.star=f.err===0;fx.push({t:'torn',why:f.kind==='R'?'R':'O',star:f.star});break;
    default:return {fx:[{t:'ignored'}]};
  }
  return {fx};
}
/* the report: one star per figure, icons for torn masks and raised hands, the map */
function report(S){
  const per=S.rounds.map(fs=>({n:fs.length,stars:fs.filter(f=>f.star).length,err:fs.reduce((a,f)=>a+f.err,0),done:fs.every(f=>f.out),figs:fs.map(f=>({star:f.star,out:f.out,fixed:!!f.fixed}))}));
  const figs=allFigs(S);
  return {per,stars:per.reduce((a,p)=>a+p.stars,0),of:figs.length,torn:figs.filter(f=>f.out==='torn').length,hands:figs.filter(f=>f.out==='hand').length,
    placed:S.placed.length,full:S.placed.length===9,err:per.reduce((a,p)=>a+p.err,0),
    mist:figs.filter(f=>f.mist).length,fixed:figs.filter(f=>f.fixed).length,open:figs.filter(f=>f.mist&&!f.fixed).length};
}

/* ===== v5.4 „Pataisom klaidas" (Kris 11-17: „before they go into the outro, they must correct their mistakes AND UNDERSTAND WHY (crucial)").
   Every figure the child misjudged (f.mist, set in step() above) comes back after the report, in game order, one at a time:
   ① decide again (rounds 1-2: Tikras vaikas / Tai botas · round 3: Pasakysiu suaugusiam / Imsiu gabaliuką), ② „Kodėl?": 3 reason tiles.
   Pure helpers here (tests/policy.mjs checks them); the staging is in 62-review.js. ===== */
const REASONS={REP:{ic:'🔁',id:'RS_REP',rx:'RX_REP'},OFF:{ic:'❓',id:'RS_OFF',rx:'RX_OFF'},REAL:{ic:'📍',id:'RS_REAL',rx:'RX_REAL'},
  GIFT:{ic:'🎁',id:'RS_GIFT',rx:'RX_GIFT'},PRAISE:{ic:'🤩',id:'RS_PRAISE',rx:'RX_PRAISE'},ASK:{ic:'🏠',id:'RS_ASK',rx:'RX_ASK'},INVITE:{ic:'🎮',id:'RS_INVITE',rx:'RX_INVITE'}};
const reasonOf=f=>f.kind==='R'?'REP':f.kind==='O'?'OFF':f.kind==='H'?'REAL':f.danger.toUpperCase();
/* the two wrong reasons per right one (canon klausimu-standartas rule 1: each a real child mix-up, never nonsense):
   a repeater vs an off-topic bot (the two bot tells mixed up) and „a place" (the bot named a place-sounding word: „Medis", „Ten");
   a real child: „repeats" (it sounded sure) and „praises" (nice = real, the lesson's trap); a danger sign: another sign (the words
   mixed up) and „a place" (it talked about real things: gold, your school). */
const DISTRACT={REP:['OFF','REAL'],OFF:['REP','REAL'],REAL:['REP','PRAISE'],GIFT:['ASK','REAL'],PRAISE:['INVITE','REAL'],ASK:['GIFT','REAL'],INVITE:['PRAISE','REAL']};
const reasonSet=f=>{const r=reasonOf(f);return [r,...DISTRACT[r]];};             // [right, wrong, wrong]
const OPTS={REAL:{ic:'🙂',id:'OPT_REAL'},BOT:{ic:'🤖',id:'OPT_BOT'},ADULT:{ic:'✋',id:'OPT_ADULT'},TAKE:{ic:'🧩',id:'OPT_TAKE'}};
const decideOpts=f=>f.round===2?['ADULT','TAKE']:['REAL','BOT'];                 // [the two choices, in canonical order]
const rightDecision=f=>f.round===2?(f.kind==='D'?'ADULT':'TAKE'):(f.kind==='H'?'REAL':'BOT');
const reviewList=S=>allFigs(S).filter(f=>f.mist&&!f.fixed);
/* where the right choice sits, item by item, per child (canon rules 5-6). k = 3 (reasons): never the same place twice in a row, no ABAB,
   no A→B→C→A→B, each place about as often (obis 56-review.js, the same rules). k = 2 (the decision): canon's rules are written for 3+
   choices (with 2, „never twice in a row" IS the forbidden ABAB), so: never 3 in a row, no repeated rhythm of 2 or 3 (ABAB, AAB·AAB), each side about as often (±2). */
function posOk(p,k){const i=p.length-1;if(i<1)return true;
  if(k>=3){if(p[i]===p[i-1])return false;if(i>=3&&p[i]===p[i-2]&&p[i-1]===p[i-3])return false;if(i>=4&&p[i]===p[i-3]&&p[i-1]===p[i-4])return false;return true;}
  if(i>=2&&p[i]===p[i-1]&&p[i]===p[i-2])return false;
  /* no rhythm: the last q places never repeat the q before them (q = 2: ABAB · q = 3: AAB·AAB). q = 4 is not asked: with 2 choices the
     longest order with no repeated 2-, 3- or 4-long pattern is 8 items (checked by brute force, 2026-11-17), and 16 figures can all come back */
  for(let q=2;q<=3;q++)if(i>=2*q-1){let same=true;for(let j=0;j<q;j++)if(p[i-j]!==p[i-j-q]){same=false;break;}if(same)return false;}
  return true;}
function positions(n,k,r){const slack=k>=3?1:2;
  for(let t=0;t<500;t++){const p=[];let dead=false;
    for(let j=0;j<n&&!dead;j++){const cnt=[...Array(k).keys()].map(v=>p.filter(x=>x===v).length),lo=Math.min(...cnt);
      const c=shuffleR([...Array(k).keys()].filter(v=>cnt[v]<=lo+slack),r).find(v=>posOk([...p,v],k));if(c==null)dead=true;else p.push(c);}
    if(!dead)return p;}
  return Array.from({length:n},()=>Math.floor(r()*k));}
/* the review of one item: the decision, then the reason. Returns what happened; the page stages it. Never a penalty. */
function revStep(R,f,ev){
  if(ev.t==='decide'){if(R.step!=='decide')return {t:'ignored'};if(ev.c===rightDecision(f)){R.step='why';return {t:'decideOk'};}R.miss++;return {t:'decideNo',n:R.miss};}
  if(ev.t==='why'){if(R.step!=='why')return {t:'ignored'};if(ev.c===reasonOf(f)){R.step='done';f.fixed=true;return {t:'whyOk',first:!R.miss&&!R.rmiss};}R.rmiss++;return {t:'whyNo',n:R.rmiss};}
  return {t:'ignored'};}

/* ---- 10-forest.js ---- */
/* ===== Forest. Atlas painter ported verbatim from Klaido bėgimas (our own code).
   Layout differs: a path corridor (ground shots) + the glade seen from the tree. All baked once. ===== */

function curveTube(pts,r0,r1,seg,rad,uRep,vRep){
  const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const g=new THREE.TubeGeometry(c,seg,1,rad,false),P=g.attributes.position,U=g.attributes.uv,cn=new THREE.Vector3(),v=new THREE.Vector3();
  for(let i=0;i<P.count;i++){const k=Math.round(U.getX(i)*seg)/seg;c.getPointAt(k,cn);v.fromBufferAttribute(P,i).sub(cn).multiplyScalar(r0+(r1-r0)*k).add(cn);P.setXYZ(i,v.x,v.y,v.z);U.setXY(i,U.getX(i)*uRep,U.getY(i)*vRep);}
  g.computeVertexNormals();return g;
}

  const c=$('piece');

    PC.down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};PC.dx=PC.x-e.clientX;PC.dy=PC.y-e.clientY;});
  c.addEventListener('pointermove',e=>{if(!PC.down)return;if(!PC.down.moved&&Math.hypot(e.clientX-PC.down.x,e.clientY-PC.down.y)>10){PC.down.moved=true;PC.mode='drag';c.classList.add('drag');handHide();pulseOff();cutBg();}
    if(PC.mode==='drag'&&PC.armed)pieceArm(false);
    if(PC.mode==='drag'){PC.x=e.clientX+PC.dx;PC.y=e.clientY+PC.dy;PC.sc=1;const hot=inRect(e.clientX,e.clientY,$('salin').getBoundingClientRect(),30);$('salin').classList.toggle('hot',hot);}});
  const up=e=>{const d=PC.down;PC.down=null;c.classList.remove('drag');$('salin').classList.remove('hot');if(!d)return;
    /* v5.2: a tap picks the piece up; the next tap on a cell of the map puts it there (a second tap on the piece: it wiggles, still picked up) */
    if(!d.moved){PC.mode='held';if(PC.armed){c.classList.remove('wig');void c.offsetWidth;c.classList.add('wig');}else{pieceArm(true);SFX.pop();handHide();pulseOff();cutBg();}return;}
    const x=e.clientX,y=e.clientY;

function thinkFit(w,h){const B=TK.box,bh=B.max.y-B.min.y+.18,bw=(B.max.x-B.min.x)*1.15,cy=(B.max.y+B.min.y)/2+.06,t=Math.tan(TK.cam.fov*Math.PI/360);

/* the cloud's outline, drawn for the size of what it holds. An oval (a superellipse, exponent CLOUD.n) holds Baitas's column and the
   sentence inside it; uneven bumps (arcs of different lengths and roundness, always the same, from a fixed seed) sit on the oval. */
const CLOUD={n:3.4,seed:0x5eed11,fit:1.03};
function thinkLayout(){const t=$('think'),tb=t.querySelector('.tb'),cw=tb.offsetWidth,ch=tb.offsetHeight;if(!cw||!ch)return;
  /* how big the oval must be: every corner of every line of the sentence, and Baitas's own box (the middle of his column, as tall as it),
     inside it, with a little room (CLOUD.fit). The empty corners of his column may sit under the bumps. */
  const n=CLOUD.n,q=tb.getBoundingClientRect(),sx=q.width/cw||1,sy=q.height/ch||1,ink=[],rg=document.createRange();rg.selectNodeContents($('thinkL'));

  const dw=$('thinkCv').parentNode.offsetWidth;for(const x of [dw*.14,dw*.86])for(const y of [ch*.04,ch*.96])ink.push([x-cw/2,y-ch/2]);
  const k=Math.max(1,...ink.map(([x,y])=>Math.pow(Math.pow(Math.abs(x)/(cw/2),n)+Math.pow(Math.abs(y)/(ch/2),n),1/n)))*CLOUD.fit;
  const a=cw/2*k,b=ch/2*k,u=Math.max(60,LAY.H*.13);   // u: a bump's mean length along the oval
  const N=900,P=[];for(let i=0;i<N;i++){const q=(i/N+.07)*2*Math.PI,c=Math.cos(q),s=Math.sin(q);P.push([a*Math.sign(c)*Math.pow(Math.abs(c),2/n),b*Math.sign(s)*Math.pow(Math.abs(s),2/n)]);}
  const seg=[];let per=0;for(let i=0;i<N;i++){const p=P[i],q=P[(i+1)%N],d=Math.hypot(q[0]-p[0],q[1]-p[1]);seg.push(d);per+=d;}
  let sd=CLOUD.seed>>>0;const rnd=()=>((sd=(Math.imul(sd,1664525)+1013904223)>>>0)/4294967296);
  const lens=[],fs=[];let sum=0;while(sum<per-u*.5){const l=u*(.7+.65*rnd());lens.push(l);fs.push(1+.32*rnd());sum+=l;}
  const sc=per/sum,pts=[];let acc=0,j=0,run=0;for(let i=0;i<lens.length;i++){const goal=acc;while(j<N&&run+seg[j]<goal){run+=seg[j];j++;}
    const p=P[j%N],q=P[(j+1)%N],f=seg[j%N]?(goal-run)/seg[j%N]:0;pts.push([p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f]);acc+=lens[i]*sc;}

  for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],dx=q[0]-p[0],dy=q[1]-p[1],c=Math.hypot(dx,dy),R=c/2*fs[i],h=R-Math.sqrt(Math.max(0,R*R-c*c/4)),nx=dy/c,ny=-dx/c;
    arcs.push([q,R]);for(const [x,y] of [p,q,[p[0]+nx*h,p[1]+ny*h],[q[0]+nx*h,q[1]+ny*h]])ext(x,y);}

  let d=`M${F(pts[0][0]+ox)} ${F(pts[0][1]+oy)}`;for(const [q,R] of arcs)d+=`A${F(R)} ${F(R)} 0 0 1 ${F(q[0]+ox)} ${F(q[1]+oy)}`;d+='Z';

  tb.style.left=F(ox-cw/2)+'px';tb.style.top=F(oy-ch/2)+'px';

  const q0=.62,c0=Math.cos(q0),s0=Math.sin(q0);TK.edge=[ox+a*Math.pow(c0,2/n)*1.04,oy+b*Math.pow(s0,2/n)*1.04];

function headW(E){const s=E.shell;if(s&&s.parent===E.P.head){s.updateWorldMatrix(true,false);return s.localToWorld(V3(0,0,.3));}E.P.head.updateWorldMatrix(true,true);return E.P.head.localToWorld(V3(0,.31,.3));}
async function figTurn(E,yaw,d=.35){const a=E.yaw,b=a+Math.atan2(Math.sin(yaw-a),Math.cos(yaw-a));if(Math.abs(b-a)<.05){E.yaw=b;return;}await tw(d,k=>{E.yaw=a+(b-a)*k;});}
async function figWalk(E,x,z,d){
  const x0=E.root.position.x,z0=E.root.position.z;await figTurn(E,Math.atan2(x-x0,z-z0));
  E.root.userData.pose='walk';await tw(d,k=>{E.root.position.x=x0+(x-x0)*k;E.root.position.z=z0+(z-z0)*k;},ease.l);E.root.userData.pose='idle';
}
/* the walk-in: same time, same path, same pose for every kind */
async function figIn(f){
  const E=buildCloaked({mask:f.mask,long:f.long});E.f=f;S.F=E;
  E.root.position.set(TALK_FROM.x+RR(-.4,.4),0,TALK_FROM.z);E.yaw=Math.atan2(WORLD.talk.x-E.root.position.x,WORLD.talk.z-E.root.position.z);scene.add(E.root);
  await figWalk(E,WORLD.talk.x,WORLD.talk.z,CFG.walkInS);
  await figTurn(E,Math.atan2(CAM.p.x-WORLD.talk.x,CAM.p.z-WORLD.talk.z),.3);
  return E;
}
/* a figure walks away. It may still be walking while the next one comes in (LEAVING), so a jump or a replay frees it too. */
const LEAVING=new Set();
async function figLeave(E){if(!E||E.dead)return;LEAVING.add(E);try{await figWalk(E,TALK_FROM.x+RR(-1.5,1.5),TALK_FROM.z-3,1.5);}finally{LEAVING.delete(E);freeFig(E);if(S.F===E)S.F=null;dropJunk(E);}}
/* a fallen mask stays on the ground until its figure has gone, then shrinks away (never pops) */
function dropJunk(E){for(const j of S.junk.filter(j=>j.E===E)){S.junk.splice(S.junk.indexOf(j),1);const o=j.o,s0=o.scale.clone();bg(tw(.3,k=>{o.scale.copy(s0).multiplyScalar(1-k*.98);}).finally(()=>{if(o.parent)o.parent.remove(o);}));}}
function clearJunk(all){for(const j of S.junk.slice())if(all||!j.E||j.E.dead){if(all){if(j.o.parent)j.o.parent.remove(j.o);S.junk.splice(S.junk.indexOf(j),1);}else dropJunk(j.E);}if(all)S.junk=[];}
/* a mask comes off (a real child's reveal, or a torn bot mask): it hops off the head, falls to the ground beside the figure
   and lies there, tilted so its picture still reads, until the figure has gone. face: a real child's face shows. */
async function maskOff(E,face){
  const s=E.shell;if(!s||s.parent!==E.P.head)return;
  if(face){const fc=makeFace(E.f.kid);E.P.head.add(fc);fc.visible=true;E.face=fc;}else E.void.visible=true;
  scene.attach(s);S.junk.push({o:s,E});
  const p0=s.position.clone(),q0=s.quaternion.clone(),r=E.root.position;
  const cx=camera.position.x-r.x,cz=camera.position.z-r.z,cl=Math.hypot(cx,cz)||1,ux=cx/cl,uz=cz/cl;   // toward the camera
  const side=(E.f&&E.f.round!=null)?1:-1,rx=-uz*side,rz=ux*side;                                      // the camera's right (or left in the outro)
  const tilt=.62,hh=.45*s.scale.y*s.parent.scale.y,tx=r.x+rx*.95+ux*.35,tz=r.z+rz*.95+uz*.35,ty=.04+hh*Math.sin(tilt);
  const q1=new THREE.Quaternion().setFromEuler(new THREE.Euler(-(Math.PI/2-tilt),Math.atan2(camera.position.x-tx,camera.position.z-tz),RR(-.25,.25),'YXZ'));
  SFX[face?'jingle':'rip']();
  await tw(.62,k=>{s.position.set(p0.x+(tx-p0.x)*k,p0.y+(ty-p0.y)*k+Math.sin(Math.PI*k)*(face?.55:.3),p0.z+(tz-p0.z)*k);s.quaternion.copy(q0).slerp(q1,ease.io(k));},ease.l);
  SFX.thud();await tw(.18,k=>{s.position.y=ty+Math.sin(Math.PI*k)*.07;},ease.l);
}

/* ---------- the piece: it appears under the card, beside „Šalin" ---------- */
/* a false piece takes the shape of the empty slot whose placed neighbours show the most lines, so the mismatch is visible.
   v5.2.1: never cell 11 (the ✖), and not a cell another bot of this round already imitated (fakeCell in 05-logic) */
/* v5.3.1: the two bots of a round are planned together (botPiece in 05-logic): a hue piece only where the hue shows, else a tab piece */
function fakeTarget(f){
  const L=S.L,fs=L.rounds[f.round],used=fs.filter(g=>g!==f&&isBot(g.kind)&&g.shape).map(g=>g.shape);
  /* v5.5 E7: the off-topic bot (O) plans its near-real piece like a repeater (R): hue only on a HUE_OK cell, else a flipped tab */
  const hueLater=fs.some(g=>g!==f&&isBot(g.kind)&&g.v==='hue'&&!g.shape);
  return botPiece(L.placed,ROUND_PIECES[f.round],used,s=>JIG.crossings(s,L.placed).length,isBot(f.kind)?f.v||null:null,hueLater);
}
/* v5.2 (Kris 11-12: „make the bots give wrong pieces - they either look different (slightly different colour hues) or have a mismatching
   puzzle shape"). A repeater's piece is never a copy of a true piece: it is the forest art of a free cell with its colours turned (hue),
   or the right art with one tab turned the wrong way, so it fits no cell (tab). The other bots keep their pictures from other maps. */
function offerPiece(f){
  const P=pieceOf(S.L,f);let shape,kind=P.kind;const o={};
  if(P.kind==='real')shape=f.piece;
  else{const T=fakeTarget(f);shape=T.cell;if(P.kind==='dup'){kind='real';if(T.v!==f.v){f.vWas=f.v;f.v=T.v;}if(T.v==='tab'){f.flip=JIG.tabFlip(shape,S.L.placed);o.flip=f.flip;}else o.hue=CFG.hueShift;}}
  f.shape=shape;pieceSet(JIG.piece(kind,shape,o));
  [PC.x,PC.y]=pieceHome();PC.sc=.2;PC.mode='held';pieceShow(true);salinShow(true);SFX.pop();
}
async function pieceBack(){const c=$('piece');c.classList.remove('bad','dim');pieceShow(true);salinShow(true);await pieceFly(()=>[...pieceHome(),1],.4);PC.mode='held';}
async function toBin(){SFX.whoosh();await pieceFly(()=>{const[x,y]=rectC($('salin'));return [x,y,.3];},.4);pieceShow(false);}
async function shakePiece(){SFX.boing();await tw(.5,k=>{PC.ox=Math.sin(k*Math.PI*7)*14*(1-k);},ease.l);PC.ox=0;}
/* a real piece flies to its slot and snaps in; the mask falls off beside the child, it says thanks and goes */
async function snapPiece(E,f,slot){
  S.pending=slot;pieceShow(true);salinShow(false);await pieceFly(()=>slotPx(slot),.45);S.pending=null;pieceShow(false);
  SFX.pop();JIG.flash(slot,.7);JIG.draw();starsDraw();if(f.star){SFX.ding();sfxV('SFX_OK.mp3',.5);}
  E.root.userData.pose='happy';
  const off=maskOff(E,true),first=!S.saidFit[f.round];S.saidFit[f.round]=true;
  if(first)await Promise.all([off,talk('FB_FIT')]);else await off;
  /* the child says thanks (the bubble, the card has closed) and walks away; the next figure walks in meanwhile. Its card waits for the line. */
  cardHide();talkBg('FB_THANKS_'+spkOf(f),{E,mask:f.mask});bg(wait(.5).then(()=>figLeave(E)));
  if(slot==='11')await talk('MAP_SPLIT');                      // the fork ✖: Klaidas knows the place (his bubble, after the thanks)
  else await wait(.4);
}
/* help: after 3 mistakes in a round the clue (the reply in the card) glows for CFG.helpGlowS. It never shows which move is right. */
function helpGlow(){const m=$('cMsg'),d=CFG.helpGlowS;m.classList.add('glow');$('cSnd').classList.add('pulse');bg(wait(d).then(()=>{m.classList.remove('glow');$('cSnd').classList.remove('pulse');}));}

/* ---------- one figure ---------- */
async function waitAct(){S.actOpen=true;S.idle=0;try{return await waitFor('act');}finally{S.actOpen=false;handHide();pulseOff();}}
function firstRow(){return [...$('cOpts').children].find(r=>!r.hidden&&r.dataset.q!=='ADULT');}
async function figure(f){
  const L=S.L;S.cur=f;S.phase='walk';S.mode='talk';S.hintKey=null;starsDraw();
  clearJunk();cardHide();salinShow(false);pieceShow(false);tearHide();
  S.T[f.fid+'_0']=S.play;const E=await figIn(f);S.T[f.fid+'_w']=S.play;
  await talkQ;S.T[f.fid]=S.play;                                  // the line still playing (a thanks, a „bot" explanation) ends before the card opens
  capHide();bubbleHide();                                          // nothing said about the figure before stays next to this one („Tinka! Tikras vaikas." was left over)
  cardOpen(f);SFX.pop();
  /* round 3: the figure speaks first (its line is the cue); the danger card comes with the words, never before them */
  const fl=firstLine(f);
  if(fl)talkBg(fl,{E,onShow:()=>{$('card').classList.toggle('danger',f.kind==='D');}});
  else if(!S.hinted.ask){S.hinted.ask=true;const r=firstRow();if(r)handTap(r.firstChild);talkBg('HOW_1');}
  for(;;){
    S.phase=f.nAsk?'decide':'ask';S.hintKey=S.phase==='decide'&&f.example?'tear':S.phase;cardRows(f);
    const a=await waitAct();
    if(a.t==='ask'){
      const ans=step(L,{t:'ask',fid:f.fid,q:a.q}).fx[0];cardRows(f);
      {const l0=[].concat(ans.line)[0];if(l0&&VO[l0])cardMsg(split2(VO[l0])[0],l0);}   // the card has its final size before the piece is placed under it
      /* v5.2 (Kris 11-12, „first bot = example"): the first bot of round 1 is shown, not tested. Its answer, then the narrator:
         „Kartoja tą patį. Tai botas." „Plėšk kaukę!" while its piece is out and the ring is already on its mask, with the hand on the ring.
         Nothing waits: the child may tear, use Šalin or even try the map (it bounces, no star lost) while the lines play. */
      if(ans.first&&f.example)talkBg([].concat(ans.line,'FB_REPEAT','FB_RIP'),{E});else talkBg(ans.line,{E});
      if(ans.first){offerPiece(f);
        if(f.example){S.hinted.tear=true;tearShow(()=>projPx(headW(E)));handTear();}
        else if(!S.hinted.put){S.hinted.put=true;const to=f.piece||f.shape;handDrag(()=>[PC.x,PC.y],()=>slotPx(to),PC.src,()=>slotPx(to)[2]);}}
      continue;}
    if(a.t==='tear'&&!(f.example&&f.nAsk))continue;
    const{fx}=step(L,{t:a.t,fid:f.fid,slot:a.slot});
    if(fx[0].t==='locked'||fx[0].t==='ignored')continue;
    trk('act',{t:a.t});
    S.phase='stage';
    if(await stage(E,f,fx,a))break;
  }
  S.cur=null;S.phase=null;starsDraw();
}
/* the decision's effects, staged. Returns true when the figure is done. */
async function stage(E,f,fx,a){
  const has=t=>fx.find(e=>e.t===t),help=!!has('help'),lines=[];let out=false;
  const tried=(a&&a.slot)||f.shape;                               // v5.2: the cell the child put the piece on
  if(has('snap')){await snapPiece(E,f,has('snap').slot);out=true;}
  else if(has('torn')){/* the example bot, its mask torn while its piece was still out: the piece goes to Šalin, the mask comes off */
    tearHide();                                                    // v5.2.1: the ring has done its job; it does not wait on screen during the fly
    if(!$('piece').hidden)await toBin();salinShow(false);await tornScene(E,f,has('torn'));out=true;}
  else if(has('wrongcell')){
    /* v5.2 (Kris 11-12: „the player has to insert the pieces in correct places themselves"). A true piece on another cell does not go in:
       it slides back to the hand, the tried cell blinks white, one soft sound. No star lost, no ring, no words. After CFG.wrongGlowAfter
       wrong cells its own cell glows softly. */
    const w=has('wrongcell');SFX.soft();await pieceFly(()=>slotPx(w.slot),.28);JIG.blink(w.slot);await wait(.2);await pieceBack();
    if(w.n>=CFG.wrongGlowAfter)JIG.glow(w.right,CFG.wrongGlowS);
    return false;}
  else if(has('nofit')){
    /* a bot's piece on the map: it does not go in, shakes, bounces to Šalin. Where it does not fit: red rings where the lines do not meet;
       a tab turned the wrong way: one ring on that tab; a piece with turned colours on its look-alike cell: its red glow only */
    const slot=tried;
    await pieceFly(()=>slotPx(slot),.4);$('piece').classList.add('bad');
    if(f.v==='tab'&&slot===f.shape&&f.flip!=null)JIG.rings([JIG.tabAt(slot,f.flip)],2.4);
    else if(!(f.v==='hue'&&slot===f.shape))JIG.rings(JIG.crossings(slot,S.L.placed),2.4);
    await shakePiece();await toBin();
    await tearPhase(E,f,'FB_NOFIT');out=true;}
  else if(has('binned')){await toBin();await tearPhase(E,f,'FB_RIP');out=true;}
  else if(has('dmap')){
    await pieceFly(()=>slotPx(tried),.4);$('piece').classList.add('dim');SFX.thud();await shakePiece();
    lines.push('HAND_TOOK');
    if(has('giveup')){pieceShow(false);salinShow(false);talkBg(lines);await wait(.6);cardHide();await figLeave(E);return true;}
    await pieceBack();}
  else if(has('dbin')){await toBin();salinShow(false);lines.push('HAND_BIN');
    if(has('giveup')){talkBg(lines);await wait(.6);cardHide();await figLeave(E);return true;}}
  else if(has('sad')){
    /* a real child pushed away: sad, its mask comes off (the first time), „Aš tikras! Pabandyk dar.", the piece comes back */
    await toBin();E.root.userData.pose='sad';
    const off=has('sad').lift?maskOff(E,true):null;
    if(has('selfplace')){if(off)await off;await talk('FB_REAL_'+spkOf(f),{E});await snapPiece(E,f,f.piece);return true;}
    lines.push('FB_REAL_'+spkOf(f));if(help)lines.push('FB_HELP');talkBg(lines,{E});
    if(off)await off;await pieceBack();return false;}
  else if(has('handOk')){signPulse(f);pieceShow(false);salinShow(false);SFX.ding();sfxV('SFX_OK.mp3',.5);starsDraw();talkBg('HAND_OK');await wait(.5);cardHide();bg(figLeave(E));await wait(.3);out=true;}
  else if(has('handNo')){lines.push('HAND_NO');}
  if(help&&!out){helpGlow();if(!lines.includes('FB_HELP'))lines.push('FB_HELP');}
  if(lines.length&&!out)talkBg(lines,{E});
  return out;
}
/* after a bot's piece is pushed away: tear its mask (the ring says „Plėšk!") */
async function tearPhase(E,f,line){
  S.phase='tear';salinShow(false);pieceShow(false);
  tearShow(()=>projPx(headW(E)));
  /* v5.2.1: a tap on the ring kept during the bounce (act() → S.tearQ) tears the mask now, without the narrator's „Plėšk!" */
  if(S.tearQ){S.tearQ=false;const{fx}=step(S.L,{t:'tear',fid:f.fid}),e=fx[0];if(e.t==='torn'){trk('act',{t:'tear',kept:1});await tornScene(E,f,e);return;}}
  if(!S.hinted.tear){S.hinted.tear=true;handTear();}
  talkBg(line);
  for(;;){S.hintKey='tear';const a=await waitAct();if(a.t!=='tear')continue;
    const{fx}=step(S.L,{t:'tear',fid:f.fid}),e=fx[0];if(e.t!=='torn')continue;
    await tornScene(E,f,e);break;}
}
/* the mask falls to the ground: nothing under it. The cloak collapses into a puff. The mask lies there until the next figure. */
async function tornScene(E,f,e){
  tearHide();starsDraw();
  await Promise.all([maskOff(E,false),talk('FB_EMPTY')]);
  SFX.puff();Puff.at(chest(E),1.6);const sy=E.root.scale.y;cardHide();
  await tw(.5,k=>{E.root.scale.y=sy*(1-.95*k);},ease.i);freeFig(E);if(S.F===E)S.F=null;
  if(!f.example)talkBg(e.why==='R'?'FB_REPEAT':'FB_OFF');   // the example bot heard „Kartoja tą patį. Tai botas." before the tear
}

/* ---------- rounds ---------- */
async function titleCard(ri){
  $('titleN').textContent=String(ri+1);$('titleI').textContent=ROUND_IC[ri];$('title').hidden=false;capWide('all');SFX.ding();
  await talk(['R1_TITLE','R2_TITLE','R3_TITLE'][ri],{min:1.3});$('title').hidden=true;capHide();capWide(null);
}
async function playRound(ri){
  S.ri=ri;S.scene='r'+(ri+1);stamp('r'+(ri+1));trk('round',{ri});
  talkScene();starsDraw();
  S.mode='cut';
  await titleCard(ri);
  S.mode='talk';
  /* v5.3 (Kris 11-12, the ✋ rule goes to the start of round 3): after R3_TITLE, SIGNS_1 then SIGNS_2 in the normal caption.
     A tap on the scene cuts a line short (lineSkip), the next one comes at once: they never hold the child. */
  if(ri===2){await talk('SIGNS_1');await talk('SIGNS_2');capHide();}
  if(ri===2)signsShow(true);       // v5.2 (Kris 11-12: „4 small icons stay"): the four danger signs stay on screen while round 3's figures come
  for(const f of S.L.rounds[ri]){if(f.out)continue;await figure(f);}
  if(ri===2)signsShow(false);
  stamp('e'+(ri+1));
}
async function playFrom(ri){
  for(let r=ri;r<3;r++){await playRound(r);if(r<2)await runScene(r);}
  await fullMap();await reportScene();
}

/* ---------- the runs between rounds: one input (Space or a tap), logs to jump. A missed jump: Klaidas climbs over. Cannot be failed.
   run 1: about 15 s, three logs. run 2 (v5.2, Kris 11-12: „another running section where you jump over the logs with Klaidas and have just
   the 3d baitas pop out from the corner in a thought bubble and remind klaidas of those four rules"). v5.3 (Kris 11-12: „too much going on
   there, we need to simplify that section"): Baitas pops up in a thought cloud with one sentence, BAITAS_WARN; no caption, no other line.
   R3_TITLE, SIGNS_1 and SIGNS_2 moved to the start of round 3; SIGNS_3 is no longer used. ---------- */
const LOGS=[0,1,2,3,4,5,6].map(()=>{const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,3.4,12),lam('#7a4a22'));m.rotation.z=Math.PI/2;m.position.y=.3;g.add(m);
  for(const s of [-1,1]){const c=new THREE.Mesh(new THREE.CircleGeometry(.3,12),lam('#d9a866'));c.position.set(s*1.71,.3,0);c.rotation.y=s*Math.PI/2;g.add(c);}g.visible=false;scene.add(g);return g;});
const RUN={on:false,z:0,air:false,t:0,climb:0,cz:0,logi:0,u0:0,u1:0,jumps:0,cleared:0,climbed:0,done:null,hint:false,hintLine:true,logs:[],v:5.6,z0:92,z1:10,at:false,lt:0,hits:[]};
function runJump(){if(!RUN.on||RUN.air||RUN.climb>0)return;RUN.air=true;RUN.t=0;RUN.jumps++;KL.userData.pose='fist';SFX.pop();$('key').hidden=true;handHide();}
function runTick(dt){
  if(!RUN.on)return;const kl=KL.position;RUN.lt+=dt;
  if(RUN.climb>0){RUN.climb-=dt;const k=clamp(1-RUN.climb/CFG.climbS,0,1);kl.y=Math.sin(k*Math.PI)*.95;kl.z=RUN.cz-k*1.3;if(RUN.climb<=0){KL.userData.pose=RUN.at?'idle':'run';RUN.z=RUN.cz-1.3;kl.y=0;}}
  else{if(!RUN.at)RUN.z-=RUN.v*dt;
    if(RUN.air){RUN.t+=dt;const k=RUN.t/CFG.jumpS;kl.y=Math.sin(Math.min(1,k)*Math.PI)*CFG.jumpH;if(k>=1){RUN.air=false;kl.y=0;KL.userData.pose=RUN.at?'idle':'run';}}
    const lz=RUN.logs[RUN.logi];
    /* the first run: as the first log comes near, „Šok per rąstą!", the ghost hand and the ␣ key show the one input */
    if(RUN.hint&&lz!=null&&RUN.z-lz<6.5){RUN.hint=false;if(RUN.hintLine)talkBg('RUN_JUMP');$('key').hidden=false;handShow('tap',()=>[innerWidth*(.5-CAM.shift/2)-innerWidth*.08,innerHeight*.55]);}
    if(lz!=null&&RUN.z<=lz+.55){RUN.hits.push(+RUN.lt.toFixed(2));if(RUN.air&&kl.y>.45){RUN.cleared++;SFX.whoosh();}else{RUN.climb=CFG.climbS;RUN.cz=lz+.55;RUN.air=false;KL.userData.pose='climb';SFX.climb(3);RUN.climbed++;}RUN.logi++;}
    kl.z=RUN.z;}
  const k=clamp((RUN.z0-kl.z)/(RUN.z0-RUN.z1),0,1);JIG.dot(JIG.routeAt(RUN.u0+(RUN.u1-RUN.u0)*k));
  if(kl.z<=RUN.z1&&RUN.climb<=0&&!RUN.at){RUN.at=true;if(!RUN.air)KL.userData.pose='idle';const d=RUN.done;RUN.done=null;if(d)d();}
}
/* the run camera sits on the path, behind and above Klaidas, looking down the path: the side plants stay at the sides, nothing is sliced by the lens */
const RUNCAM={back:6.6,h:2.75,ahead:7.5,lookY:1.0};
function runSetup(ri,o){
  cleanEnc();hideOverlays();swarmHide();ffShow(false);mood(false);setFog(8,44);CAM.shiftFig=false;CAM.shift=o.shift||0;CAM.sway=0;capWide('all');
  boardMode('small');RUN.logs=o.logs;LOGS.forEach((g,i)=>{const z=o.logs[i];g.visible=z!=null;if(z!=null)g.position.set(0,0,z);});
  KL.visible=true;KL.scale.setScalar(1);KL.position.set(0,0,o.z0);KL.rotation.set(0,Math.PI,0);KL.userData.pose='run';KL.userData.runK=o.runK||1;
  Object.assign(RUN,{z:o.z0,z0:o.z0,z1:o.z1,v:o.v,air:false,t:0,climb:0,logi:0,u0:S.routeU,u1:JIG.routeOpen(S.L.placed),jumps:0,cleared:0,climbed:0,hint:!S.hinted.run,hintLine:o.hintLine!==false,at:false,lt:0,hits:[]});S.hinted.run=true;
  const kl=KL.position;CAM.fov=55;CAM.follow=()=>{CAM.p.set(0,RUNCAM.h,kl.z+RUNCAM.back);CAM.l.set(0,RUNCAM.lookY,kl.z-RUNCAM.ahead);};
}

/* the Baitas run's timing (v5.3). The cloud pops at `open`, is fully open `popS` later; then Baitas hops, his visor goes red and, when
   the clip is there, the narrator says BAITAS_WARN once (no caption, no 🔊). The sentence is in the cloud from the pop to the run's end;
   it gets at least readS (7 s) of reading time, or the clip's length if longer. Klaidas runs at run 1's speed; the run lasts its usual
   length, longer only if the sentence needs it. v5.3.1 (critic 11-12): two logs, both after the sentence is said and read: the first
   afterRead after the reading time ends (8.27 s, where v5.3 had its middle log), the last lastGap before the end (13.43 s); at least
   minGap apart, and the run grows if a longer clip pushes them. A log needs its jump in the jumpS (0.72 s) before it reaches Klaidas; the
   first one comes at least jumpS + 0.3 s after the clip ends. With no clip the reading time is still readS: no log before 8 s. */
function runBPlan(){
  const B=CFG.runB,v=B.v,open=B.open,sayAt=+(open+B.popS).toFixed(2),read=+Math.max(B.readS,estDur('BAITAS_WARN')).toFixed(2);
  const base=(B.z0-B.z1)/v,a1=sayAt+Math.max(read+B.afterRead,estDur('BAITAS_WARN')+CFG.jumpS+.3),aN=Math.max(a1+B.minGap,base-B.lastGap);
  const end=+Math.max(base,aN+B.lastGap,sayAt+read+B.tail).toFixed(2),z0=+(B.z1+v*end).toFixed(2),slip=+(Math.max(0,CFG.climbS-1.3/v)+.05).toFixed(2),at=[],logs=[];
  for(let i=0;i<B.logs;i++){const a=B.logs>1?a1+(aN-a1)*i/(B.logs-1):a1;at.push(+a.toFixed(2));logs.push(+(z0-v*a-.55).toFixed(2));}
  return {open,sayAt,read,readEnd:+(sayAt+read).toFixed(2),end,v,z0,z1:B.z1,slip,at,logs,clip:hasVoice('BAITAS_WARN')};
}

  REV.i=k;REV.f=f;const R=REV.R={step:'decide',miss:0,rmiss:0};const t0=S.t;
  S.cur=null;S.phase='rev-walk';S.hintKey=null;clearJunk();cardHide();salinShow(false);pieceShow(false);tearHide();
  signsShow(f.round===2);
  const E=await figIn(f);await talkQ;capHide();bubbleHide();
  revCard(f,k);SFX.pop();
  /* ② decide again. The figure says its reply again; then the prompt and both choices are read out in screen order. All live at once. */
  const dk=revOrder(f,k,'decide');revRows(dk,'decide');
  const pr=f.round===2?'REV_DO':'REV_WHO';
  talkBgL([{id:revLine(f),o:{E,where:'keep'}},{id:pr,o:{where:'keep',onShow:()=>revStepText(pr)}},...dk.map(c=>({id:OPTS[c].id,o:{where:'keep'}}))]);
  revStepText(pr);
  S.phase='rev-decide';
  for(;;){S.hintKey='rev';const a=await waitAct();
    if(a.t!=='rev'||a.step!=='decide')continue;
    if(performance.now()<REV.guard)continue;
    const r=revStep(R,f,{t:'decide',c:a.c});REV.log.push({ev:r.t,c:a.c,fid:f.fid,t:+S.t.toFixed(2)});
    if(r.t==='decideOk'){const row=revRow(a.c);if(row)row.firstChild.classList.add('yes');SFX.pop();break;}
    if(r.t==='decideNo'){const row=revRow(a.c);if(row){const b=row.firstChild;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
      SFX.soft();evidence(f,true);talkBgL([{id:'FB_HELP',o:{where:'keep',onShow:()=>revStepText('FB_HELP')}}]);
      if(r.n>=2){const rr=revRow(rightDecision(f));if(rr)rr.firstChild.classList.add('rglow');}}
  }
  await wait(.3);
  /* ③ „Kodėl?" — the evidence goes off, so the right reason is not on screen while she chooses */
  evidence(f,false);
  const rk=revOrder(f,k,'why');revRows(rk,'why');REV.guard=performance.now()+450;
  talkBgL([{id:'REV_WHY',o:{where:'keep',onShow:()=>revStepText('REV_WHY')}},...rk.map(c=>({id:REASONS[c].id,o:{where:'keep'}}))]);
  revStepText('REV_WHY');S.phase='rev-why';
  const right=reasonOf(f);let first=true;
  for(;;){S.hintKey='rev';const a=await waitAct();
    if(a.t!=='rev'||a.step!=='why')continue;
    if(performance.now()<REV.guard)continue;
    const r=revStep(R,f,{t:'why',c:a.c});REV.log.push({ev:r.t,c:a.c,fid:f.fid,t:+S.t.toFixed(2)});
    if(r.t==='whyOk'){const row=revRow(a.c);if(row){row.firstChild.classList.remove('rglow');row.firstChild.classList.add('yes');}first=r.first;break;}
    if(r.t==='whyNo'){const row=revRow(a.c);if(row)row.firstChild.classList.add('no');SFX.soft();
      /* the narrator names the right reason while the evidence glows; the right tile glows and the hand points at it: she taps it */
      evidence(f,true);const rr=revRow(right);if(rr){rr.firstChild.classList.add('rglow');handTap(rr.firstChild);}
      talkBgL([{id:REASONS[right].rx,o:{where:'keep',onShow:()=>revStepText(REASONS[right].rx)}}]);}
  }
  /* critic v5.4 #1: the right reason is always said back, with the evidence on (canon rule 4: never only „Teisingai!"; obis 56-review.js) */
  evidence(f,true);await talk(REASONS[right].rx,{where:'keep',onShow:()=>revStepText(REASONS[right].rx)});
  evidence(f,false);
  await revFix(E,f);
  const res={fid:f.fid,round:f.round+1,kind:f.kind,type:f.mist.type,how:f.mist.how,first,miss:R.miss,rmiss:R.rmiss,s:+(S.t-t0).toFixed(1)};REV.res.push(res);
  tev('klaida_pataisyta',{tipas:res.type,ratas:res.round,pirmu:first,klaidos:R.miss+R.rmiss});
}

/* ===== v5.4 the lesson clock (Kris 2026-11-17: „include the regular bcjr game timers - so that their game is cut short, time given to
   consolidate the mistakes AND on all computers all at once play the outro before turning back to class (away from computers) 6 or 7 mins
   before the lesson ends").
   The shared BCJR block (src/web/pamokos-laikrodis.html, Gabrielius's, from the obis/P7 pages) reads the timetable (Supabase view
   bcjr_tvarkarastis_v) and the server's clock, locks the page and reloads it when the lesson is unlocked. It is built into the web copy only
   (dist-web/index.html); the claude.ai copy and dist/kas-po-kauke.html have no block, so they always play at home pace.
   This file reads the block's state (window.__pbState, read-only) four times a second on the WALL clock (not the game clock, so ⏸ cannot
   hold it back) and plans the end of the lesson backwards from the lock:
       lock      = the timetable's ispejimas + 60 s (like every BCJR game; today = lesson end − 7 min);
                   lesson end − LOCK_BEFORE_END_S only when a row has no ispejimas (critic v5.4 #5)
       OUTRO_AT  = lock − OUTRO_S − LEAD_S                  (the ending, measured, + a few seconds of the held last frame)
       REVIEW_AT = OUTRO_AT − REVIEW_S                      (3 min to fix the mistakes)
   Class mode = today's timetable has a lesson now (its start ≤ now < its unlock). Home (no row, no network) = nothing here runs.
   At REVIEW_AT the game is cut gracefully (voice and moves stop, nothing left waiting for a tap) and „Pataisom klaidas" opens with the
   mistakes made so far; at OUTRO_AT every computer plays the ending at once, wherever the child is (no „Praleisti"); the last frame holds;
   at the lock the block shows Klaidas's farewell and blocks every tap; window.__pamokaUzrakinta freezes the game here. ===== */
const PAMOKA={
  LOCK_BEFORE_END_S:7*60,   // ⭐ the one number: the lock, before the lesson's end (iki). Kris: „6 or 7 mins before the lesson ends"
  REVIEW_S:180,             // „Pataisom klaidas" before the ending (3 min)
  OUTRO_S:60,               // the ending's length: measured 43.2-55.3 game s at speed 1 with voice (qa-tools/v54-outro-len.mjs, 2026-11-17), + margin
  LEAD_S:5,                 // the held last frame before the lock
  TRIAL_LEAD_S:3,           // „timer" trial: the cut comes this many seconds after typing it
};
const URLQ=new URLSearchParams(location.search);
let LOCKED=false;
const CLK={cls:false,trial:false,toLock:null,review:false,outro:false,row:null,log:[]};
const toSecP=t=>{const p=String(t).split(':').map(Number);return p[0]*3600+(p[1]||0)*60+(p[2]||0);};
/* the hooks the P9 copy of the block reads (see its header): the lock second of a timetable row, and the „timer" trial's length */
/* critic v5.4 #5: the timetable's own warning second + 60 s first, exactly like P7 / obis / the shared block, so editing ispejimas in
   Supabase moves P9 together with the other games; iki − LOCK_BEFORE_END_S only when a row has no ispejimas */
window.__pbUzraktas=r=>r&&r.ispejimas?toSecP(r.ispejimas)+60:(r&&r.iki?toSecP(r.iki)-PAMOKA.LOCK_BEFORE_END_S:null);
window.__pbBandymas=PAMOKA.REVIEW_S+PAMOKA.OUTRO_S+PAMOKA.LEAD_S+PAMOKA.TRIAL_LEAD_S;
/* Vilnius day and second (with the fraction), the block's own way (server time = Date.now() + offset) */
function vilnius(offset,simDow){
  const d=new Date(Date.now()+offset),g={};
  for(const p of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vilnius',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d))g[p.type]=p.value;
  const dow=({Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7})[g.weekday]||0;
  return {dow:simDow||dow,sec:(+g.hour%24)*3600+(+g.minute)*60+(+g.second)+d.getMilliseconds()/1000};
}
const lockOf=r=>window.__pbUzraktas(r)??(toSecP(r.ispejimas)+60);
function clockEval(){
  const st=typeof window.__pbState==='function'?window.__pbState():null;
  if(!st)return {cls:false,why:'no block'};
  if(st.pbSim!=null){const t=(Date.now()+st.offset-st.pbSim)/1000;return {cls:true,trial:true,toLock:(window.__pbBandymas||60)-t};}
  if(!st.rows)return {cls:false,why:'no timetable'};
  const {dow,sec}=vilnius(st.offset,st.simDow);
  for(const r of st.rows){
    if(+r.sav_diena!==dow||!r.atrakinti||!(r.iki||r.ispejimas))continue;
    const L=lockOf(r),from=r.nuo?toSecP(r.nuo):L-40*60;
    if(sec>=from&&sec<toSecP(r.atrakinti))return {cls:true,trial:false,toLock:L-sec,row:r};
  }
  return {cls:false,why:'no lesson now'};
}
const clockClass=()=>CLK.cls;
const clockAt=()=>{const o=CLK.toLock;if(o==null)return null;const out=o-PAMOKA.LEAD_S-PAMOKA.OUTRO_S;return {toLock:+o.toFixed(2),toOutro:+out.toFixed(2),toReview:+(out-PAMOKA.REVIEW_S).toFixed(2)};};
function clockLog(ev,o){const a=clockAt();CLK.log.push({ev,wall:new Date().toISOString(),scene:S.scene,...(a||{}),...(o||{})});}
/* stop what is happening, cleanly: nothing left waiting for a tap, no voice, no menu, no pause, no held piece */
function prepCut(){
  try{if(testOpen)closeTest();}catch(e){}
  try{if(window.Scorecard&&window.Scorecard.isOpen&&window.Scorecard.isOpen())window.Scorecard.close();}catch(e){}
  setPause(false);if(PC.armed)pieceArm(false);stopVoice('clock');cutBg();fade(false);hideOverlays();handHide();pulseOff();
}
function clockReview(){
  CLK.review=true;
  const L=S.L,played=S.started&&L&&L.rounds.flat().some(f=>f.out||f.nAsk||f.mist);
  if(!played){clockLog('review-skip',{why:'nothing played'});return;}
  if(S.scene==='review'||S.scene==='outro'){clockLog('review-skip',{why:'already in '+S.scene});return;}
  const rep=report(L);
  if(S.scene==='report'&&S.revSeen&&!rep.open){clockLog('review-skip',{why:'all fixed, waiting'});return;}
  clockLog('review-cut');tev('laikas_pertrauke',{kur:S.scene,klaidu:rep.open});
  prepCut();S.cutAt=S.scene;
  run(async()=>{await review({cut:true});await reportScene();});
}
function clockOutro(){
  CLK.outro=true;
  if(S.scene==='review'&&REV.on){REV.unfinished={i:REV.i,n:REV.list.length};tev('pataisom_nebaigta',{liko:REV.list.length-REV.i});clockLog('review-unfinished',{i:REV.i,n:REV.list.length});}
  clockLog('outro');prepCut();S.outroCls=true;S.started=true;
  run(()=>outro());
}
function clockTick(){
  if(LOCKED)return;
  const e=clockEval();CLK.cls=!!e.cls;CLK.trial=!!e.trial;CLK.toLock=e.cls?e.toLock:null;CLK.row=e.row||null;
  if(!e.cls)return;
  const a=clockAt();
  if(a.toOutro<=0){if(!CLK.outro&&a.toLock>2)clockOutro();return;}
  if(a.toReview<=0&&!CLK.review)clockReview();
}
setInterval(clockTick,250);

/* v5.5 E10 (Kris 11-18): at the lock Klaidas asks the class „Ar aš pasielgiau teisingai?". The words are on the lock screen under the farewell
   (P9 copy of the block, change ⑥); his voice plays here once, 0.8 s after the lock, on the game's own voice element (stopVoice('lock') has
   just stopped it, and the frozen game does not touch it again). That element was unlocked by the child's tap on Žaisti, so it may play now,
   minutes after the last tap, even where a browser asks for a tap per sound element (Chrome's strict rule, iPad Safari): a new Audio() was
   refused there (v55-unlock, NotAllowedError). The block blocks every tap while locked, so there is no 🔊 there: it would be a dead button.
   Sound off (🔊 switch) = no voice. It comes after the outro, so the ending's class timing (OUTRO_S) does not change. */
const LOCKASK={id:'K_ASK',played:null,err:null,at:null,el:null};
function lockAsk(){
  setTimeout(()=>{LOCKASK.at=new Date().toISOString();
    if(muted||!hasVoice('K_ASK')){LOCKASK.played=false;LOCKASK.err=muted?'muted':'no file';return;}
    try{const a=voEl||new Audio();LOCKASK.el=voEl?'voice':'new';a.onended=null;a.onerror=()=>{LOCKASK.err='load error';};a.src=voSrc('K_ASK');
      try{a.currentTime=0;}catch(e){}const p=a.play();
      if(p&&p.then)p.then(()=>{LOCKASK.played=true;},err=>{LOCKASK.played=false;LOCKASK.err=err&&err.name||'blocked';});else LOCKASK.played=true;}
    catch(e){LOCKASK.played=false;LOCKASK.err=String(e).slice(0,80);}
  },800);
}

<script>
(function(){
  'use strict';
  const SB = 'https://iiekmeylpppczicrsxho.supabase.co/rest/v1/bcjr_tvarkarastis_v?select=sav_diena,ispejimas,atrakinti,nuo,iki';   // P9 ①: + nuo,iki
  const KEY = 'sb_publishable_iJC59f30YJm7hU4OwZsLDQ_9FN-ygzF';
  let rows = null, offset = 0, simDow = 0, locked = false, was = '';
  let pbSim = null;                      // „timer“ bandymo pradžia (ms) arba null
  const juosta = document.getElementById('pbJuosta');
  /* Paskutinės 15 s — laikrodis centre; užrakinus — Klaidas su burbulu.
     Abu ekranai pointer-events:none, tad nieko neblokuoja patys; blokuoja užraktas. */
  function pbEkranai(f, liko){
    const lk = document.getElementById('pbLaikrodis'), gl = document.getElementById('pbGalas');
    if (!lk || !gl) return;
    const rodom = (f === 'ispejimas' && liko > 0);
    lk.classList.toggle('on', rodom);
    lk.classList.toggle('fin', rodom && liko <= 15);   // paskutinės 15 s — ryškiau ir didesnis
    if (rodom){
      const sk = lk.querySelector('.sk');
      if (sk.textContent !== String(liko)) sk.textContent = String(liko);
      lk.querySelector('.zo').textContent = (liko === 1) ? 'sekundė' : (liko >= 10) ? 'sekundžių' : 'sekundės';
    }
    gl.classList.toggle('on', f === 'uzrakinta');
  }

  function rodyk(f, liko){
    /* Juosta viršuje panaikinta 2026-09-23 (Kris): ji uždengdavo turinį, o juoda
       pabaigos juosta vaikams atrodė kaip klaidos pranešimas. Viskas persikėlė
       į šoninį ratą ir į Klaido atsisveikinimą. */
    juosta.style.display = 'none';
    document.body.style.paddingTop = '';
    document.body.classList.toggle('pb-uzrakinta', f === 'uzrakinta');
    pbEkranai(f || '', liko || 0);
  }
  const toSec = t => { const p = String(t).split(':').map(Number); return p[0]*3600 + (p[1]||0)*60 + (p[2]||0); };

  function dabar(){                       // Vilniaus laikas: {dow: ISO 1–7, sec: sekundės nuo vidurnakčio}
    const d = new Date(Date.now() + offset);
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Vilnius', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).formatToParts(d);
    const g = t => parts.find(p => p.type === t);
    const dow = ({Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7})[g('weekday').value] || 0;
    return { dow: simDow || dow, sec: (+g('hour').value % 24)*3600 + (+g('minute').value)*60 + (+g('second').value) };
  }
  function busena(){                      // '' | 'ispejimas' | 'uzrakinta', + kiek sekundžių liko iki užrakto
    if (pbSim !== null){                 // „timer" bandymas — 60 s įspėjimas, tada užraktas
      const T = +window.__pbBandymas || 60;   // P9 ③: the page may ask for a longer trial (its whole ending); else 60 s
      const t = (Date.now() + offset - pbSim) / 1000;
      return t < T ? { f:'ispejimas', liko: Math.max(1, Math.ceil(T - t)) } : { f:'uzrakinta', liko: 0 };
    }
    const { dow, sec } = dabar();
    for (const r of rows){
      if (!r.ispejimas || !r.atrakinti || +r.sav_diena !== dow) continue;
      const b = toSec(r.atrakinti);
      /* P9 ②: the lock second L may come from the page (P9: iki − 7 min); without it L = ispejimas + 60 s, as before. The warning is the minute before L. */
      let L = null; try { if (typeof window.__pbUzraktas === 'function') L = window.__pbUzraktas(r); } catch(e){}
      if (!(L > 0)) L = toSec(r.ispejimas) + 60;
      const a = L - 60;
      if (sec >= a && sec < b) return sec < L ? { f:'ispejimas', liko: L - sec } : { f:'uzrakinta', liko: 0 };
    }
    return { f:'', liko: 0 };
  }
  function tick(){
    if (!rows && pbSim === null) return;
    const { f, liko } = busena();
    rodyk(f, liko);
    if (f === 'uzrakinta' && !locked){
      locked = true;
      try { if (typeof window.__pamokaUzrakinta === 'function') window.__pamokaUzrakinta(); } catch(e){}
      try { document.activeElement && document.activeElement.blur(); } catch(e){}
    }
    if (f !== 'uzrakinta' && locked){ locked = false; location.reload(); }   // atrakinta — švarus startas
    was = f;
  }
  /* ── „timer" — pabaigos sekos bandymas bet kada (Kris 2026-09-23) ──────
     Vaikui nematomas, kaip ir „test". Nieko nerašo į duomenų bazę: seka
     sukasi tik šitame lange, tad tikrų pamokų laikai lieka nepaliesti. */
  let pbBuf = '';
  window.addEventListener('keydown', e => {
    if (pbSim !== null && e.key === 'Escape'){       // nutraukiam — švarus startas
      pbSim = null; locked = false; e.stopImmediatePropagation(); e.preventDefault();
      location.reload(); return;
    }
    if (!e.key || e.key.length !== 1) return;
    pbBuf = (pbBuf + e.key.toLowerCase()).slice(-5);
    if (pbBuf === 'timer'){
      pbBuf = ''; e.stopImmediatePropagation(); e.preventDefault();
      pbSim = Date.now() + offset; tick();
    }
  }, { capture:true });

  // užrakinus — jokio klavišo, pelės ar lietimo nepasiekia žaidimo (capture fazė ant window eina PRIEŠ document)
  ['keydown','keyup','keypress','pointerdown','pointerup','mousedown','mouseup','click','dblclick','touchstart','touchend','wheel','contextmenu']
    .forEach(t => window.addEventListener(t, e => { if (locked){ e.stopImmediatePropagation(); e.preventDefault(); } }, { capture:true, passive:false }));

  /* P9 ④: read-only state for the page (it plans its ending backwards from the lock); nothing here can be changed through it */
  window.__pbState = () => ({ rows: rows ? rows.slice() : null, offset, simDow, pbSim, locked });

  const sim = new URLSearchParams(location.search).get('laikas');
  /* Tvarkaraštis persiimamas kas 60 s. Anksčiau jis buvo imamas tik atidarant
     puslapį, tad pakeitus laikus atidarytas langas apie tai nesužinodavo. */
  setInterval(() => {
    fetch(SB, { headers:{ apikey:KEY, Authorization:'Bearer '+KEY }, cache:'no-store' })
      .then(r => r.json()).then(j => { if (Array.isArray(j) && j.length) rows = j; }).catch(()=>{});
  }, 60000);

  fetch(SB, { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } })
    .then(r => { const d = r.headers.get('Date'); if (d) offset = new Date(d).getTime() - Date.now(); return r.json(); })
    .then(j => {
      rows = Array.isArray(j) ? j : [];
      if (sim){                           // testo jungiklis: perstumia laikrodį į nurodytą Vilniaus laiką
        const m = sim.match(/^(?:(\d)@)?(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (m){ simDow = +(m[1]||0); const want = (+m[2])*3600 + (+m[3])*60 + (+(m[4]||0)); offset += (want - dabar().sec) * 1000; }
      }
      tick(); setInterval(tick, 1000);
    })
    .catch(() => {});                     // nėra ryšio / lentelės — laikrodžio nėra, žaidimas veikia kaip visada
})();
