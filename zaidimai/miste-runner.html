<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miste Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --ground: #f7f7f7;
    --ink: #535353;
    --muted: #8f8f8f;
    --guide: #c9c9c9;
  }
  html, body { margin: 0; background: var(--ground); }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-family: "Press Start 2P", "Courier New", monospace;
  }
  .stage { width: min(100% - 32px, 900px); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--ground);
    image-rendering: pixelated;
    outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--guide); }
  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    justify-content: center;
    align-items: center;
    margin: 18px 0 0;
    font-size: 9px;
    line-height: 1;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .keys .group { display: flex; align-items: center; gap: 6px; }
  kbd {
    display: inline-block;
    font: inherit;
    color: var(--ink);
    border: 2px solid var(--muted);
    border-bottom-width: 4px;
    padding: 6px 7px 5px;
  }
  .keys .sep { width: 2px; height: 14px; background: var(--guide); }
</style>

<div class="stage">
  <canvas id="game" width="900" height="300" tabindex="0" aria-label="Miste Runner. Press 1 to 5 to jump to that ruler mark. Space starts the game."></canvas>
  <p class="keys">
    <span class="group"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> JUMP TO RULER MARK</span>
    <span class="sep"></span>
    <span class="group"><kbd>SPACE</kbd> START / RESTART</span>
  </p>
</div>

<script>
(() => {
  'use strict';

  // ---------- canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- geometry & tuning ----------
  const GROUND_Y = 250;          // y of the ground line (Miste's feet when standing)
  const STEP = 32;               // px between ruler marks
  const MISTE_X = 160;
  const MISTE_W = 20, MISTE_H = 32;
  const GRAVITY = 1260;          // px/s^2  -> jump 1 ~0.45 s, jump 5 ~1.0 s airtime
  const BASE_SPEED = 300;        // px/s at score 0
  const MAX_SPEED_MULT = 2.6;
  const RULER_X = 118;
  const HITBOX_INSET = 3;
  const RESTART_LOCK = 0.4;      // s after death before a key restarts

  const BG = '#f7f7f7', INK = '#535353', MUTED = '#8f8f8f', GUIDE = '#c9c9c9', CLOUD = '#dcdcdc';
  const FONT = '"Press Start 2P", "Courier New", monospace';

  const airtime = k => 2 * Math.sqrt(2 * k * STEP / GRAVITY);
  const jumpV0 = k => Math.sqrt(2 * GRAVITY * k * STEP);
  const wallHeight = k => Math.round((k - 0.6) * STEP);           // jump k clears, k-1 does not
  const skyBottomAbove = band => Math.round((band + 1.5) * STEP); // jump band clears, band+1 hits

  // ---------- pixel maps (scale 2, '#' = ink) ----------
  const MISTE_BODY = [
    '...####...',
    '..######..',
    '..##.###..',
    '..######..',
    '...####...',
    '....##....',
    '..######..',
    '.########.',
    '#..####..#',
    '#..####..#',
    '...####...',
  ];
  const MISTE_RUN1 = MISTE_BODY.concat([
    '..###.##..',
    '..##...##.',
    '.##.....#.',
    '.#.......#',
    '##........',
  ]);
  const MISTE_RUN2 = MISTE_BODY.concat([
    '..##.###..',
    '.##...##..',
    '.#.....##.',
    '#.......#.',
    '........##',
  ]);
  const MISTE_JUMP = MISTE_BODY.concat([
    '..##..##..',
    '.##....##.',
    '.##....##.',
    '..........',
    '..........',
  ]);
  const MISTE_DEAD = [
    '...####...',
    '..######..',
    '..#.##.#..',
    '..######..',
    '...####...',
    '....##....',
    '..######..',
    '.########.',
    '#..####..#',
    '#..####..#',
    '...####...',
    '..##..##..',
    '..##..##..',
    '..##..##..',
    '..##..##..',
    '.###..###.',
  ];
  const BIRD = [[
    '....##......',
    '....###.....',
    '.#########..',
    '##########..',
    '..#######...',
    '...####.....',
    '............',
    '............',
  ], [
    '............',
    '............',
    '.#########..',
    '##########..',
    '..#######...',
    '...####.....',
    '....###.....',
    '....##......',
  ]];
  const PLANE = [[
    '..............#.........',
    '..............##........',
    '#..........###.....###..',
    '#....##############..#..',
    '########################',
    '#....##############..#..',
    '#.............##........',
    '..............#.........',
  ], [
    '#.............#.........',
    '#.............##........',
    '#..........###.....###..',
    '.....##############..#..',
    '########################',
    '.....##############..#..',
    '..............##........',
    '..............#.........',
  ]];
  const CLOUD_MAP = [
    '......####.........',
    '....########.......',
    '..############.....',
    '.##################',
    '###################',
  ];

  function drawMap(map, x, y, color, scale = 2) {
    ctx.fillStyle = color;
    x = Math.round(x); y = Math.round(y);
    for (let r = 0; r < map.length; r++) {
      const row = map[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] === '#') ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  }

  // brick pillar: ink block with light mortar lines carved out
  function drawWall(x, top, w, h) {
    x = Math.round(x); top = Math.round(top);
    ctx.fillStyle = INK;
    ctx.fillRect(x, top, w, h);
    ctx.fillStyle = BG;
    let course = 0;
    for (let yy = GROUND_Y - 8; yy > top + 3; yy -= 8, course++) {
      ctx.fillRect(x + 2, yy, w - 4, 2);
      const off = course % 2 ? 8 : 4;
      for (let xx = x + off; xx < x + w - 2; xx += 8) ctx.fillRect(xx, yy - 6, 2, 6);
    }
  }

  function text(str, x, y, size, align, color) {
    ctx.font = size + 'px ' + FONT;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color || INK;
    ctx.fillText(str, x, y);
  }

  // ---------- state ----------
  function loadHi() { try { return Math.floor(+localStorage.getItem('miste-hi')) || 0; } catch (e) { return 0; } }
  function saveHi(v) { try { localStorage.setItem('miste-hi', String(v)); } catch (e) {} }

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));

  const state = {
    mode: 'title',            // title | running | dead
    time: 0,
    score: 0,
    hi: loadHi(),
    speed: BASE_SPEED,
    distance: 0,
    sinceSpawn: 0,
    nextSpawn: 0,
    obstacleCount: 0,         // obstacles spawned this run; every 3rd is a single, the rest are pairs
    miste: { y: GROUND_Y, onGround: true, jumpT: 0, v0: 0, level: 0, animT: 0, frame: 0 },
    obstacles: [],
    lines: [1, 2, 3, 4, 5],   // visible guide lines
    milestone100: 0,
    milestone200: 0,
    flashUntil: 0,
    notice: null,             // { text, until }
    deadAt: 0,
    pebbles: [],
    clouds: [],
  };
  window.__miste = state;

  for (let i = 0; i < 28; i++) state.pebbles.push({ x: rand(0, W), w: randInt(2, 6), dy: randInt(6, 14) });
  for (let i = 0; i < 3; i++) state.clouds.push({ x: rand(0, W), y: rand(36, 96) });

  function start() {
    state.mode = 'running';
    state.score = 0;
    state.speed = BASE_SPEED;
    state.distance = 0;
    state.sinceSpawn = 0;
    state.nextSpawn = BASE_SPEED * 1.2;
    state.obstacleCount = 0;
    state.obstacles = [];
    state.lines = [1, 2, 3, 4, 5];
    state.milestone100 = 0;
    state.milestone200 = 0;
    state.flashUntil = 0;
    state.notice = null;
    Object.assign(state.miste, { y: GROUND_Y, onGround: true, jumpT: 0, v0: 0, level: 0, animT: 0, frame: 0 });
  }

  function jump(k) {
    const m = state.miste;
    if (state.mode !== 'running' || !m.onGround) return;
    m.onGround = false;
    m.jumpT = 0;
    m.v0 = jumpV0(k);
    m.level = k;
  }

  function die() {
    state.mode = 'dead';
    state.deadAt = state.time;
    const s = Math.floor(state.score);
    if (s > state.hi) { state.hi = s; saveHi(s); }
  }

  // ---------- obstacles ----------
  // Each obstacle: { x, width, parts: [{ kind, dx, w, top, bottom }] } with top/bottom in canvas y.
  function makeWall(level, tiles) {
    const h = wallHeight(level), w = 16 * tiles;
    return { kind: 'wall', dx: 0, w: w, h: h, level: level, top: GROUND_Y - h, bottom: GROUND_Y };
  }
  function makeSky(kind, band, dx) {
    const w = kind === 'bird' ? 24 : 48, h = 16;
    const bottom = GROUND_Y - skyBottomAbove(band);
    return { kind: kind, band: band, dx: dx, w: w, h: h, top: bottom - h, bottom: bottom, seed: Math.random() };
  }
  function skyKindFor(band) {
    if (band <= 1) return 'bird';
    if (band >= 3) return 'plane';
    return Math.random() < 0.5 ? 'bird' : 'plane';
  }

  function pickType(score) {
    const choices = [{ t: 'ground', w: 5 }];
    if (score >= 40) choices.push({ t: 'bird', w: score < 200 ? 2 : 3 });
    if (score >= 150) choices.push({ t: 'plane', w: 2 });
    const total = choices.reduce((s, c) => s + c.w, 0);
    let r = Math.random() * total;
    for (const c of choices) { r -= c.w; if (r <= 0) return c.t; }
    return 'ground';
  }

  function spawnObstacle() {
    const score = state.score;
    const maxLevel = score < 100 ? 3 : score < 300 ? 4 : 5;
    // rhythm: pair, pair, single. Pairs (wall + sky) leave a gap only one number fits;
    // every 3rd obstacle is a lone wall, bird or plane.
    state.obstacleCount++;
    const type = state.obstacleCount % 3 === 0 ? pickType(score) : 'combo';
    const parts = [];
    if (type === 'ground') {
      const level = randInt(1, maxLevel);
      parts.push(makeWall(level, level <= 3 && Math.random() < 0.35 ? 2 : 1));
    } else if (type === 'bird') {
      parts.push(makeSky('bird', randInt(0, score < 200 ? 1 : 2), 0));
    } else if (type === 'plane') {
      parts.push(makeSky('plane', randInt(2, 4), 0));
    } else { // combo: wall level k + sky band k -> only jump k passes
      const k = randInt(1, Math.min(4, maxLevel));
      const wall = makeWall(k, 1);
      const kind = skyKindFor(k);
      const skyW = kind === 'bird' ? 24 : 48;
      parts.push(wall, makeSky(kind, k, Math.round(wall.w / 2 - skyW / 2)));
    }
    const left = Math.min.apply(null, parts.map(p => p.dx));
    const right = Math.max.apply(null, parts.map(p => p.dx + p.w));
    state.obstacles.push({ x: W + 24 - left, width: right - left, type: type, parts: parts });
    state.sinceSpawn = 0;
    state.nextSpawn = state.speed * (airtime(5) + 0.55) + Math.random() * state.speed * 0.9;
  }

  function collides() {
    const m = state.miste;
    const ax1 = MISTE_X + HITBOX_INSET, ax2 = MISTE_X + MISTE_W - HITBOX_INSET;
    const ay1 = m.y - MISTE_H + HITBOX_INSET, ay2 = m.y - 1;
    for (const o of state.obstacles) {
      for (const p of o.parts) {
        const bx1 = o.x + p.dx + HITBOX_INSET, bx2 = o.x + p.dx + p.w - HITBOX_INSET;
        const by1 = p.top + HITBOX_INSET, by2 = p.bottom - (p.kind === 'wall' ? 0 : HITBOX_INSET);
        if (ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1) return true;
      }
    }
    return false;
  }

  // ---------- update ----------
  function update(dt) {
    state.time += dt;
    const m = state.miste;

    // clouds drift always
    for (const c of state.clouds) {
      c.x -= (state.mode === 'running' ? state.speed * 0.12 : 12) * dt;
      if (c.x < -40) { c.x = W + rand(20, 200); c.y = rand(36, 96); }
    }

    if (state.mode !== 'running') return;

    state.speed = BASE_SPEED * Math.min(MAX_SPEED_MULT, 1 + 0.1 * Math.floor(state.score / 100));
    const dx = state.speed * dt;
    state.distance += dx;
    state.score += dx / 30;

    const m100 = Math.floor(state.score / 100);
    if (m100 > state.milestone100) { state.milestone100 = m100; state.flashUntil = state.time + 0.6; }
    const m200 = Math.floor(state.score / 200);
    if (m200 > state.milestone200) {
      state.milestone200 = m200;
      if (state.lines.length) {
        const gone = state.lines.splice(Math.floor(Math.random() * state.lines.length), 1)[0];
        state.notice = { text: 'GUIDE ' + gone + ' GONE', until: state.time + 1.6 };
      }
    }

    // Miste: analytic jump so the apex lands exactly on the ruler mark
    if (m.onGround) {
      m.animT += dt;
      m.frame = Math.floor(m.animT * 8) % 2;
    } else {
      m.jumpT += dt;
      const t = m.jumpT;
      const hgt = m.v0 * t - 0.5 * GRAVITY * t * t;
      if (hgt <= 0) { m.y = GROUND_Y; m.onGround = true; m.level = 0; }
      else m.y = GROUND_Y - hgt;
    }

    // scenery
    for (const p of state.pebbles) { p.x -= dx; if (p.x < -8) { p.x = W + rand(0, 40); p.w = randInt(2, 6); p.dy = randInt(6, 14); } }

    // obstacles
    for (const o of state.obstacles) o.x -= dx;
    state.obstacles = state.obstacles.filter(o => o.x + o.width > -10);
    state.sinceSpawn += dx;
    if (state.sinceSpawn >= state.nextSpawn) spawnObstacle();

    if (collides()) die();
  }

  // ---------- render ----------
  function render() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    const t = state.time;
    const m = state.miste;

    for (const c of state.clouds) drawMap(CLOUD_MAP, c.x, c.y, CLOUD);

    // guide lines
    ctx.strokeStyle = GUIDE;
    ctx.lineWidth = 2;
    ctx.setLineDash([2, 4]);
    for (const k of state.lines) {
      const y = GROUND_Y - k * STEP + 1;
      ctx.beginPath(); ctx.moveTo(RULER_X + 2, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.setLineDash([]);

    // ruler
    ctx.fillStyle = MUTED;
    ctx.fillRect(RULER_X, GROUND_Y - 5 * STEP - 6, 2, 5 * STEP + 8);
    for (let k = 1; k <= 5; k++) {
      const y = GROUND_Y - k * STEP;
      ctx.fillStyle = MUTED;
      ctx.fillRect(RULER_X - 6, y, 8, 2);
      text(String(k), RULER_X - 11, y + 5, 10, 'right', INK);
    }

    // ground
    ctx.fillStyle = INK;
    ctx.fillRect(0, GROUND_Y, W, 2);
    ctx.fillStyle = MUTED;
    for (const p of state.pebbles) ctx.fillRect(Math.round(p.x), GROUND_Y + p.dy, p.w, 2);

    // obstacles
    const flap = Math.floor(t * 6) % 2;
    for (const o of state.obstacles) {
      for (const p of o.parts) {
        const x = o.x + p.dx;
        if (p.kind === 'wall') drawWall(x, p.top, p.w, p.h);
        else if (p.kind === 'bird') drawMap(BIRD[(flap + (p.seed > 0.5 ? 1 : 0)) % 2], x, p.top, INK);
        else drawMap(PLANE[Math.floor(t * 20) % 2], x, p.top, INK);
      }
    }

    // Miste
    let sprite;
    if (state.mode === 'dead') sprite = MISTE_DEAD;
    else if (!m.onGround) sprite = MISTE_JUMP;
    else if (state.mode === 'running') sprite = m.frame ? MISTE_RUN2 : MISTE_RUN1;
    else sprite = MISTE_RUN1;
    drawMap(sprite, MISTE_X, m.y - MISTE_H, INK);

    // HUD
    const scoreStr = String(Math.floor(state.score)).padStart(5, '0');
    const hiStr = String(state.hi).padStart(5, '0');
    const flashing = t < state.flashUntil && Math.floor(t * 8) % 2 === 0;
    if (state.hi > 0) text('HI ' + hiStr, W - 16 - 5 * 10 - 22, 26, 10, 'right', MUTED);
    if (!flashing) text(scoreStr, W - 16, 26, 10, 'right', INK);
    if (state.notice && t < state.notice.until) text(state.notice.text, W - 16, 46, 8, 'right', MUTED);

    // overlays
    if (state.mode === 'title') {
      text('MISTE RUNNER', W / 2 + 60, 112, 16, 'center', INK);
      text('PRESS 1-5 TO JUMP TO THAT MARK', W / 2 + 60, 142, 8, 'center', MUTED);
      text('SPACE TO START', W / 2 + 60, 162, 8, 'center', MUTED);
    } else if (state.mode === 'dead') {
      text('GAME OVER', W / 2 + 60, 112, 14, 'center', INK);
      if (t - state.deadAt > RESTART_LOCK) text('PRESS SPACE TO RUN AGAIN', W / 2 + 60, 142, 8, 'center', MUTED);
    }
  }

  // ---------- input ----------
  function levelFromEvent(e) {
    const c = /^(?:Digit|Numpad)([1-5])$/.exec(e.code || '');
    if (c) return +c[1];
    if (/^[1-5]$/.test(e.key || '')) return +e.key;
    return 0;
  }
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const level = levelFromEvent(e);
    const isStart = e.code === 'Space' || e.code === 'Enter' || e.key === ' ';
    if (!level && !isStart) return;
    e.preventDefault();
    if (state.mode === 'title') { start(); if (level) jump(level); }
    else if (state.mode === 'dead') { if (state.time - state.deadAt > RESTART_LOCK) { start(); if (level) jump(level); } }
    else if (level) jump(level);
  });
  canvas.addEventListener('pointerdown', () => canvas.focus());

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(frame);
})();
</script>

</html>
