<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miste Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --ground: #f7f7f7;
    --ink: #535353;
    --muted: #8f8f8f;
    --guide: #c9c9c9;
  }
  html, body { margin: 0; background: var(--ground); }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-family: "Press Start 2P", "Courier New", monospace;
  }
  .stage { width: min(100% - 32px, 900px); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: var(--ground);
    image-rendering: pixelated;
    outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--guide); }
  .keys {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    justify-content: center;
    align-items: center;
    margin: 18px 0 0;
    font-size: 9px;
    line-height: 1;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .keys .group { display: flex; align-items: center; gap: 6px; }
  kbd, .keys button {
    display: inline-block;
    font: inherit;
    color: var(--ink);
    background: var(--ground);
    border: 2px solid var(--muted);
    border-bottom-width: 4px;
    padding: 6px 7px 5px;
    letter-spacing: inherit;
  }
  .keys button { cursor: pointer; }
  .keys button:active { border-bottom-width: 2px; transform: translateY(2px); }
  .keys button:disabled { color: var(--guide); border-color: var(--guide); cursor: default; }
  .keys button:focus-visible { outline: 2px dashed var(--ink); outline-offset: 2px; }
  .keys label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .keys input[type="checkbox"] { width: 14px; height: 14px; margin: 0; accent-color: var(--ink); }
  .keys .sep { width: 2px; height: 14px; background: var(--guide); }
</style>

<div class="stage">
  <canvas id="game" width="900" height="300" tabindex="0" aria-label="Miste Runner. Spausk 1–5, kad peršoktum į liniuotės žymą. Tarpas pradeda žaidimą."></canvas>
  <p class="keys">
    <span class="group"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> ŠUOLIS Į LINIUOTĖS ŽYMĄ</span>
    <span class="sep"></span>
    <span class="group"><kbd>TARPAS</kbd> PRADĖTI / IŠ NAUJO</span>
    <span class="sep"></span>
    <span class="group">
      <button id="sayBtn" type="button" disabled title="Perskaityti klausimą garsiai (arba spausk TARPĄ)">🔊 PERSKAITYK</button>
      <label><input type="checkbox" id="autoRead"> SKAITYTI AUTOMATIŠKAI</label>
    </span>
  </p>
</div>

    if (!q) return;

    if (src && player) {

      const p = player.play();
      if (p && p.catch) p.catch(() => {});
    } else if (typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance === 'function') {

  }

  function drawMap(map, x, y, color, scale = 2) {
    ctx.fillStyle = color;
    x = Math.round(x); y = Math.round(y);
    for (let r = 0; r < map.length; r++) {
      const row = map[r];
      for (let c = 0; c < row.length; c++) {
        if (row[c] === '#') ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  }

  // brick pillar: ink block with light mortar lines carved out
  function drawWall(x, top, w, h) {
    x = Math.round(x); top = Math.round(top);
    ctx.fillStyle = INK;
    ctx.fillRect(x, top, w, h);
    ctx.fillStyle = BG;
    let course = 0;
    for (let yy = GROUND_Y - 8; yy > top + 3; yy -= 8, course++) {
      ctx.fillRect(x + 2, yy, w - 4, 2);
      const off = course % 2 ? 8 : 4;
      for (let xx = x + off; xx < x + w - 2; xx += 8) ctx.fillRect(xx, yy - 6, 2, 6);
    }
  }

  function text(str, x, y, size, align, color) {
    ctx.font = size + 'px ' + FONT;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = color || INK;
    ctx.fillText(str, x, y);
  }
  function textWidth(str, size) {
    ctx.font = size + 'px ' + FONT;
    const m = ctx.measureText(str);
    return (m && typeof m.width === 'number') ? m.width : str.length * size;
  }
  // greedy word wrap; returns { size, lines } shrinking the font until it fits in maxLines
  function wrap(str, size, maxW, maxLines) {
    for (;;) {
      const words = str.split(' ');
      const lines = [];
      let cur = '';
      for (const w of words) {
        const cand = cur ? cur + ' ' + w : w;
        if (textWidth(cand, size) <= maxW || !cur) cur = cand;
        else { lines.push(cur); cur = w; }
      }
      if (cur) lines.push(cur);
      if (lines.length <= maxLines || size <= 12) return { size, lines };
      size -= 2;
    }
  }

    state.milestone100 = 0;
    state.milestone200 = 0;
    state.flashUntil = 0;
    state.notice = null;
    Object.assign(state.miste, { y: GROUND_Y, onGround: true, jumpT: 0, v0: 0, level: 0, animT: 0, frame: 0, apexDone: true });
    stopSpeech();
    resetQuiz();
  }

  function jump(k) {
    const m = state.miste;
    if (state.mode !== 'running' || !m.onGround) return;
    m.onGround = false;
    m.jumpT = 0;
    m.v0 = jumpV0(k);
    m.level = k;
    m.apexDone = false;
  }

  function die() {
    state.mode = 'dead';
    state.deadAt = state.time;
    stopSpeech();
    const s = Math.floor(state.score);
    if (s > state.hi) { state.hi = s; saveHi(s); }
  }

  // ---------- quiz ----------
  function nextQuestion() {
    const z = state.quiz;
    if (!z.order.length || z.idx >= z.order.length) {
      let order = shuffled(QUIZ);
      if (z.q && order.length > 1 && order[0].id === z.q.id) order.push(order.shift()); // no immediate repeat
      z.order = order; z.idx = 0;
    }
    return z.order[z.idx++];
  }

  function beginQuestion() {
    const z = state.quiz;
    z.q = nextQuestion();
    z.phase = 'approach';
    z.colX = COL_START_X;
    z.chosen = 0; z.result = ''; z.msg = '';
    z.asked++;
    if (state.autoRead) speak(z.q);
  }

  function columnOverlapsMiste() {
    const z = state.quiz;
    return z.colX <= MISTE_X + MISTE_W && z.colX + COL_W >= MISTE_X;
  }

  function answer(level) {
    const z = state.quiz, q = z.q;
    if (!q || level < 1 || level > q.a.length) return;
    z.chosen = level;
    let dur;
    if (q.ok === 0) { z.result = 'any'; z.msg = q.reply[level - 1]; state.score += QUIZ_BONUS; dur = 2; }
    else if (level === q.ok) { z.result = 'ok'; z.msg = 'TEISINGAI! +' + QUIZ_BONUS; state.score += QUIZ_BONUS; dur = 1.5; }
    else { z.result = 'bad'; z.msg = 'NE. TEISINGAI: ' + q.a[q.ok - 1]; dur = 2.5; }
    z.phase = 'feedback';
    z.feedbackUntil = state.time + dur;
    stopSpeech();
  }

  function onApex(level) {
    const z = state.quiz;
    if ((z.phase === 'approach' || z.phase === 'wait') && columnOverlapsMiste()) answer(level);
  }

  function updateQuiz(dt) {
    const z = state.quiz;
    switch (z.phase) {
      case 'none':
        z.speedMult = 1;
        z.timer += dt;
        if (z.timer >= state.quizEvery) z.phase = 'pending';
        break;
      case 'pending':
        if (state.obstacles.length === 0) beginQuestion();
        break;
      case 'approach':
        z.speedMult = Math.max(QUIZ_SLOW, z.speedMult - dt / 1.0);
        if (z.colX <= COL_LOCK_X) { z.colX = COL_LOCK_X; z.phase = 'wait'; z.speedMult = 0; }
        break;
      case 'wait':
        z.speedMult = 0;
        break;
      case 'feedback':
        z.speedMult = 0;
        if (state.time >= z.feedbackUntil) z.phase = 'exit';
        break;
      case 'exit':
        z.speedMult = Math.min(1, z.speedMult + dt / 1.5);
        if (z.colX + COL_W < -10) { z.phase = 'none'; z.timer = 0; z.q = null; z.speedMult = 1; }
        break;
    }
  }

  // ---------- obstacles ----------
  // Each obstacle: { x, width, parts: [{ kind, dx, w, top, bottom }] } with top/bottom in canvas y.
  function makeWall(level, tiles) {
    const h = wallHeight(level), w = 16 * tiles;
    return { kind: 'wall', dx: 0, w: w, h: h, level: level, top: GROUND_Y - h, bottom: GROUND_Y };
  }
  function makeSky(kind, band, dx) {
    const w = kind === 'bird' ? 24 : 48, h = 16;
    const bottom = GROUND_Y - skyBottomAbove(band);
    return { kind: kind, band: band, dx: dx, w: w, h: h, top: bottom - h, bottom: bottom, seed: Math.random() };
  }
  function skyKindFor(band) {
    if (band <= 1) return 'bird';
    if (band >= 3) return 'plane';
    return Math.random() < 0.5 ? 'bird' : 'plane';
  }

  function pickType(score) {
    const choices = [{ t: 'ground', w: 5 }];
    if (score >= 40) choices.push({ t: 'bird', w: score < 200 ? 2 : 3 });
    if (score >= 150) choices.push({ t: 'plane', w: 2 });
    const total = choices.reduce((s, c) => s + c.w, 0);
    let r = Math.random() * total;
    for (const c of choices) { r -= c.w; if (r <= 0) return c.t; }
    return 'ground';
  }

  function spawnObstacle() {
    const score = state.score;
    const maxLevel = score < 100 ? 3 : score < 300 ? 4 : 5;
    // rhythm: pair, pair, single. Pairs (wall + sky) leave a gap only one number fits;
    // every 3rd obstacle is a lone wall, bird or plane.
    state.obstacleCount++;
    const type = state.obstacleCount % 3 === 0 ? pickType(score) : 'combo';
    const parts = [];
    if (type === 'ground') {
      const level = randInt(1, maxLevel);
      parts.push(makeWall(level, level <= 3 && Math.random() < 0.35 ? 2 : 1));
    } else if (type === 'bird') {
      parts.push(makeSky('bird', randInt(0, score < 200 ? 1 : 2), 0));
    } else if (type === 'plane') {
      parts.push(makeSky('plane', randInt(2, 4), 0));
    } else { // combo: wall level k + sky band k -> only jump k passes
      const k = randInt(1, Math.min(4, maxLevel));
      const wall = makeWall(k, 1);
      const kind = skyKindFor(k);
      const skyW = kind === 'bird' ? 24 : 48;
      parts.push(wall, makeSky(kind, k, Math.round(wall.w / 2 - skyW / 2)));
    }
    const left = Math.min.apply(null, parts.map(p => p.dx));
    const right = Math.max.apply(null, parts.map(p => p.dx + p.w));
    state.obstacles.push({ x: W + 24 - left, width: right - left, type: type, parts: parts });
    state.sinceSpawn = 0;
    state.nextSpawn = state.speed * (airtime(5) + 0.55) + Math.random() * state.speed * 0.9;
  }

  function collides() {
    const m = state.miste;
    const ax1 = MISTE_X + HITBOX_INSET, ax2 = MISTE_X + MISTE_W - HITBOX_INSET;
    const ay1 = m.y - MISTE_H + HITBOX_INSET, ay2 = m.y - 1;
    for (const o of state.obstacles) {
      for (const p of o.parts) {
        const bx1 = o.x + p.dx + HITBOX_INSET, bx2 = o.x + p.dx + p.w - HITBOX_INSET;
        const by1 = p.top + HITBOX_INSET, by2 = p.bottom - (p.kind === 'wall' ? 0 : HITBOX_INSET);
        if (ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1) return true;
      }
    }
    return false;
  }

  // ---------- update ----------
  function update(dt) {
    state.time += dt;
    const m = state.miste;
    const z = state.quiz;

    // clouds drift always
    for (const c of state.clouds) {
      c.x -= (state.mode === 'running' ? Math.max(12, state.speed * z.speedMult * 0.12) : 12) * dt;
      if (c.x < -40) { c.x = W + rand(20, 200); c.y = rand(36, 96); }
    }

    if (state.mode !== 'running') return;

    updateQuiz(dt);

    state.speed = BASE_SPEED * Math.min(MAX_SPEED_MULT, 1 + 0.1 * Math.floor(state.score / 100));
    const dx = state.speed * z.speedMult * dt;
    state.distance += dx;
    state.score += dx / 30;

    const m100 = Math.floor(state.score / 100);
    if (m100 > state.milestone100) { state.milestone100 = m100; state.flashUntil = state.time + 0.6; }
    const m200 = Math.floor(state.score / 200);
    if (m200 > state.milestone200) {
      state.milestone200 = m200;
      if (state.lines.length) {
        const gone = state.lines.splice(Math.floor(Math.random() * state.lines.length), 1)[0];
        state.notice = { text: 'LINIJA ' + gone + ' DINGO', until: state.time + 1.6 };
      }
    }

    // Miste: analytic jump so the apex lands exactly on the ruler mark; run animation never stops
    m.animT += dt;
    m.frame = Math.floor(m.animT * 8) % 2;
    if (!m.onGround) {
      m.jumpT += dt;
      const t = m.jumpT;
      if (!m.apexDone && t >= m.v0 / GRAVITY) { m.apexDone = true; onApex(m.level); }
      const hgt = m.v0 * t - 0.5 * GRAVITY * t * t;
      if (hgt <= 0) { m.y = GROUND_Y; m.onGround = true; m.level = 0; }
      else m.y = GROUND_Y - hgt;
    }

    // scenery
    for (const p of state.pebbles) { p.x -= dx; if (p.x < -8) { p.x = W + rand(0, 40); p.w = randInt(2, 6); p.dy = randInt(6, 14); } }

    // answer column scrolls with the world (locked column has dx = 0)
    if (z.q && z.phase !== 'wait' && z.phase !== 'feedback') z.colX -= dx;

    // obstacles
    for (const o of state.obstacles) o.x -= dx;
    state.obstacles = state.obstacles.filter(o => o.x + o.width > -10);
    state.sinceSpawn += dx;
    if (z.phase === 'none' && state.sinceSpawn >= state.nextSpawn) spawnObstacle();

    if (collides()) die();
  }

  // ---------- render ----------
  function drawQuiz() {
    const z = state.quiz, q = z.q;
    if (!q) return;
    const t = state.time;

    // question (or feedback) in huge type across the top
    const banner = z.phase === 'feedback' ? z.msg : q.q;
    const w = wrap(banner, 22, W - 40, 2);
    const lineH = w.size + 8;
    const y0 = w.lines.length === 1 ? 62 : 62 - lineH / 2;
    const color = z.phase === 'feedback' && z.result === 'bad' ? MUTED : INK;
    w.lines.forEach((ln, i) => text(ln, W / 2, y0 + i * lineH, w.size, 'center', color));

    // answer rows between ruler marks: option k sits between marks k and k+1
    if (z.phase === 'exit' && z.colX + COL_W < 0) return;
    const x = Math.round(z.colX);
    for (let k = 1; k <= q.a.length; k++) {
      const top = GROUND_Y - (k + 1) * STEP + 3, h = STEP - 5;
      const chosen = z.chosen === k && (z.phase === 'feedback' || z.phase === 'exit');
      const isRight = q.ok === k && z.result === 'bad' && (z.phase === 'feedback' || z.phase === 'exit');
      ctx.fillStyle = chosen ? INK : BG;
      ctx.fillRect(x, top, COL_W, h);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.setLineDash(isRight ? [4, 3] : []);
      ctx.strokeRect(x + 1, top + 1, COL_W - 2, h - 2);
      ctx.setLineDash([]);
      // number square at the left edge
      ctx.fillStyle = chosen ? BG : INK;
      ctx.fillRect(x + 4, top + 4, h - 8, h - 8);
      text(String(k), x + 4 + (h - 8) / 2, top + h / 2 + 4, 10, 'center', chosen ? INK : BG);
      // option text, shrunk if it does not fit
      const maxW = COL_W - h - 12;
      let size = 14;
      while (size > 10 && textWidth(q.a[k - 1], size) > maxW) size -= 2;
      text(q.a[k - 1], x + h + 4, top + h / 2 + size / 2 - 1, size, 'left', chosen ? BG : INK);
    }
    // gentle pulse on the hint while waiting for the jump
    if (z.phase === 'wait' && Math.floor(t * 2) % 2 === 0) text('ŠOK Į ATSAKYMĄ: 1, 2 AR 3', W - 16, 46, 8, 'right', MUTED);
  }

  function render() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    const t = state.time;
    const m = state.miste;
    const z = state.quiz;

    for (const c of state.clouds) drawMap(CLOUD_MAP, c.x, c.y, CLOUD);

    // guide lines
    ctx.strokeStyle = GUIDE;
    ctx.lineWidth = 2;
    ctx.setLineDash([2, 4]);
    for (const k of state.lines) {
      const y = GROUND_Y - k * STEP + 1;
      ctx.beginPath(); ctx.moveTo(RULER_X + 2, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.setLineDash([]);

    // ruler
    ctx.fillStyle = MUTED;
    ctx.fillRect(RULER_X, GROUND_Y - 5 * STEP - 6, 2, 5 * STEP + 8);
    for (let k = 1; k <= 5; k++) {
      const y = GROUND_Y - k * STEP;
      ctx.fillStyle = MUTED;
      ctx.fillRect(RULER_X - 6, y, 8, 2);
      text(String(k), RULER_X - 11, y + 5, 10, 'right', INK);
    }

    // ground
    ctx.fillStyle = INK;
    ctx.fillRect(0, GROUND_Y, W, 2);
    ctx.fillStyle = MUTED;
    for (const p of state.pebbles) ctx.fillRect(Math.round(p.x), GROUND_Y + p.dy, p.w, 2);

    // obstacles
    const flap = Math.floor(t * 6) % 2;
    for (const o of state.obstacles) {
      for (const p of o.parts) {
        const x = o.x + p.dx;
        if (p.kind === 'wall') drawWall(x, p.top, p.w, p.h);
        else if (p.kind === 'bird') drawMap(BIRD[(flap + (p.seed > 0.5 ? 1 : 0)) % 2], x, p.top, INK);
        else drawMap(PLANE[Math.floor(t * 20) % 2], x, p.top, INK);
      }
    }

    // quiz column goes behind Miste
    if (state.mode === 'running') drawQuiz();

    // Miste
    let sprite;
    if (state.mode === 'dead') sprite = MISTE_DEAD;
    else if (!m.onGround) sprite = MISTE_JUMP;
    else if (state.mode === 'running') sprite = m.frame ? MISTE_RUN2 : MISTE_RUN1;
    else sprite = MISTE_RUN1;
    drawMap(sprite, MISTE_X, m.y - MISTE_H, INK);

    // HUD
    const scoreStr = String(Math.floor(state.score)).padStart(5, '0');
    const hiStr = String(state.hi).padStart(5, '0');
    const flashing = t < state.flashUntil && Math.floor(t * 8) % 2 === 0;
    if (state.hi > 0) text('REK ' + hiStr, W - 16 - 5 * 10 - 22, 26, 10, 'right', MUTED);
    if (!flashing) text(scoreStr, W - 16, 26, 10, 'right', INK);
    if (state.notice && t < state.notice.until && !z.q) text(state.notice.text, W - 16, 46, 8, 'right', MUTED);

    // overlays
    if (state.mode === 'title') {
      text('MISTE RUNNER', W / 2 + 60, 112, 16, 'center', INK);
      text('SPAUSK 1-5: ŠUOLIS Į TĄ ŽYMĄ', W / 2 + 60, 142, 8, 'center', MUTED);
      text('TARPAS: PRADĖTI', W / 2 + 60, 162, 8, 'center', MUTED);
    } else if (state.mode === 'dead') {
      text('ŽAIDIMAS BAIGTAS', W / 2 + 60, 112, 14, 'center', INK);
      if (t - state.deadAt > RESTART_LOCK) text('SPAUSK TARPĄ: BĖK VĖL', W / 2 + 60, 142, 8, 'center', MUTED);
    }
  }

  // ---------- input ----------
  function levelFromEvent(e) {
    const c = /^(?:Digit|Numpad)([1-5])$/.exec(e.code || '');
    if (c) return +c[1];
    if (/^[1-5]$/.test(e.key || '')) return +e.key;
    return 0;
  }
  const questionActive = () => state.mode === 'running' && !!state.quiz.q && state.quiz.phase !== 'exit';
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const level = levelFromEvent(e);
    const isStart = e.code === 'Space' || e.code === 'Enter' || e.key === ' ';
    if (!level && !isStart) return;
    e.preventDefault();
    if (state.mode === 'title') { start(); if (level) jump(level); }
    else if (state.mode === 'dead') { if (state.time - state.deadAt > RESTART_LOCK) { start(); if (level) jump(level); } }
    else if (level) {
      const z = state.quiz;
      if (z.phase === 'wait' && level > z.q.a.length) return; // nothing to jump into up there
      jump(level);
    }
    else if (isStart && questionActive()) speak(state.quiz.q);
  });
  canvas.addEventListener('pointerdown', () => canvas.focus());

  const sayBtn = document.getElementById('sayBtn');
  const autoBox = document.getElementById('autoRead');
  if (sayBtn) sayBtn.addEventListener('click', () => { if (questionActive()) speak(state.quiz.q); canvas.focus(); });
  if (autoBox) {
    autoBox.checked = state.autoRead;
    autoBox.addEventListener('change', () => { state.autoRead = !!autoBox.checked; saveAuto(state.autoRead); canvas.focus(); });
  }
  function syncControls() {
    if (sayBtn) sayBtn.disabled = !questionActive();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    syncControls();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(frame);
})();
</script>

</html>
